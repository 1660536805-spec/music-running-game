<!doctype html>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ============ HUD 容器 ============ */

  .glass{

    border:calc(1px) solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:calc(26 * var(--px));
    box-shadow:0 calc(10 * var(--px)) calc(30 * var(--px)) rgba(14,35,54,.18);

  .music .cover{width:calc(86*var(--px));height:calc(86*var(--px));border-radius:calc(18*var(--px));

  /* ---------- 摇杆 / 圆钮 ---------- */

    border-radius:50%;border:calc(3*var(--px)) solid rgba(255,255,255,.34);
    background:rgba(255,255,255,.10);backdrop-filter:blur(6px)}
  .stick:after{content:"";position:absolute;left:50%;top:50%;

  .rbtns{right:calc(150*var(--px));bottom:calc(56*var(--px));display:flex;align-items:center;gap:calc(24*var(--px))}

  .rbtns b.big{width:calc(104*var(--px));height:calc(104*var(--px));background:rgba(255,255,255,.20);
    font-size:calc(40*var(--px))}
  /* 参考图右缘中部的独立跑步圆钮 */
  .runbtn{right:calc(66*var(--px));top:42%;transform:translateY(-50%)}
  .runbtn b{width:calc(86*var(--px));height:calc(86*var(--px));border-radius:50%;

  /* ---------- 洞穴收集提示 ---------- */

  /* ---------- 小地图 ---------- */

    border-left:calc(20*var(--px)) solid transparent;border-right:calc(20*var(--px)) solid transparent;
    border-bottom:calc(38*var(--px)) solid #fff;
    filter:drop-shadow(0 calc(3*var(--px)) calc(6*var(--px)) rgba(40,70,95,.35))}
  .map .label{font-size:calc(28*var(--px));font-weight:700;color:#fff;
    text-shadow:0 calc(3*var(--px)) calc(11*var(--px)) rgba(30,60,85,.55);letter-spacing:.20em}

  /* ---------- HOME 标题菜单 ---------- */
  .title{left:calc(46*var(--px));top:calc(150*var(--px))}
  .title h1{font-size:calc(132*var(--px));font-weight:800;color:#fff;letter-spacing:.01em;
    line-height:1;text-shadow:0 calc(6*var(--px)) calc(30*var(--px)) rgba(24,64,96,.38)}
  .title p{font-size:calc(32*var(--px));font-weight:500;color:#fff;
    margin-top:calc(28*var(--px));letter-spacing:.10em;
    text-shadow:0 calc(3*var(--px)) calc(16*var(--px)) rgba(24,64,96,.42)}
  .menu{margin-top:calc(66*var(--px));display:flex;flex-direction:column;gap:calc(20*var(--px))}
  .menu button{width:calc(330*var(--px));height:calc(64*var(--px));border-radius:calc(999*var(--px));
    border:calc(1.5px) solid rgba(255,255,255,.16);background:rgba(42,70,88,.50);
    backdrop-filter:blur(13px);color:#fff;font-family:inherit;cursor:pointer;
    font-size:calc(27*var(--px));font-weight:600;letter-spacing:.10em;
    display:flex;align-items:center;gap:calc(18*var(--px));padding-left:calc(30*var(--px));
    transition:transform .16s,background .16s;pointer-events:auto;
    box-shadow:0 calc(7*var(--px)) calc(22*var(--px)) rgba(14,35,54,.16)}

  .menu button.primary{background:rgba(186,244,200,.96);color:#204055;border-color:rgba(186,244,200,.96);
    box-shadow:0 calc(10*var(--px)) calc(30*var(--px)) rgba(120,220,170,.36)}
  .menu button .ic{font-size:calc(28*var(--px));width:calc(30*var(--px));text-align:center}

  /* ============ 开发调试层 ============ */
  #cmp{position:fixed;inset:0;z-index:13;display:none;pointer-events:none}
  #cmp.on{display:block}
  #cmp img{width:100%;height:100%;object-fit:fill}
  #cmpbar{position:fixed;left:14px;bottom:14px;z-index:14;display:none;gap:8px;align-items:center;
    background:rgba(10,18,28,.72);color:#fff;padding:8px 12px;border-radius:10px;font-size:12px}
  #cmpbar.on{display:flex}
  #dbg{position:fixed;right:10px;bottom:10px;z-index:20;display:none;
    background:rgba(10,18,28,.76);color:#9fe8ff;font:11px/1.5 ui-monospace,Menlo,monospace;
    padding:8px 10px;border-radius:8px;max-width:44vw;white-space:pre-wrap}
  #dbg.on{display:block}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11;transition:opacity .1s}

<body>
<div id="stage"></div>
<div class="flash" id="flash"></div>
<div id="huds"></div>
<div id="divider"></div>
<div id="cmp"><img id="cmpimg" alt="" /></div>
<div id="cmpbar">对比叠加 <input id="cmpslider" type="range" min="0" max="100" value="50" /><span id="cmpval">50%</span></div>

<script src="./three.min.js"></script>
<script>
/* ============================================================================
   声浪星球 Soundwave Planet — 低多边形 3D（四场景 · 1:1 视觉复刻版）
   ========================================================================== */
(function(){
'use strict';

/* ---------------------------------------------------------------- 0. 参数 */
var Q = new URLSearchParams(location.search);
var FREEZE   = Q.get('freeze') === '1';
var SHOWCASE = Q.get('showcase') === '1';
var COMPARE  = Q.get('compare') === '1';
var STARTKEY = Q.get('scene') || 'home';
if (SHOWCASE) STARTKEY = 'showcase';
var DBG = Q.get('dbg') === '1';

var _seed = 0x2F6E2B1 >>> 0;
function srand(s){ _seed = (s >>> 0) || 1; }
function rnd(){ _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0; return _seed / 4294967296; }
function rr(a,b){ return a + (b-a)*rnd(); }
function ri(a,b){ return Math.floor(rr(a, b + 0.999)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
/* 独立确定性随机序列：供"零漂移"新增元素使用——走自己的 seed，绝不触碰全局 _seed，
   因此可以在已调好的场景里任意插入随机外观的元素而不打乱既有构图 */
function dseq(seed){ var s = (seed >>> 0) || 1; return function(){ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function sstep(t){ t = clamp(t,0,1); return t*t*(3-2*t); }
function D2R(d){ return d*Math.PI/180; }

/* ------------------------------------------------------------------ 工具 */
function shade(hex,k){
  var c = new THREE.Color(hex);
  c.r = Math.min(1, c.r*k); c.g = Math.min(1, c.g*k); c.b = Math.min(1, c.b*k);
  return c.getHex();
}
/* ------------------------------------------------------- 程序化 canvas 贴图
   合规说明：规范禁止 PBR / 照片纹理 / 法线贴图。这里全部由 canvas 现画渐变、
   条纹、噪点生成（与已有 blobTex() 同类），只用来做柔和过渡与层次，不引入真实影像。 */
var _ptexCache = {};
function _pSeed(s){ return function(){ s = (s*1664525 + 1013904223) & 0x7fffffff; return s / 0x7fffffff; }; }
function ptex(key, cA, cB, opt){
  opt = opt || {};
  var bands = opt.bands || 0, grains = opt.n || 0, size = opt.size || 128;
  var rp = opt.rep || [1, 1];
  var ck = [key, cA, cB, bands, grains, size, rp[0], rp[1]].join('|');
  if (_ptexCache[ck]) return _ptexCache[ck];

  var S = size, cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  var g = cv.getContext('2d');
  var rndT = _pSeed(0x51F3A7 + S + bands*17 + grains);
  var a = '#' + ('000000' + (cA >>> 0).toString(16)).slice(-6);
  var b = '#' + ('000000' + (cB >>> 0).toString(16)).slice(-6);
  var lg = g.createLinearGradient(0, 0, 0, S);
  lg.addColorStop(0, a); lg.addColorStop(1, b);
  g.fillStyle = lg; g.fillRect(0, 0, S, S);

  /* 横向柔和条带（地层 / 纬度带 / 水流纹） */
  for (var i = 0; i < bands; i++){
    var y = (i + 0.5) / bands * S;
    var hb = S / bands * (0.35 + 0.30*rndT());
    g.globalAlpha = 0.08 + 0.07*rndT();
    g.fillStyle = (i % 2) ? '#ffffff' : '#000000';
    g.fillRect(0, y - hb*0.5, S, hb);
  }
  /* 细颗粒噪点，破掉大色块的塑料感 */
  for (var j = 0; j < grains; j++){
    var x2 = rndT()*S, y2 = rndT()*S, r2 = 1 + rndT()*3.2;
    g.globalAlpha = 0.025 + rndT()*0.055;
    g.fillStyle = rndT() < 0.5 ? '#ffffff' : '#000000';
    g.beginPath(); g.arc(x2, y2, r2, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;

  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rp[0], rp[1]);
  t.needsUpdate = true;
  _ptexCache[ck] = t;
  return t;
}

/* 地表通用柔和噪点贴图（与顶点色相乘，只做柔化不做图案） */
function terrainTex(rep){
  rep = rep || [10, 8];
  return ptex('terrain', 0xFFFFFF, 0xDEDEDE, { n: 80, rep: rep });
}

function M(color, o){
  o = o || {};
  var m = new THREE.MeshLambertMaterial({
    color: color, flatShading: true,
    emissive: o.emissive != null ? o.emissive : 0x000000,
    transparent: !!o.transparent,
    opacity: o.opacity != null ? o.opacity : 1,
    side: o.side || THREE.FrontSide,
    depthWrite: o.depthWrite !== false,
    fog: o.fog !== false
  });
  if (o.map) m.map = o.map;
  if (o.emissive != null) m.emissiveIntensity = o.ei != null ? o.ei : 1;
  return m;
}
function basic(color, o){
  o = o || {};
  return new THREE.MeshBasicMaterial({
    color: color, transparent: !!o.transparent, opacity: o.opacity != null ? o.opacity : 1,
    side: o.side || THREE.FrontSide, depthWrite: o.depthWrite !== false,
    blending: o.additive ? THREE.AdditiveBlending : THREE.NormalBlending, fog: o.fog !== false
  });
}
function add(parent, geo, mat, x, y, z, opts){
  opts = opts || {};
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x||0, y||0, z||0);
  if (opts.rot) m.rotation.set(opts.rot[0]||0, opts.rot[1]||0, opts.rot[2]||0);
  if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.recv !== false;
  parent.add(m);
  return m;
}
function grp(parent, x,y,z){ var g = new THREE.Group(); g.position.set(x||0,y||0,z||0); parent.add(g); return g; }

function makeSky(zenith, horizon, groundBelow){
  var R = 4000;
  var g = new THREE.SphereGeometry(R, 28, 18);
  var p = g.attributes.position, cols = [];
  var cz = new THREE.Color(zenith), ch = new THREE.Color(horizon), cg = new THREE.Color(groundBelow || horizon);
  for (var i = 0; i < p.count; i++){
    var y = p.getY(i) / R;
    var c = y > 0 ? ch.clone().lerp(cz, Math.pow(y, 0.32)) : ch.clone().lerp(cg, Math.pow(-y, 0.6));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false
  }));
  m.renderOrder = -1000;
  return m;
}

/* 低多边形起伏地表 */
function planeTerrain(W, D, SW, SD, hFn, cFn, jitter){
  var g = new THREE.PlaneGeometry(W, D, SW, SD);
  g.rotateX(-Math.PI / 2);
  var p = g.attributes.position;
  for (var i = 0; i < p.count; i++) p.setY(i, hFn(p.getX(i), p.getZ(i)));
  var ng = g.toNonIndexed();
  ng.computeVertexNormals();
  var np = ng.attributes.position, cols = [];
  var j = jitter == null ? 0.13 : jitter;
  for (var k = 0; k < np.count; k += 3){
    var cx = (np.getX(k) + np.getX(k+1) + np.getX(k+2)) / 3;
    var cz = (np.getZ(k) + np.getZ(k+1) + np.getZ(k+2)) / 3;
    var cy = (np.getY(k) + np.getY(k+1) + np.getY(k+2)) / 3;
    var col = new THREE.Color(shade(cFn(cx, cz, cy), 1 - j/2 + j*rnd()));
    for (var t = 0; t < 3; t++) cols.push(col.r, col.g, col.b);
  }
  ng.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  ng.computeVertexNormals();
  return ng;
}

/* 浮岛：起伏草皮顶盖 + 不规则车削岩体 */
function floatingIsland(opt){
  opt = opt || {};
  var R = opt.r, seg = opt.seg || 11;
  var g = new THREE.Group();
  var thick = opt.thick || 2.2;
  var bumpy = opt.bumpy == null ? 1 : opt.bumpy;
  var cliff = opt.cliff || 0x9AAE9C, rockC = opt.rock || 0x8FA6AC;

  /* 1) 草皮顶盖（边缘起伏、顶面微隆） */
  var cap = new THREE.CylinderGeometry(R*0.985, R, thick, seg, 1);
  var pp = cap.attributes.position;
  for (var i = 0; i < pp.count; i++){
    var x = pp.getX(i), y = pp.getY(i), z = pp.getZ(i);
    var ang = Math.atan2(z, x);
    var j = 1 + 0.075*Math.sin(ang*3.0 + R*0.7) + (rnd() - 0.5)*0.065*bumpy;
    pp.setX(i, x*j); pp.setZ(i, z*j);
    if (y > 0) pp.setY(i, y + (rnd() - 0.55)*0.30*bumpy);
  }
  cap.computeVertexNormals();
  var capMesh = new THREE.Mesh(cap, M(opt.top, { emissive: shade(opt.top, 0.20), ei: 1 }));
  capMesh.castShadow = capMesh.receiveShadow = true;
  g.add(capMesh);

  /* 2) 岩体：车削体（顶部宽、腰部微鼓、底部收尖） */
  var H = opt.coneH || 12;
  var prof = [], nP = 7;
  for (var s = nP; s >= 0; s--){
    var t = s/nP;
    var rad = R * (1 - Math.pow(t, 0.90)*0.965);
    /* 双频扰动：让岩体轮廓出现"层叠台阶"而不是光滑圆锥（参考图浮岛底部是分层的岩石锥） */
    rad *= 1 + 0.16*Math.sin(t*5.1 + R*0.9) + 0.09*Math.sin(t*11.3 + R*2.1);
    rad *= 1 + 0.13*Math.sin(t*Math.PI);
    if (s === 0) rad = R*0.995;
    prof.push(new THREE.Vector2(Math.max(R*0.045, rad), -thick/2 - t*H));
  }
  var rockGeo = new THREE.LatheGeometry(prof, seg);
  var rp = rockGeo.attributes.position;
  for (var k = 0; k < rp.count; k++){
    var s2 = 1 + (rnd() - 0.5)*0.18*bumpy;
    rp.setX(k, rp.getX(k)*s2); rp.setZ(k, rp.getZ(k)*s2);
  }
  rockGeo.computeVertexNormals();
  /* 岩体贴地层条纹贴图（LatheGeometry 的 v 恰好沿剖面自上而下，最适合做岩层） */
  var rockMat = M(rockC, { emissive: shade(rockC, 0.28), ei: 1,
    map: ptex('islrock', shade(rockC, 1.14), shade(rockC, 0.58), { bands: 13, n: 36 }) });
  var rockMesh = new THREE.Mesh(rockGeo, rockMat);
  rockMesh.castShadow = true;
  g.add(rockMesh);

  /* 3) 岩块碎屑 */
  var n = opt.chunks == null ? 5 : opt.chunks;
  for (var c2 = 0; c2 < n; c2++){
    var a2 = rr(0, 6.283), rad2 = R*rr(0.32, 0.90);
    var ch = add(g, new THREE.IcosahedronGeometry(rr(0.6,1.5)*(R/12), 0), M(shade(cliff, rr(0.84,1.10))),
      Math.cos(a2)*rad2, -thick/2 - rr(0.6, H*0.72), Math.sin(a2)*rad2);
    ch.rotation.set(rr(0,3), rr(0,3), rr(0,3));
  }
  return g;
}

function waterfall(w, h){
  var g = new THREE.Group();
  for (var i = 0; i < 3; i++){
    var m = add(g, new THREE.PlaneGeometry(w*(1 - i*0.20), h),
      M(0xEAF9FF, { transparent: true, opacity: 0.60 - i*0.14, side: THREE.DoubleSide,
                    emissive: 0xBFEFFF, ei: 0.60, depthWrite: false,
                    map: ptex('flow', 0xFFFFFF, 0xBFE4F5, { bands: 9, n: 14, rep: [1, 2] }) }),
      (i - 1)*w*0.22, -h/2, (i - 1)*0.20);
    m.userData.phase = i*1.7;
  }
  var mist = add(g, new THREE.SphereGeometry(w*0.72, 7, 5),
    M(0xFFFFFF, { transparent: true, opacity: 0.66, emissive: 0xEAF7FF, ei: 0.5, depthWrite: false }), 0, -h*0.02, 0);
  mist.scale.set(1, 0.45, 1);
  g.userData.mist = mist;
  /* 落点消散：底部两团由浓到淡的软雾，让瀑布"化进云里"而不是被硬切成一截矩形
     （纯几何追加，零 rnd 消耗 → 全场景随机序列与构图零漂移） */
  var tail = [];
  var tailSpec = [[0.90, 1.06, 0.50], [1.05, 1.50, 0.24]];
  for (var ti = 0; ti < tailSpec.length; ti++){
    var tp = tailSpec[ti];
    var tm = add(g, new THREE.SphereGeometry(w*tp[1], 8, 6),
      M(0xFFFFFF, { transparent: true, opacity: tp[2], emissive: 0xEAF7FF, ei: 0.5, depthWrite: false }),
      0, -h*tp[0], 0, { cast: false, recv: false });
    tm.scale.set(1, 0.55, 1);
    tm.userData.phase = ti*1.6; tm.userData.baseOpacity = tp[2];
    tail.push(tm);
  }
  g.userData.tail = tail;
  g.userData.isFall = true;
  return g;
}

function lowPolyTree(opt){
  opt = opt || {};

  var th = opt.h || 4;
  add(g, new THREE.CylinderGeometry(th*0.055, th*0.085, th*0.46, 5), M(opt.trunk || 0x8A6A52), 0, th*0.23, 0)
    .rotation.set(rr(-0.05,0.05), rr(0,3), rr(-0.05,0.05));
  var crownN = opt.crown || 3, baseC = opt.leaf || 0x5FA85A;
  /* 分层树冠：自下而上逐层收小、逐层提亮（模拟顶部受光），破除"三个球堆一起"的塑料感 */
  for (var i = 0; i < crownN; i++){

    var cy = th*(0.42 + i*0.16) + r*0.30;

    .rotation.y = rr(0,3);
  g.userData.swayable = true;   /* 交给主循环做随风轻摆（不新增任何 draw call） */

}

function crystalCluster(opt){
  opt = opt || {};
  var g = new THREE.Group();
  var h = opt.h || 3.2;
  var sides = opt.sides || 6;
  var glow = opt.glow == null ? 0.30 : opt.glow;
  /* 单根晶体：棱面宝石（底大顶尖棱锥 + 八面体尖），整体高约 sc*2.0
     注意：本函数内部 rnd 消费次数保持不变（仅换几何/材质），保证各场景随机序列零漂移 */
  function shard(sc, x, z, col, tilt, slim){
    var grp2 = new THREE.Group();
    /* 柱身偏暗、尖顶提亮：形成"根暗尖亮"的宝石渐变；半透明出宝石质感 */
    var mat = M(col, { emissive: shade(col, 0.42), ei: 1, transparent: true, opacity: 0.92 });
    var matTip = M(shade(col, 1.18), { emissive: shade(col, 0.66), ei: 1, transparent: true, opacity: 0.92 });
    var rb = 0.40*sc*(slim ? 0.7 : 1.0), rt = 0.26*sc*(slim ? 0.7 : 1.0);
    var bodyH = sc*1.42;
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0, rb*1.35, bodyH, sides, 1), mat);
    body.position.y = bodyH*0.5;
    var tip = new THREE.Mesh(new THREE.OctahedronGeometry(sc*0.34, 0), matTip);
    tip.scale.set(0.8, 2.2, 0.8);
    tip.position.y = bodyH + sc*0.30;
    body.castShadow = tip.castShadow = true;
    grp2.add(body); grp2.add(tip);
    grp2.position.set(x, 0, z);
    grp2.rotation.set(tilt ? rr(-0.20,0.20) : 0, rr(0,6.283), tilt ? rr(-0.20,0.20) : 0);
    g.add(grp2);
    return grp2;
  }
  var main = shard(h*0.5, 0, 0, opt.color || 0x59D5ED, true, false);
  g.userData.main = main;
  var n = opt.n == null ? 3 : opt.n;
  for (var i = 0; i < n; i++){
    var a = rr(0, 6.283), d = rr(0.30, 0.90)*h*0.42;
    shard(h*rr(0.18, 0.34), Math.cos(a)*d, Math.sin(a)*d,
      (opt.color2 && rnd() < 0.5) ? opt.color2 : (opt.color || 0x59D5ED), true, rnd() < 0.4);
  }
  if (opt.n == null || opt.n < 6){
    for (var j = 0; j < 3; j++){
      var a2 = rr(0, 6.283), d2 = rr(0.5, 1.05)*h*0.42;
      shard(h*rr(0.08, 0.16), Math.cos(a2)*d2, Math.sin(a2)*d2,
        (opt.color2 || opt.color || 0x59D5ED), true, true);
    }
  }
  return g;
}

/* 实体红岩拱（确定性，不消耗随机数）：参考图沙漠的巨型岩桥——极粗壮、下挂浮岩 */
function rockArch(){
  var g = new THREE.Group();
  var c = 0xCB7059;
  var mat = M(c, { emissive: shade(c, 0.24), ei: 1 });
  var mat2 = M(shade(c, 0.90), { emissive: shade(c, 0.22), ei: 1 });
  /* 实体粗拱 */
  add(g, new THREE.TorusGeometry(13.5, 6.5, 6, 20, Math.PI), mat, 0, 13.2, 0);
  /* 两条短拱脚——参考图里浮空岩体下缘是垂坠岩柱，不落地 */
  add(g, new THREE.CylinderGeometry(5.0, 6.4, 7, 7), mat, -13.5, 9.6, 0);
  add(g, new THREE.CylinderGeometry(5.0, 6.4, 7, 7), mat, 13.5, 9.6, 0);
  /* 沿拱线内外两排岩块，把拱完全包成岩桥 */
  for (var i = 0; i < 22; i++){
    var a = Math.PI * (i + 0.5) / 22;
    var row = i % 2;
    var rad = row ? 12.0 : 14.8;
    var ck = add(g, new THREE.IcosahedronGeometry(row ? 3.4 : 4.8, 0), row ? mat2 : mat,
      -Math.cos(a)*rad, 13.2 + Math.sin(a)*rad, row ? -2.2 : 2.2);
    ck.scale.set(1.3, 0.85, 1.15);
    ck.rotation.set(0.22, a*1.7, 0.12);
  }
  /* 拱顶脊线 */
  for (var rj = 0; rj < 8; rj++){
    var a2 = Math.PI * (rj + 0.5) / 8;
    var rk = add(g, new THREE.IcosahedronGeometry(2.5, 0), mat2,
      -Math.cos(a2)*13.5, 13.2 + Math.sin(a2)*13.5 + 6.9, 0);
    rk.scale.set(1.55, 0.72, 1.1);
    rk.rotation.set(0.15, a2, 0.1);
  }
  /* 岩体下缘垂挂的浮岩（浮空后紧贴底盘，不拖到地面） */
  var hang = [[-8, 3.0, 2.6], [0, 0.5, 3.4], [7, 3.5, 2.3], [-3.5, 5.2, 1.8], [3.5, 5.8, 1.6]];
  for (var h2i = 0; h2i < hang.length; h2i++){
    var hp = hang[h2i];
    var hk = add(g, new THREE.IcosahedronGeometry(hp[2], 0), mat2, hp[0], hp[1], h2i % 2 ? 1.2 : -1.2);
    hk.scale.set(1, 1.25, 1);
    hk.rotation.set(0.3, h2i*0.9, 0.2);
  }
  /* 两翼脱落的浮岩（浮空后收到底缘两侧作碎岩） */
  var feet = [[-19.5, 7.8, 1.6], [19.0, 8.4, 2.1], [-16.5, 6.9, 1.2], [16.8, 6.7, 1.4]];
  for (var f2i = 0; f2i < feet.length; f2i++){
    var fp = feet[f2i];
    var fk = add(g, new THREE.IcosahedronGeometry(fp[2], 0), mat2, fp[0], fp[1], f2i % 2 ? 1.4 : -1.4);
    fk.rotation.set(f2i*0.4, f2i*1.1, f2i*0.3);
  }
  return g;
}

function ringGate(opt){

/* 渐变光柱（体内顶点色：顶端亮、底端暗，配加性混合 → 光柱自上而下自然消散，
   不会像等亮度圆柱那样读成"白色磨砂柱子"） */
function beamCone(rTop, rBot, h, cTop, cBot, opacity){
  var g = new THREE.CylinderGeometry(rTop, rBot, h, 16, 1, true);
  var p = g.attributes.position, cols = [];
  var cT = new THREE.Color(cTop), cB = new THREE.Color(cBot);
  for (var i = 0; i < p.count; i++){
    var t = clamp(p.getY(i)/h + 0.5, 0, 1);          /* 0=底 1=顶 */
    var c = cB.clone().lerp(cT, Math.pow(t, 1.45));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide, depthWrite: false, fog: false }));
  m.castShadow = false; m.receiveShadow = false;
  return m;
}

/* ------------------------------------------------ S2 细节层 helper（全部零全局 rnd）
   用途：把元素补进"已经调好的场景"。因此一律走 dseq() 独立随机序列，
   不消耗全局 rnd → 插到任意位置都不会引起既有构图漂移。 */

/* 地被草丛：n 片三角草叶合并为单几何（1 draw call / 丛），基部暗、叶尖亮 */
function grassTuft(opt){
  opt = opt || {};
  var n = opt.n || 7, h = opt.h || 0.55, c = opt.c || 0x5FA85A;
  var R = dseq(opt.seed || 0x9E37);
  var pos = [], col = [], idx = [];
  var cb = new THREE.Color(shade(c, 0.58)), ct = new THREE.Color(shade(c, 1.20));
  for (var i = 0; i < n; i++){
    var a = R()*6.283, lean = 0.14 + R()*0.34, hh = h*(0.70 + R()*0.66);
    var w = h*0.085, dx = Math.cos(a), dz = Math.sin(a), vi = pos.length/3;
    pos.push(-dz*w, 0, dx*w);
    pos.push( dz*w, 0, -dx*w);
    pos.push(dx*lean*hh, hh, dz*lean*hh);
    col.push(cb.r,cb.g,cb.b, cb.r,cb.g,cb.b, ct.r,ct.g,ct.b);
    idx.push(vi, vi+1, vi+2);
  }
  var g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

/* 飘落花瓣：加性点云（1 draw call），点在 y 上限内循环下落 + 横向飘摆 */
function petalFall(opt){
  opt = opt || {};
  var n = opt.n || 60, R = dseq(opt.seed || 0x7E7A);
  var w = opt.w || 26, y0 = opt.y0 == null ? 0.2 : opt.y0, y1 = opt.y1 == null ? 12 : opt.y1;
  var z0 = opt.z0 == null ? 2 : opt.z0, z1 = opt.z1 == null ? 46 : opt.z1;
  var pos = new Float32Array(n*3), base = new Float32Array(n*3);
  var ph = new Float32Array(n), sp = new Float32Array(n);
  for (var i = 0; i < n; i++){
    base[i*3]   = (R()*2 - 1)*w;
    base[i*3+1] = y0 + R()*(y1 - y0);
    base[i*3+2] = -(z0 + R()*(z1 - z0));

  pos.set(base);
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    map: petalTex(), color: opt.color == null ? 0xFFC2E4 : opt.color,
    size: opt.size || 0.34, sizeAttenuation: true, transparent: true,
    opacity: opt.opacity == null ? 0.90 : opt.opacity, depthWrite: false, fog: true }));
  pts.frustumCulled = false;

var DRG = { white:0xF2F4F0, gray:0xB9BFC1, dark:0x3B4146, packG:0x9FB895, packW:0xD2D7D2,

  g.userData.parts = { armL:armL, armR:armR, legL:legL, legR:legR, tail:tailGrp, tailSegs:tailSegs, head:head, pack:pack };

function poseHero(h, mode, t, lift){
  var p = h.userData.parts;
  lift = lift || 0;
  if (mode === 'run'){
    var ph = t*10.5;
    p.armL.rotation.x = Math.sin(ph)*0.95; p.armR.rotation.x = -Math.sin(ph)*0.95;
    p.legL.rotation.x = -Math.sin(ph)*0.95; p.legR.rotation.x = Math.sin(ph)*0.95;
    h.rotation.z = Math.sin(ph)*0.045; h.rotation.x = 0.05;
    h.position.y = h.userData.baseY + lift + Math.abs(Math.sin(ph))*0.06;
  } else {
    var ph2 = t*1.9;
    p.armL.rotation.x = Math.sin(ph2)*0.10; p.armR.rotation.x = -Math.sin(ph2)*0.10;
    p.legL.rotation.x = 0.02; p.legR.rotation.x = -0.02;
    h.rotation.z = 0; h.rotation.x = 0;
    h.position.y = h.userData.baseY + lift + Math.sin(ph2)*0.045;
    p.head.rotation.y = Math.sin(t*0.6)*0.12;
  }
  for (var i = 0; i < p.tailSegs.length; i++){
    var s = p.tailSegs[i], tt = s.userData.t;
    /* 保留排布基准 x（userData.bx），在其上叠加逐节摆动 */
    s.position.x = (s.userData.bx || 0) + Math.sin(t*2.4 - tt*2.6)*(0.03 + tt*0.12);
  }
  if (p.tail) p.tail.rotation.y = Math.sin(t*1.3)*0.09;
}

function puffGeo(r, topC, botC){
  var geo = new THREE.IcosahedronGeometry(r, 2);
  var p = geo.attributes.position, cols = [];
  var cT = new THREE.Color(topC), cB = new THREE.Color(botC);
  for (var i = 0; i < p.count; i++){
    var t = clamp((p.getY(i)/r + 1) * 0.5, 0, 1);
    var c = cB.clone().lerp(cT, Math.pow(t, 0.70));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return geo;
}
function addClouds(S, color, n, minD, maxD, spanY, sizeMin, sizeMax, baseY, spread){
  var g = new THREE.Group();
  var sm = sizeMin || 2.4, sM = sizeMax || 5.6;
  var y0 = baseY == null ? 26 : baseY;
  /* 云更扁平柔和：竖向压得更扁、整体收小、底部颜色更淡 → 破除"气球团"感（对齐参考图柔软云）
     注意：puff 数量与 rr 调用次数必须与原实现完全一致，否则会打乱后续对象的随机序列 */
  var topC = color || 0xFFFFFF, botC = 0xCBD9EA;
  for (var i = 0; i < n; i++){
    var c = new THREE.Group();
    var puffs = ri(5, 8);
    for (var j = 0; j < puffs; j++){
      var r = rr(sm, sM);
      var puff = new THREE.Mesh(puffGeo(r, topC, botC), cloudMat());
      puff.position.set(rr(-22,22), rr(-1.7,1.7), rr(-6,6));
      puff.scale.set(1, rr(0.34,0.48), 1);
      c.add(puff);
    }
    c.scale.setScalar(rr(0.68, 1.34));
    var ang = rr(-1.45, 1.45), d = rr(minD, maxD);
    var yy = y0 + rr(0, spanY);
    c.position.set(Math.sin(ang)*d, yy, -Math.abs(Math.cos(ang))*d - 40 - (spread||0));
    g.add(c);
  }
  S.add(g);
  return g;
}

    var band = new THREE.Mesh(sph, M(bc, { fog: false, emissive: shade(bc, 0.36), ei: 1 }));
    band.castShadow = false; band.receiveShadow = false;
    g.add(band);
  }

  /* 光环：多层同心环带 */
  var rbands = [[1.30, 1.62, 0.60], [1.66, 1.90, 0.40], [1.94, 2.08, 0.24]];
  for (var r2 = 0; r2 < rbands.length; r2++){
    var rg = new THREE.RingGeometry(R*rbands[r2][0], R*rbands[r2][1], 72, 1);
    var rm = new THREE.Mesh(rg, basic(ringC, {
      transparent: true, opacity: rbands[r2][2], side: THREE.DoubleSide, depthWrite: false, fog: false }));
    rm.rotation.set(ringRot[0], ringRot[1], ringRot[2]);
    rm.renderOrder = -5;
    g.add(rm);
  }
  /* 环外缘高光 */
  var edge = new THREE.Mesh(new THREE.TorusGeometry(R*1.90, R*0.012, 3, 72), M(0xFFFFFF, NOFOG));
  edge.rotation.set(ringRot[0], ringRot[1], ringRot[2]);
  edge.castShadow = false;
  g.add(edge);

  return g;
}
/* 漂浮光尘：加性点云，逐帧缓慢上浮 + 横向漂移（参考图大量光点/尘埃是画面质感关键） */
function motes(opt){
  opt = opt || {};
  var n = opt.n || 90, col = opt.color || 0xFFFFFF;
  var w = opt.w || 60, y0 = opt.y0 == null ? 1 : opt.y0, y1 = opt.y1 == null ? 20 : opt.y1;
  var z0 = opt.z0 == null ? 2 : opt.z0, z1 = opt.z1 == null ? 120 : opt.z1;
  var pos = new Float32Array(n*3), base = new Float32Array(n*3);
  var ph = new Float32Array(n), sp = new Float32Array(n);
  for (var i = 0; i < n; i++){
    base[i*3]   = rr(-w, w);
    base[i*3+1] = rr(y0, y1);
    base[i*3+2] = -rr(z0, z1);
    ph[i] = rr(0, 6.283); sp[i] = rr(0.22, 0.75);
  }
  pos.set(base);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var pts = new THREE.Points(geo, new THREE.PointsMaterial({
    color: col, size: opt.size || 0.30, sizeAttenuation: true,
    transparent: true, opacity: opt.opacity == null ? 0.80 : opt.opacity,
    depthWrite: false, fog: true
  }));
  pts.frustumCulled = false;
  pts.userData.base = base; pts.userData.ph = ph; pts.userData.sp = sp;
  return pts;
}

/* 分段石环遗迹（确定性，不消耗随机数）：参考图家园的粗壮灰白巨环，由一段段石块砌成 */
function ringMonument(){
  var g = new THREE.Group();
  var stone = 0xEDEAE0;
  var N = 16, R = 6.2;
  for (var i = 0; i < N; i++){
    var a = i / N * Math.PI * 2;
    /* 段间留缝读出"分段砌筑"；三档明差模拟石块错落；轴向切向（rotation.z = a） */
    var shadeK = [1.0, 0.94, 1.06][i % 3];
    var seg = add(g, new THREE.CylinderGeometry(0.88, 0.98, 2.05, 5),
      M(shade(stone, shadeK), { emissive: shade(stone, shadeK*0.24), ei: 1 }),
      Math.cos(a)*R, Math.sin(a)*R, 0);
    seg.rotation.z = a;
  }
  /* 内圈青蓝发光细环 */
  add(g, new THREE.TorusGeometry(5.5, 0.20, 4, 36),
    M(0x6FD8F0, { emissive: 0x4FC4E8, ei: 0.45 }));
  return g;
}

function h2(x,z){ return (Math.abs(Math.sin(x*12.9898 + z*78.233)*43758.5453)) % 1; }
function fbmv(x,z,s){
  var gx = Math.floor(x*s), gz = Math.floor(z*s);
  var fx = x*s-gx, fz = z*s-gz;
  var ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  var a = h2(gx,gz), b = h2(gx+1,gz), c = h2(gx,gz+1), d = h2(gx+1,gz+1);
  return (a*(1-ux)+b*ux)*(1-uz) + (c*(1-ux)+d*ux)*uz;
}

     C5 构图校正：右下晶簇原在 (9.0,·,3.2)，投影到屏幕 x≈1.09（出画、几乎不可见）；
     移至 (7.2,·,2.4)（屏幕 ≈0.90/0.94）并放大 h1.8→2.4。仅改参数/坐标，
     crystalCluster 内 rnd 调用次数不变 → 全局随机序列零漂移。 */

  var petals = petalFall({ n: 70, color: 0xFFC2E4, w: 24, y0: 0.2, y1: 13, z0: 2, z1: 44,

/* ============================================================== DESERT ==== */
function buildDesert(){
  var S = new THREE.Scene();
  S.background = new THREE.Color(0x5E9CD8);
  S.fog = new THREE.Fog(0xEBD2DC, 85, 470);
  S.add(makeSky(0x4590D8, 0x86B4E8, 0xE8C4D6));

  S.add(new THREE.HemisphereLight(0xDCEBFF, 0xC98D92, 0.48));
  var sun = new THREE.DirectionalLight(0xFFF2DC, 0.95);
  sun.position.set(-60, 100, 30); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  var sd = 30;
  sun.shadow.camera.left=-sd; sun.shadow.camera.right=sd; sun.shadow.camera.top=sd; sun.shadow.camera.bottom=-sd;
  sun.shadow.camera.near=1; sun.shadow.camera.far=280; sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.05;
  S.add(sun); S.add(sun.target); S.userData.sun = sun;
  var fill = new THREE.DirectionalLight(0xFFE2DC, 0.22); fill.position.set(20, 18, 44); S.add(fill);

  function dh(x,z){
    var h = Math.sin(z*0.042)*2.3 + Math.cos(x*0.058)*1.9 + Math.sin(x*0.105 - z*0.075)*1.0;
    var d = sstep((-z - 8)/120);
    var ridge = Math.abs(Math.sin(x*0.085 + z*0.05))*1.4*d;
    var ridge2 = Math.sin(x*0.021 + z*0.017)*3.1*d;
    return h*(0.40 + 1.20*d) + ridge + ridge2 - d*4.2;
  }
  function dcol(x,z,y){
    var n = fbmv(x,z,0.05), n2 = fbmv(x+90, z-60, 0.13), n3 = fbmv(x-140, z+30, 0.22);
    var col;
    /* 珊瑚粉家族（规范主色 #EE7C80）：浅橙沙 / 暖粉 / 主珊瑚 / 深玫 / 亮珊瑚
       保持原饱和度（调色采样 s≈44 与参考一致），靠提高明度基线把整体抬到参考的亮沙面 */
    if (n3 > 0.94) col = 0xE8967A;
    else if (n2 > 0.88) col = 0xD8828A;
    else if (n > 0.66) col = 0xF08A84;
    else if (n < 0.34) col = 0xBE617C;
    else col = 0xEE7C80;
    /* 依高度做明暗分离：丘顶亮、丘谷暗，沙丘层次才出得来 */
    return shade(col, 0.85 + clamp((y || 0)*0.05, -0.16, 0.18));
  }
  var dm = new THREE.Mesh(planeTerrain(420, 340, 56, 48, dh, dcol, 0.13),
    new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, map: sandTex() }));
  dm.position.z = -150; dm.receiveShadow = true; dm.castShadow = true;
  S.add(dm);

  /* 大块岩石台地 */
  for (var i = 0; i < 46; i++){
    var side = rnd() < 0.5 ? -1 : 1;
    var x = side*rr(7, 95), z = -rr(2, 260), y = dh(x,z), r = rr(1.4, 5.2);
    var rock = add(S, new THREE.IcosahedronGeometry(r, 0), M(shade(0xCF8792, rr(0.88,1.14))), x, y + r*rr(0.2,0.55), z);
    rock.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    rock.scale.set(1, rr(0.7,1.5), 1);
  }
  /* 两侧大体量红岩墙：搭出参考图的峡谷围合感（参考图两侧岩壁占到 y18–50%） */
  for (var i3 = 0; i3 < 10; i3++){
    var sg3 = rnd() < 0.5 ? -1 : 1;
    var cxx = sg3*rr(26, 78), czz = -rr(6, 120);
    var mound = add(S, new THREE.IcosahedronGeometry(rr(4.5, 9.5), 0),
      M(shade(0xCF8790, rr(0.90, 1.10))), cxx, dh(cxx, czz) + rr(0.5, 2.5), czz);
    mound.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    mound.scale.set(rr(0.95,1.5), rr(1.7, 2.8), rr(0.95,1.5));
  }
  /* 散布的碎石堆 */
  for (var i4 = 0; i4 < 40; i4++){
    var sg4 = rnd() < 0.5 ? -1 : 1;
    var sxx = sg4*rr(4, 60), szz = -rr(2, 150);
    var peb = add(S, new THREE.IcosahedronGeometry(rr(0.35, 1.05), 0),
      M(shade(0xD79DA4, rr(0.88, 1.16))), sxx, dh(sxx, szz) + rr(0.05, 0.3), szz);
    peb.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    peb.scale.set(1, rr(0.6, 1.0), 1);
  }
  for (var i2 = 0; i2 < 12; i2++){
    var s2 = rnd() < 0.5 ? -1 : 1;
    var x2 = s2*rr(14, 70), z2 = -rr(10, 230);
    var mh = rr(7, 14);   /* 台地加高 → 与两侧岩墙一起围合出峡谷纵深 */
    var mesa = add(S, new THREE.CylinderGeometry(rr(4.0,8.5), rr(5.5,11.0), mh, ri(6,9), 1),
      M(shade(0xC98793, rr(0.92,1.08))), x2, dh(x2,z2) + rr(1,3) + mh*0.5 - 3, z2);
    mesa.rotation.y = rr(0,3);
    add(S, new THREE.CylinderGeometry(rr(3.5,7.5), rr(4.8,10.0), 0.6, ri(6,9), 1),
      M(0xF7AC86), x2, mesa.position.y + mh*0.5 + rr(1.6,4.6) - 3, z2).rotation.y = mesa.rotation.y + 0.2;
  }

  /* 红橙树 */
  for (var t = 0; t < 26; t++){
    var st = rnd() < 0.5 ? -1 : 1;
    var tx = st*rr(5, 52), tz = -rr(2, 170);
    var tree = lowPolyTree({ h: rr(2.6, 6.4), leaf: pick([0xEE6B72, 0xE6816B, 0xF1797F, 0xD75F6E]),
                             trunk: 0x8A5A62, crown: 3, tall: rnd() < 0.5 });
    tree.position.set(tx, dh(tx,tz), tz);
    tree.scale.setScalar(rr(0.9, 1.6));
    S.add(tree);
  }
  /* 晶簇 */
  for (var c = 0; c < 16; c++){
    var sc = rnd() < 0.5 ? -1 : 1;
    var cx = sc*rr(4, 42), cz = -rr(4, 140);
    var cl = crystalCluster({ h: rr(1.6, 4.0), color: 0x58D7EF, color2: 0xD85CEA, n: 3, sides: 5 });
    cl.position.set(cx, dh(cx,cz), cz);
    S.add(cl);
  }
  /* 两簇地标级大水晶：左蓝右紫（参考图沙漠的中景视觉锚点） */
  var bc1 = crystalCluster({ h: 6.8, color: 0x58D7EF, color2: 0x9FE9F6, n: 4, sides: 6 });
  bc1.position.set(-11.0, dh(-11.0, -27), -27); S.add(bc1);
  var bc2 = crystalCluster({ h: 5.4, color: 0xD85CEA, color2: 0xB06EE8, n: 3, sides: 6 });
  bc2.position.set(12.0, dh(12.0, -36), -36); S.add(bc2);

  /* S2 细节层：石林 / 立石岩柱（参考图沙丘之间竖立的岩柱）——走 dseq 独立随机流 */
  var Rr = dseq(0x3E11);
  for (var rp2 = 0; rp2 < 10; rp2++){
    var rside = (rp2 % 2) ? 1 : -1;
    var rx2 = rside*(10 + Rr()*52), rz2 = -6 - Rr()*130;
    var rspH = 2.4 + Rr()*5.6;
    var rsp = rockSpire(rspH, (Rr() < 0.5 ? 0xD06F55 : 0xC98793), dseq(0xA00 + rp2));
    rsp.position.set(rx2, dh(rx2, rz2), rz2); S.add(rsp);
  }

  /* 浮空巨岩拱：屏幕 ~ (0.45, 0.28) —— 参考图顶部悬空岩体（x22-68%, y10-50%），
     下方留出天空与远地平线；走浮空可避免远距离投在地上的脱节阴影 */
  var arch = rockArch();
  arch.position.set(1.0, dh(1,-118) + 21.0, -118);
  arch.scale.set(2.20, 1.50, 1.26);   /* 对齐参考图顶部浮空岩体的屏幕占比：宽≈42%、高≈30% */
  arch.traverse(function(o){ o.castShadow = false; });
  S.add(arch);
  /* 旧随机拱块共消耗 319 次 rnd，burn 对齐保证其后布局零漂移 */
  for (var _b2 = 0; _b2 < 319; _b2++) rnd();

  /* 环门 + 能量柱：屏幕 ~ (0.50, 0.46) —— 参考图远端地平线上的小石环，收小并推远 */
  var gate = ringGate({ r: 6.4, tube: 1.0, seg: 34, frame: 0xEDE6DA, glow: 0.55 });
  gate.position.set(-1.2, dh(-1.2,-84) + 15.5, -84);
  S.add(gate);

  var beam = new THREE.Group();
  add(beam, new THREE.CylinderGeometry(1.0, 1.7, 150, 18, 1, true),
    basic(0x9FEBFF, { transparent:true, opacity:0.15, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    0, 75, 0, { cast:false, recv:false });
  add(beam, new THREE.CylinderGeometry(0.45, 0.8, 150, 14, 1, true),
    basic(0xEAFBFF, { transparent:true, opacity:0.22, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    0, 75, 0, { cast:false, recv:false });
  beam.position.set(-1.2, dh(-1.2,-84) + 3, -84);
  S.add(beam); S.userData.beam = beam;

  /* 远处浮岛（珊瑚粉岩体） */
  for (var f = 0; f < 6; f++){
    var fi = floatingIsland({ r: rr(3,9), seg:8, top:0x7FB070, cliff:0xB07C8A, rock:0xB2798A,
                              thick:1.2, coneH:rr(6,12), chunks:2, bumpy:1 });
    fi.position.set(rr(-300,300), rr(38,110), -rr(180,420));
    fi.traverse(function(o){ o.castShadow = false; }); /* 远景不参与阴影 */
    S.add(fi);
  }
  /* 中天红浮岩已删（参考图沙漠天空无漂浮岩块）——burn 81 次对齐随机序列 */
  for (var _b1 = 0; _b1 < 81; _b1++) rnd();
  addClouds(S, 0xFFFFFF, 16, 130, 340, 200, 3.8, 8.6, 40);

  /* 峡谷围合岩壁：参考图左右两侧的高岩壁（约 x0–20% / x80–100%，y15–50%）。
     走 dseq 独立随机流 → 对全局 rnd 零消耗，四场景构图零漂移 */
  var Rw = dseq(0x7A11);
  var WALLS = [[-46, -58], [46, -58], [-70, -112], [70, -112]];
  /* [dx, 半径系数, y 中心系数, x 拉伸, y 拉伸] —— 六块碎石堆出锯齿状岩壁轮廓 */
  var lumpSpec = [[  0, 1.00, 2.80, 1.20, 2.80],
                  [ -6, 0.70, 2.20, 1.15, 2.60],
                  [  6, 0.66, 2.40, 1.15, 2.50],
                  [ -7, 0.52, 1.70, 1.15, 2.40],
                  [  7, 0.55, 1.90, 1.15, 2.40],
                  [  2, 0.46, 3.20, 1.20, 2.30]];
  for (var wi = 0; wi < WALLS.length; wi++){
    var wx = WALLS[wi][0], wz = WALLS[wi][1];
    var wy = dh(wx, wz);
    var wR = wi < 2 ? 7.5 : 9.0;
    var wc = shade(0xD98F94, 0.98 + Rw()*0.10);   /* 珊瑚粉：参考图两侧岩壁是受光的亮珊瑚色 */
    for (var wl = 0; wl < lumpSpec.length; wl++){
      var lp = lumpSpec[wl];
      var lm = add(S, new THREE.IcosahedronGeometry(wR * lp[1], 0),
        M(wc, { emissive: shade(wc, 0.16), ei: 1 }),
        wx + lp[0], wy + wR*lp[2], wz + (wl % 3 ? 3 : -3));
      lm.rotation.set(0, Rw()*3, 0);
      lm.scale.set(lp[3], lp[4], 1.15);
    }
  }

  var hero = createDragonAstronaut();
  hero.scale.setScalar(1.50);
  hero.userData.baseY = dh(0.6, -1.5);

  /* 风沙光尘：近处细密、远处稀疏 */
  var mtD1 = motes({ n: 120, color: 0xFFDCA8, w: 40, y0: 0.5, y1: 16, z0: 2, z1: 70, size: 0.28, opacity: 0.80 });
  S.add(mtD1);
  var mtD2 = motes({ n: 70, color: 0xFFF0D8, w: 60, y0: 3, y1: 34, z0: 40, z1: 150, size: 0.42, opacity: 0.50 });
  S.add(mtD2);
  S.userData.motes = [mtD1, mtD2];

  /* ========================================================================
     M1 · 可玩闭环内容（GDD §4.6）：贴地函数导出 + 3 颗可采晶体 + 传送激活台 + 落地波纹
     全部走 dseq / 纯参数 ⇒ 对全局 rnd() 零消耗，既有构图零漂移 */
  S.userData.ground = dh;                       /* 供 PlayerController 做贴地采样 */

  var Rg = dseq(0xC011);                         /* §7.5-4 指定种子：独立随机流 */
  var _gemCols = [[0x58D7EF, 0xD85CEA], [0xD85CEA, 0x9FE9F6], [0x58D7EF, 0xB06EE8]];
  var gems = [];
  for (var gi = 0; gi < M1_GEMS.length; gi++){
    var gx = M1_GEMS[gi][0], gz = M1_GEMS[gi][1];
    var gm = musicShard(_gemCols[gi][0], _gemCols[gi][1], 0.9 + Rg()*0.2);
    var gy = dh(gx, gz);
    gm.position.set(gx, gy + 1.2, gz);
    gm.rotation.y = Rg()*6.283;
    gm.userData.groundY = gy;
    gm.userData.phase = Rg()*6.283;
    gm.userData.rotY0 = gm.rotation.y;
    gm.userData.taken = false;
    Collectible.register(gm);
    S.add(gm); gems.push(gm);
  }
  S.userData.gems = gems;

  var pad = portalPad(2.6);
  pad.position.set(M1_PAD[0], dh(M1_PAD[0], M1_PAD[1]) + 0.02, M1_PAD[1]);
  S.add(pad); S.userData.pad = pad;

  VFX.attach(S);                                 /* 1 落地波纹 + 3 收集波纹池（默认隐藏，不占 draw call）*/

  return { scene: S, hero: hero, runnable: true };
}

/* ================================================================ CAVE ==== */
function buildCave(){
  var S = new THREE.Scene();
  S.background = new THREE.Color(0x102544);
  S.fog = new THREE.FogExp2(0x1B3460, 0.0098);
  S.add(makeSky(0x0B1734, 0x1B3563, 0x0A1330));

  S.add(new THREE.HemisphereLight(0x5E92C8, 0x1A2C46, 0.53));
  var shaft = new THREE.DirectionalLight(0xCBE8FA, 0.98); shaft.position.set(-5, 60, -14); S.add(shaft);
  var rim = new THREE.DirectionalLight(0x8FC4F4, 0.32); rim.position.set(30, 16, 22); S.add(rim);
  var fill = new THREE.DirectionalLight(0xA8CEF2, 0.26); fill.position.set(6, 12, 40); S.add(fill);

  function chh(x,z){
    var d = sstep((-z)/90);
    return Math.sin(x*0.16)*0.45 + Math.cos(z*0.11)*0.5 - d*2.4;
  }
  function ccol(x,z){
    var n = fbmv(x,z,0.06);
    if (n > 0.70) return 0x1E4F67;
    if (n < 0.34) return 0x10263B;
    return 0x15394F;
  }
  var fm = new THREE.Mesh(planeTerrain(130, 220, 42, 48, chh, ccol, 0.15),

  /* 道路中心冷光引导带（近处更亮） */

  for (var hg = 0; hg < 16; hg++){

  var gc1 = gemCluster(10.5, 0xE55AC7, 0xF08FD8, 0.9);
  gc1.position.set(-11, chh(-11, -20), -20); S.add(gc1);

  var gc2 = gemCluster(7.5, 0xE8734F, 0xF0A060, 0.85);

  add(S, new THREE.PlaneGeometry(10, 10),

  for (var ti = 0; ti < 8; ti++){

  }
  S.userData.gems = cgems;

  var cpad = portalPad(3.0);
  cpad.position.set(CAVE_PAD[0], chh(CAVE_PAD[0], CAVE_PAD[1]) + 0.02, CAVE_PAD[1]);
  S.add(cpad); S.userData.pad = cpad;

  VFX.attach(S);                                  /* 1 落地波纹 + 3 收集波纹池（cave 独立一份）*/

  return { scene: S, hero: hero, runnable: true };
}

  var fillB = new THREE.DirectionalLight(0xDCEBF6, 0.16); fillB.position.set(34, 26, 48); S.add(fillB);

  sun.shadow.camera.left=-sd; sun.shadow.camera.right=sd; sun.shadow.camera.top=sd; sun.shadow.camera.bottom=-sd;
  sun.shadow.camera.near=1; sun.shadow.camera.far=300; sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.05;
  S.add(sun); S.add(sun.target); S.userData.sun = sun;

  /* 前景悬崖（玩家站立的高地） */
  function fh(x,z){
    var t = sstep((-z - 0.5)/7);
    return 1.65 - t*25 + Math.sin(x*0.45)*0.3 + Math.cos(z*0.5)*0.22;
  }
  function fcol(x,z,y){
    if (z < -7) return 0x678F70;
    var n = fbmv(x,z,0.12);
    if (z < -3.0 && n < 0.55) return 0xD0845C;
    /* 前景橙崖收窄到左侧：参考图橙崖只占底部左侧，右侧是绿草缓坡。
       用噪声扰动边界（edge≈1.1~8.1），既保证角色(x=0.51)站在橙崖上，又避免硬直缝 */
    if (z > -1.0){
      var ne = fbmv(x + 31, z - 17, 0.30);
      var edge = 4.9 + (ne - 0.5)*6.4;   /* edge∈[1.7,8.1]，角色(x=0.51)恒定落在橙崖上 */
      if (x < edge - 0.7) return n > 0.62 ? 0xE39A72 : (n > 0.38 ? 0xD98A64 : 0xC97A56);
      if (x < edge + 0.5) return 0xBE7A5C;   /* 崖沿暗带：让橙崖读出"落差"而不是平铺色块 */
    }
    if (n > 0.6) return 0x8CBE7E;
    return 0x74A868;
  }
  var fm = new THREE.Mesh(planeTerrain(140, 60, 34, 20, fh, fcol, 0.10),

    M(0x74B4D2, { emissive: shade(0x74B4D2, 0.24), ei: 1 }),

    M(0x619FC6, { emissive: shade(0x619FC6, 0.22), ei: 1 }),

  for (var i = 0; i < 12; i++){

  add(tower, new THREE.TorusGeometry(1.7, 0.22, 3, 14), M(0x7FD2EC, { emissive: 0x54AED2, ei: 0.6 }),

  /* 圆顶观测站 */

  add(dome, new THREE.SphereGeometry(3.6, 14, 7, 0, Math.PI*2, 0, Math.PI/2), M(0x8FD8E8), 0, 2.2, 0);

  /* 白色模块建筑：多层楼 + 冷光窗带（对应参考基地的发光窗建筑群） */
  for (var b = 0; b < 17; b++){
    var a2 = rr(0,6.283), d2 = rr(9, 28);
    var bg = grp(isl, Math.cos(a2)*d2, 2.9, Math.sin(a2)*d2);
    bg.rotation.y = rr(0, 3);

    var floors = Math.max(1, Math.round(bh / 1.1));
    for (var f = 0; f < floors; f++){

  /* 深蓝太阳能板 */
  for (var s = 0; s < 7; s++){

  for (var br = 0; br < 22; br++){

  /* 半球玻璃穹顶：基地的科技感点缀 */
  for (var dm = 0; dm < 5; dm++){

  /* 天线桅杆（顶端红色航障灯） */
  for (var an = 0; an < 6; an++){
    var a6 = rr(0,6.283), d6 = rr(5, 28);
    var ag = grp(isl, Math.cos(a6)*d6, 2.9, Math.sin(a6)*d6);
    var mh = rr(4, 8);

  /* 岛边瀑布 */
  var wf = waterfall(5.5, 26);
  wf.position.set(16, -0.5, 20); isl.add(wf);

  /* 远处浮岛群 */
  for (var f = 0; f < 20; f++){
    var ang = rr(-1.4, 1.4), dist = rr(130, 520);
    var fi = floatingIsland({ r: rr(4, 10), seg:9, top:0x7FB56E, cliff:0xA8BCAA, rock:0x9FB4B8,
                              thick:1.6, coneH:rr(3.5,7.5), chunks:3, bumpy:1 });
    fi.position.set(Math.sin(ang)*dist, rr(-6, 24) - dist*0.015, -Math.abs(Math.cos(ang))*dist - 60);
    fi.traverse(function(o){ o.castShadow = false; }); /* 远景不参与阴影 */
    S.add(fi);
  }
  /* 参考图基地天空无行星 —— 已删（bigPlanet 不消耗随机数，纯删除零漂移） */
  /* 岛缘瀑布群：右缘瀑布加宽加高、对准岛缘入海 */
  var wfA = waterfall(7.5, 40); wfA.position.set(27, -1.5, 8); isl.add(wfA);

  addClouds(S, 0xFFFFFF, 14, 220, 500, 170, 3.8, 9.4, 30);
  /* 岛层云：让基地真的"浮"在云海之上 */
  addClouds(S, 0xFFFFFF, 9, 90, 300, 34, 4.2, 9.4, -26, 0);

  /* S3 生命感：高空鸟群（走 dseq 独立随机流，零全局 rnd） */

  var hero = createDragonAstronaut();
  hero.scale.setScalar(0.80);

  /* 高空浮尘 + 近岛光点 */
  var mtB1 = motes({ n: 110, color: 0xFFF6E4, w: 44, y0: 2, y1: 30, z0: 2, z1: 120, size: 0.30, opacity: 0.78 });

  var mtB2 = motes({ n: 60, color: 0xBFE8FF, w: 60, y0: -14, y1: 12, z0: 30, z1: 160, size: 0.40, opacity: 0.45 });
  S.add(mtB2);
  S.userData.motes = [mtB1, mtB2];

  return { scene: S, hero: hero, runnable: false };
}

function waveHTML(seed, n){
  var out = '';
  for (var i = 0; i < n; i++){
    var h = 26 + Math.abs(Math.sin(seed + i*0.9))*74;
    out += '<i' + (i > n*0.5 ? ' class="dim"' : '') + ' style="height:' + h.toFixed(0) + '%"></i>';
  }
  return out;
}

function buildHUD(){
  var host = document.getElementById('huds');
  host.innerHTML = '';
  host.style.pointerEvents = 'none';
  if (SHOWCASE){
    RENDER_ORDER.forEach(function(k, i){
      var q = document.createElement('div'); q.className = 'quad q' + i;
      var l = document.createElement('div'); l.className = 'hudLayer'; l.innerHTML = HUD_DEF[k]();
      q.appendChild(l); host.appendChild(q);
    });
  } else {
    var l2 = document.createElement('div'); l2.className = 'hudLayer';
    l2.innerHTML = HUD_DEF[cur] ? HUD_DEF[cur]() : '';
    host.appendChild(l2);
  }
  document.getElementById('divider').classList.toggle('on', SHOWCASE);
  Array.prototype.forEach.call(host.querySelectorAll('.menu button'), function(b){
    b.addEventListener('click', function(){ if (!SHOWCASE) setScene(b.getAttribute('data-go')); });
  });
  /* §0.4-2/-3：HUD 动作分流——跑=冲刺(按住) / 跳=跳跃 / ♪=踩拍 */
  Array.prototype.forEach.call(host.querySelectorAll('[data-act]'), function(el){
    el.style.pointerEvents = 'auto';
    var act = el.getAttribute('data-act');
    el.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      if (act === 'jump') doJump();
      else if (act === 'run') Input.btn.sprint = true;
      else if (act === 'beat') BeatClock.tap();
      initAudio(); if (actx && actx.state === 'suspended') actx.resume();
      m1Sfx('uiClick');
    });
    function releaseRun(){ if (act === 'run') Input.btn.sprint = false; }
    el.addEventListener('pointerup', releaseRun);
    el.addEventListener('pointerleave', releaseRun);
    el.addEventListener('pointercancel', releaseRun);
  });
  /* 虚拟摇杆 → 移动轴向（GDD §5.1） */
  Array.prototype.forEach.call(host.querySelectorAll('.stick'), function(el){
    el.style.pointerEvents = 'auto';
    var pid = null;
    function setFrom(ev){
      var r = el.getBoundingClientRect();
      var dx = (ev.clientX - (r.left + r.width/2)) / (r.width/2);
      var dy = (ev.clientY - (r.top + r.height/2)) / (r.height/2);
      var m = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      Input.stick.x = dx/m; Input.stick.z = dy/m;
    }
    el.addEventListener('pointerdown', function(e){
      e.stopPropagation(); pid = e.pointerId;
      try { el.setPointerCapture(pid); } catch(_e){}
      initAudio(); if (actx && actx.state === 'suspended') actx.resume();
      setFrom(e);
    });
    el.addEventListener('pointermove', function(e){ if (pid === e.pointerId) setFrom(e); });
    function end(e){ if (pid === e.pointerId || pid === null){ pid = null; Input.stick.x = 0; Input.stick.z = 0; } }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}

function setScene(k){
  if (!SCN[k]) return;
  cur = k;
  M1.enter(k);
  buildHUD();
  var S = SCN[k];
  if (S.hero){
    S.hero.position.set(S.hero.home.x, S.hero.home.y, S.hero.home.z);
    /* 复位到构建期基准：baseY0 / rotY0 在 boot 里记录，保证切景往返后逐位可复现 */
    if (S.hero.userData.baseY0 != null) S.hero.userData.baseY = S.hero.userData.baseY0;
    if (S.hero.userData.rotY0 != null) S.hero.rotation.y = S.hero.userData.rotY0;
  }
  jump.y = 0; jump.v = 0; jump.on = false; jump.perfect = false;
  last = performance.now();
}
function doJump(){
  var S = SCN[cur];
  if (!S || !S.runnable) return;
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  if (!jump.on){
    /* §3.2 踩点：窗口内起跳用 V0_PERFECT，否则常规 V0；未踩点不给正反馈 */
    jump.perfect = BeatClock.inWindow();
    jump.v = jump.perfect ? CFG.V0_PERFECT : CFG.V0;
    jump.on = true;
    m1Sfx(jump.perfect ? 'beatPerfect' : 'jump');
  }
}

/* 音频（保留音乐节拍逻辑） */
var actx = null, master = null, nextBeat = 0, bpm = 118, beatCount = 0;
function initAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.14; master.connect(actx.destination);
    nextBeat = actx.currentTime + 0.1;
  } catch(e){ actx = null; }
}
function kick(t){
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.16);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.24);
}
function hat(t){
  var b = actx.createBuffer(1, 1024, actx.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < 1024; i++) d[i] = (Math.random()*2 - 1)*(1 - i/1024);
  var n = actx.createBufferSource(); n.buffer = b;
  var hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6400;
  var g = actx.createGain(); g.gain.value = 0.12;
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t);
}
function scheduleAudio(){
  if (!actx) return;
  while (nextBeat < actx.currentTime + 0.18){
    kick(nextBeat); if (beatCount % 2 === 1) hat(nextBeat);
    beatCount++; nextBeat += 60/bpm;
    BeatClock.onKick();   /* §7.5-7：在 kick 处广播 beat，供踩点窗口对齐 */
  }
}
/* §7.5-1：键盘统一汇入 Input.keys；跳跃保持 空格/↑；F 改绑为交互/收集（§0.4-1） */
addEventListener('keydown', function(e){
  Input.keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); doJump(); }
  if (e.key === '1') setScene('home');
  if (e.key === '2') setScene('desert');
  if (e.key === '3') setScene('cave');
  if (e.key === '4') setScene('base');
  if (e.key === 'f' || e.key === 'F') M1.interact();
});
addEventListener('keyup', function(e){ Input.keys[e.code] = false; });
addEventListener('blur', function(){ Input.keys = {}; Input.btn.sprint = false; Input.stick.x = 0; Input.stick.z = 0; });
renderer.domElement.addEventListener('pointerdown', function(){
  initAudio(); if (actx && actx.state === 'suspended') actx.resume(); doJump();
});

/* ==========================================================================
   6. 主循环
   ========================================================================== */
var T = 0, last = performance.now();
function updateScene(k, dt){
  var S = SCN[k]; if (!S) return;
  var sc = S.scene;
  if (sc.userData.beam){ var s2 = 1 + Math.sin(T*1.1)*0.035; sc.userData.beam.scale.set(s2, 1, s2); }
  var wf = sc.userData.wf;
  if (wf && wf.userData.mist){
    wf.userData.mist.position.y = -0.35 + Math.sin(T*1.7)*0.3;
    wf.userData.mist.scale.set(1 + Math.sin(T*1.2)*0.05, 0.45, 1);
  }
  /* 瀑布落点消散雾的呼吸（一次性收集带 isFall 标记的组，之后每帧只读） */
  var falls = sc.userData._falls;
  if (falls == null){
    falls = [];
    sc.traverse(function(o){ if (o.userData && o.userData.isFall) falls.push(o); });
    sc.userData._falls = falls;
  }
  for (var fi = 0; fi < falls.length; fi++){
    var tl = falls[fi].userData.tail; if (!tl) continue;
    for (var fj = 0; fj < tl.length; fj++){
      var q = tl[fj], bo = q.userData.baseOpacity || 0.4;
      q.material.opacity = bo + Math.sin(T*1.5 + q.userData.phase)*0.06;
      q.scale.y = 0.55 + Math.sin(T*1.3 + q.userData.phase)*0.05;
    }
  }
  /* 风：树 / 灌木 / 草丛轻摆（零 draw call 消耗，相位由世界坐标导出，
     因此相邻植株不会同频，也不需要额外存储随机数） */
  var sway = sc.userData._sway;
  if (sway == null){
    sway = [];
    sc.updateMatrixWorld(true);
    var wp = new THREE.Vector3();
    sc.traverse(function(o){
      if (o.userData && o.userData.swayable){
        o.getWorldPosition(wp);
        o.userData._ph = wp.x*0.7 + wp.z*1.3;
        o.userData._rz = o.rotation.z; o.userData._rx = o.rotation.x;
        sway.push(o);
      }
    });
    sc.userData._sway = sway;
  }
  for (var swi = 0; swi < sway.length; swi++){
    var so = sway[swi], sph = so.userData._ph;
    so.rotation.z = so.userData._rz + Math.sin(T*1.60 + sph)*0.030;
    so.rotation.x = so.userData._rx + Math.sin(T*1.25 + sph*1.4)*0.020;
  }
  /* 飘落花瓣：y 上限内循环下落 + 横向飘摆 */
  var pfs = sc.userData._petals;
  if (pfs == null){
    pfs = []; sc.traverse(function(o){ if (o.userData && o.userData.petal) pfs.push(o); });
    sc.userData._petals = pfs;
  }
  for (var pfi = 0; pfi < pfs.length; pfi++){
    var pf = pfs[pfi], pa = pf.geometry.attributes.position;
    var pb = pf.userData.base, pph = pf.userData.ph, psp = pf.userData.sp;
    var pspan = pf.userData.ySpan, py0 = pf.userData.y0;
    for (var pj = 0; pj < pph.length; pj++){
      var pyb = pb[pj*3+1] - (T*psp[pj]) % pspan;
      if (pyb < py0) pyb += pspan;
      pa.array[pj*3]   = pb[pj*3] + Math.sin(T*psp[pj]*1.6 + pph[pj])*1.7;
      pa.array[pj*3+1] = pyb;
    }
    pa.needsUpdate = true;
  }
  /* 鸟群：绕圆心盘旋 + 上下浮动 + 扇翅 */
  var flocks = sc.userData._flocks;
  if (flocks == null){
    flocks = []; sc.traverse(function(o){ if (o.userData && o.userData.flock) flocks.push(o); });
    sc.userData._flocks = flocks;
  }
  for (var fli = 0; fli < flocks.length; fli++){
    var fl = flocks[fli], orb = fl.userData.orbit, bs = fl.userData.birds;
    for (var bi2 = 0; bi2 < bs.length; bi2++){
      var bd = bs[bi2], ud = bd.userData, ang = ud.a0 + T*orb.s;
      bd.position.set(orb.cx + Math.cos(ang)*orb.r*ud.rr2,
                      orb.cy + Math.sin(T*0.6 + ud.a0)*ud.ys,
                      orb.cz + Math.sin(ang)*orb.r*ud.rr2);
      bd.rotation.y = -ang + Math.PI/2;
      bd.rotation.z = Math.sin(T*ud.fs + ud.fp)*0.55;
    }
  }
  var crs = sc.userData.crystals;
  if (crs) for (var i = 0; i < crs.length; i++){
    var c = crs[i], cp = c.userData.phase;
    /* A13 相位去同步：未显式赋相位的晶簇（占绝大多数）改为「由世界坐标导出相位」，
       零随机数、零存储，使原本 phase=0 而整齐同步脉动的晶簇各自错峰呼吸。 */
    if (cp == null) cp = c.position.x*0.7 + c.position.y*0.9 + c.position.z*0.6;
    var s3 = 1 + Math.sin(T*1.6 + cp)*0.035;
    c.scale.setScalar(s3 * (c.userData.baseScale || 1));
  }
  var mts = sc.userData.motes;
  if (mts) for (var mi2 = 0; mi2 < mts.length; mi2++){
    var mp = mts[mi2], attr = mp.geometry.attributes.position;
    var bs = mp.userData.base, mph = mp.userData.ph, msp = mp.userData.sp;
    for (var mj = 0; mj < mph.length; mj++){
      attr.array[mj*3]   = bs[mj*3]   + Math.sin(T*msp[mj]*0.7 + mph[mj])*1.1;
      attr.array[mj*3+1] = bs[mj*3+1] + Math.sin(T*msp[mj] + mph[mj])*1.4;
    }
    attr.needsUpdate = true;
  }
  if (S.hero){
    if (jump.on){
      jump.v -= CFG.G*dt; jump.y += jump.v*dt;
      if (jump.y <= 0){
        jump.y = 0; jump.v = 0; jump.on = false;
        if (k === 'desert'){
          /* §5.2：仅踩点跳给地面波纹（未踩点靠"没有正反馈"体现） */
          if (jump.perfect) VFX.land(S.hero.position.x, S.hero.userData.baseY + 0.06, S.hero.position.z);
          m1Sfx('land');
        }
        jump.perfect = false;
      }
    }
    S.hero.position.y = S.hero.userData.baseY + jump.y;
    poseHero(S.hero, PlayerController.mode(k), T + (k === 'cave' ? 3.2 : 0), jump.y);
    var sh = S.hero.userData.shadow;
    if (sh){ var kk = 1 - Math.min(0.6, jump.y*0.15); sh.scale.setScalar(kk); sh.material.opacity = kk; }
  }
}
function renderShowcase(){
  var W = innerWidth, H = innerHeight;
  for (var i = 0; i < RENDER_ORDER.length; i++){
    var k = RENDER_ORDER[i], col = i % 2, row = (i/2)|0;
    var x = col*W/2, y = H - (row + 1)*H/2;
    renderer.setViewport(x, y, W/2, H/2);
    renderer.setScissor(x, y, W/2, H/2);
    renderer.setScissorTest(true);
    renderer.render(SCN[k].scene, SCN[k].camera);
  }
  renderer.setScissorTest(false);
}
function loop(now){
  requestAnimationFrame(loop);
  var dt = FREEZE ? 0 : Math.min(0.05, (now - last)/1000);
  last = now;
  if (!FREEZE) T += dt;
  if (scenesReady){
    if (SHOWCASE){
      for (var i = 0; i < RENDER_ORDER.length; i++) updateScene(RENDER_ORDER[i], dt);
      renderShowcase();
    } else {
      /* GDD §6.3 每帧顺序：Input → BeatClock → PlayerController → Collectible → Portal
         → VFX →（既有）updateScene。FREEZE 下整段跳过 ⇒ 对定帧零影响 */
      if (!FREEZE){
        Input.poll();
        BeatClock.update(dt);
        PlayerController.update(dt, cur, SCN[cur]);
        Collectible.update(dt, cur, SCN[cur]);
        Portal.update(dt, cur, SCN[cur]);
        CameraRig.update(dt, cur);                 /* M2：方案 B 微跟随（仅可玩关） */
        VFX.update(dt, cur);
      }
      updateScene(cur, dt);
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      renderer.setScissorTest(false);
      renderer.render(SCN[cur].scene, SCN[cur].camera);
    }
  }
  if (!FREEZE) scheduleAudio();
  HUD.sync();   /* §7.5-8：仅数据变化时重渲染任务卡 */
  if (DBG){
    document.getElementById('dbg').classList.add('on');
    document.getElementById('dbg').textContent =
      'scene=' + (SHOWCASE ? 'showcase' : cur) + '  freeze=' + FREEZE +
      '  calls=' + renderer.info.render.calls + '  tris=' + renderer.info.render.triangles;
  }
}
addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  if (!scenesReady) return;
  var aspect = innerWidth/innerHeight;
  RENDER_ORDER.forEach(function(k){ SCN[k].camera.aspect = aspect; SCN[k].camera.updateProjectionMatrix(); });
  buildHUD();
});

/* ==========================================================================
   6.5 M1 · 可玩闭环（desert 跑跳收集）—— GDD §7.5 八项 + §0.4 五项

   设计约束（红线 §0.3）：
     · 新增物体全部走 dseq / 纯参数 ⇒ 全局 rnd() 随机序列零漂移；
     · 静止时对 hero 零写入 ⇒ 四场景 heroC 逐位不变；
     · 玩法对象只"叠加"，不动既有地物、不动定帧机位基准值。

/* ---- 手感 / 数值（GDD §3.9 Tuning Sheet）---- */
var CFG = {
  SPEED_F: 4.5, SPEED_S: 1.6, SPRINT: 1.6,      /* 前进 / 横移 (u/s)、冲刺倍率 */
  V0: 6.0, V0_PERFECT: 7.2, G: 18,              /* 跳跃初速 / 踩点加成 / 重力 */
  W_BEAT: 0.09,                                 /* 拍点窗口（占单拍比例）*/
  R_COLLECT: 2.5, R_PORTAL: 3.0,                /* 吸附 / 传送判定半径 */
  ACC: 0.12, DEC: 0.10, FADE: 0.35,             /* 起停缓动 / 白闪时长 */
  X_MIN: -7.0, X_MAX: 7.0, Z_MIN: -24.0, Z_MAX: 1.0   /* 浅纵深轻量关可玩带 */
};

/* ---- 曲库（GDD §3.6）---- */

/* ---- 关卡定义（GDD §4.2 / §4.6 / §4.7）----
   M1：desert 浅纵深轻量关（晶体 z 压缩进可玩带，x 布局签名沿用 §4.6）。

/* ---- 轻量事件总线（GDD §6.5）---- */
var Bus = (function(){
  var m = {};
  return {
    on: function(ev, fn){ (m[ev] = m[ev] || []).push(fn); },
    emit: function(ev, d){ var a = m[ev]; if (a) for (var i = 0; i < a.length; i++){ try { a[i](d); } catch(e){} } }
  };
})();

/* ---- 局内状态（GDD §6.2，可序列化）---- */
var GameState = {
  level: 'desert', counters: {}, portal: 'dormant',
  reset: function(k){
    GameState.level = k;
    GameState.counters = {};
    var lv = LEVELS[k];
    if (lv) for (var i = 0; i < lv.tasks.length; i++) GameState.counters[lv.tasks[i].id] = 0;
    GameState.portal = 'dormant';
  },
  add: function(id, n){
    GameState.counters[id] = (GameState.counters[id] || 0) + (n == null ? 1 : n);
    Bus.emit('progress', { id: id, value: GameState.counters[id] });
    return GameState.counters[id];
  },
  get: function(id){ return GameState.counters[id] || 0; },
  taskDone: function(t){ return GameState.get(t.id) >= t.need; }
};

/* ---- 输入抽象（GDD §5.1 / §6.8）——键盘在既有 keydown 处接线 ---- */
var Input = {
  enabled: true, keys: {}, stick: { x: 0, z: 0 }, move: { x: 0, z: 0 },
  sprint: false, btn: { sprint: false },
  poll: function(){
    var k = Input.keys, mx = 0, mz = 0;
    if (Input.enabled){
      if (k['KeyW']) mz -= 1;
      if (k['KeyS']) mz += 1;
      if (k['KeyA']) mx -= 1;
      if (k['KeyD']) mx += 1;
    }
    mx += Input.stick.x; mz += Input.stick.z;
    var l = Math.sqrt(mx*mx + mz*mz);
    if (l > 1){ mx /= l; mz /= l; }
    Input.move.x = mx; Input.move.z = mz;
    Input.sprint = !!(k['ShiftLeft'] || k['ShiftRight'] || Input.btn.sprint);
  }
};

/* ---- 节拍时钟（GDD §3.2 / §6.6）——音频在跑时锁到 kick，否则自由拍 ---- */
var BeatClock = {
  bpm: 118, phase: 0, index: 0,
  setSong: function(s){ if (!s) return; BeatClock.bpm = s.bpm; bpm = s.bpm; BeatClock.phase = 0; },
  update: function(dt){
    var bp = 60 / BeatClock.bpm;
    if (actx && actx.state === 'running'){
      var since = bp - (nextBeat - actx.currentTime);
      BeatClock.phase = (((since % bp) + bp) % bp) / bp;
    } else if (dt > 0){
      BeatClock.phase += dt / bp;
      while (BeatClock.phase >= 1) BeatClock.phase -= 1;
    }
  },
  onKick: function(){ BeatClock.index++; Bus.emit('beat', { index: BeatClock.index, strong: true }); },
  inWindow: function(){ var p = BeatClock.phase; return p <= CFG.W_BEAT || p >= 1 - CFG.W_BEAT; },
  tap: function(){ Bus.emit('beatTap', {}); }
};

/* ---- 局内 SFX（GDD §6.6，汇入既有 master，不随 bpm 变速）---- */
function m1Sfx(kind){
  if (!actx) return;
  var t = actx.currentTime;
  try {
    function tone(type, f0, f1, dur, vol){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    }
    if (kind === 'collect'){
      for (var i = 0; i < 3; i++){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(523.25 * Math.pow(2, i*4/12), t + i*0.06);
        g.gain.setValueAtTime(0.0001, t + i*0.06);
        g.gain.exponentialRampToValueAtTime(0.45, t + i*0.06 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 0.22);
        o.connect(g); g.connect(master); o.start(t + i*0.06); o.stop(t + i*0.06 + 0.24);
      }
    }
    else if (kind === 'beatPerfect') tone('square', 1760, 1760, 0.08, 0.32);
    else if (kind === 'jump')        tone('sine', 320, 620, 0.12, 0.20);
    else if (kind === 'land')        tone('sine', 160, 70, 0.14, 0.24);
    else if (kind === 'portalGo')    tone('sawtooth', 220, 1320, 0.55, 0.26);
    else if (kind === 'uiClick')     tone('triangle', 880, 880, 0.06, 0.16);
  } catch(e){}
}

/* ---- 地面波纹（落地 / 收集反馈，GDD §5.2）---- */
function groundRipple(){
  var m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.18, 32, 1),
    basic(0xEAFBFF, { transparent: true, opacity: 0, additive: true, side: THREE.DoubleSide, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI/2; m.visible = false;
  return m;
}
var VFX = {
  _i: 0,
  attach: function(S){
    var land = groundRipple(); S.add(land);
    var pool = [];
    for (var i = 0; i < 3; i++){ var r = groundRipple(); S.add(r); pool.push(r); }
    S.userData.vfx = { land: land, pool: pool };   /* per-scene：desert / cave 各持一份 */
  },
  _scene: function(k){ var S = SCN[k]; return (S && S.scene) ? S.scene.userData.vfx : null; },
  _fire: function(mesh, x, y, z, r0, r1, life, op){
    mesh.visible = true; mesh.position.set(x, y, z); mesh.scale.setScalar(r0);
    mesh.material.opacity = op;
    mesh.userData.vf = { t: 0, life: life, r0: r0, r1: r1, op: op };
  },
  land:  function(x, y, z){ var v = VFX._scene(cur); if (v && v.land) VFX._fire(v.land, x, y, z, 0.55, 3.2, 0.5, 0.7); },
  burst: function(x, y, z){
    var v = VFX._scene(cur);
    if (!v || !v.pool.length) return;
    var m = v.pool[VFX._i++ % v.pool.length];
    VFX._fire(m, x, y, z, 0.35, 2.4, 0.42, 0.85);
  },
  update: function(dt, k){
    var v = VFX._scene(k);
    if (!v) return;
    function step(m){
      if (!m || !m.visible) return;
      var vv = m.userData.vf; vv.t += dt;
      var kk = vv.t / vv.life;
      if (kk >= 1){ m.visible = false; m.material.opacity = 0; return; }
      m.scale.setScalar(vv.r0 + (vv.r1 - vv.r0)*kk);
      m.material.opacity = vv.op * (1 - kk);
    }
    step(v.land);
    for (var i = 0; i < v.pool.length; i++) step(v.pool[i]);
  }
};

/* ---- 零 rnd、单 drawcall 音乐晶体（3 棱锥合并为一份几何；GDD §7.5-4）---- */
function musicShard(cMain, cTip, glow){
  var parts = [
    [0.30, 1.30, 5,  0.00, 0.65,  0.00,  0.0],
    [0.18, 0.86, 5, -0.24, 0.43,  0.08,  0.9],
    [0.16, 0.74, 5,  0.22, 0.37, -0.06, -0.7]
  ];
  var P = [], N = [], C = [];
  var mtx = new THREE.Matrix4(), nm = new THREE.Matrix3(), v = new THREE.Vector3();
  var cA = new THREE.Color(cMain), cB = new THREE.Color(cTip), cc = new THREE.Color();
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    var g = new THREE.ConeGeometry(p[0], p[1], p[2], 1).toNonIndexed();
    var pa = g.attributes.position.array, na = g.attributes.normal.array;
    mtx.makeRotationY(p[6]); mtx.setPosition(p[3], p[4], p[5]);
    nm.getNormalMatrix(mtx);
    for (var j = 0; j < pa.length; j += 3){
      v.set(pa[j], pa[j+1], pa[j+2]).applyMatrix4(mtx); P.push(v.x, v.y, v.z);
      v.set(na[j], na[j+1], na[j+2]).applyMatrix3(nm).normalize(); N.push(v.x, v.y, v.z);
      var tt = clamp((pa[j+1] + p[1]*0.5) / p[1], 0, 1);
      cc.copy(cA).lerp(cB, tt*tt); C.push(cc.r, cc.g, cc.b);
    }
    g.dispose();
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(N, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(C, 3));
  var mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    vertexColors: true, flatShading: true,
    emissive: shade(cMain, 0.55), emissiveIntensity: glow,
    transparent: true, opacity: 0.94
  }));
  mesh.castShadow = true;
  mesh.userData.cMain = cMain; mesh.userData.cTip = cTip;
  return mesh;
}

/* ---- 传送激活台（GDD §4.6 推荐方案：门正下方新增发光圆台，天空环门作远景呼应）---- */
function portalPad(r){
  var g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(r, r*1.06, 0.18, 24, 1),
    M(0xEAF6FF, { emissive: shade(0x9FEBFF, 0.5), ei: 0.8, transparent: true, opacity: 0.86 }),
    0, 0.09, 0, { cast: false });
  var ring = add(g, new THREE.TorusGeometry(r*1.12, 0.12, 8, 28),
    M(0x9FEBFF, { emissive: shade(0x9FEBFF, 0.7), ei: 1.1, transparent: true, opacity: 0.32 }),
    0, 0.16, 0, { cast: false, recv: false, rot: [Math.PI/2, 0, 0] });
  g.userData.ring = ring; g.userData.t = 0;
  return g;
}

/* ---- 任务卡内容（数据驱动，GDD §5.3 / §7.5-6）---- */
function taskInner(){
  var lv = LEVELS[cur], tasks = (lv && lv.tasks) ? lv.tasks : [];
  var h = '<div class="h">探索目标</div>';
  for (var i = 0; i < tasks.length; i++){
    var t = tasks[i], v = GameState.get(t.id);
    h += '<div class="li"><i class="box' + (v >= t.need ? ' done' : '') + '"></i><span>' +
         t.label + '</span><b>' + v + '/' + t.need + '</b></div>';
  }
  return h;
}

/* ---- 收集（GDD §3.3 / §7.5-5）---- */
function m1Collect(g){
  if (!g || g.userData.taken) return;
  g.userData.taken = true; g.visible = false;
  TaskSystem.progress('gems', 1);
  VFX.burst(g.position.x, g.userData.groundY + 0.12, g.position.z);
  m1Sfx('collect');
  var need = 3, lv = LEVELS[cur], ts = lv && lv.tasks;
  if (ts) for (var qi = 0; qi < ts.length; qi++) if (ts[qi].id === 'gems') need = ts[qi].need;
  if (GameState.get('gems') >= need && GameState.portal === 'dormant'){
    GameState.portal = 'charged';
    Bus.emit('portal:charged', {});
    m1Sfx('beatPerfect');
  }
}
var Collectible = {
  register: function(mesh){ mesh.userData.collectible = true; },
  update: function(dt, k, S){
    var lv = LEVELS[k]; if (!lv || !lv.band || !S || !S.scene) return;
    var gs = S.scene.userData.gems;
    if (!gs) return;
    var h = S.hero; if (!h) return;
    for (var i = 0; i < gs.length; i++){
      var g = gs[i]; if (g.userData.taken) continue;
      g.rotation.y += dt * 1.4;
      g.position.y = g.userData.groundY + 1.2 + Math.sin(T*1.7 + g.userData.phase)*0.16;
      var dx = g.position.x - h.position.x, dz = g.position.z - h.position.z;
      if (dx*dx + dz*dz <= CFG.R_COLLECT*CFG.R_COLLECT) m1Collect(g);
    }
  }
};

/* ---- 任务与进度（GDD §3.5 / §7.5-6）---- */
var TaskSystem = {
  progress: function(id, n){ return GameState.add(id, n); },
  isClear: function(k){
    var lv = LEVELS[k]; if (!lv) return true;
    for (var i = 0; i < lv.tasks.length; i++) if (!GameState.taskDone(lv.tasks[i])) return false;
    return true;
  }
};

/* ---- 传送装置状态机（GDD §3.4）：dormant → charged → activated ---- */
var Portal = {
  update: function(dt, k, S){
    var lv = LEVELS[k]; if (!lv || !lv.band || !S || !S.scene || !S.hero) return;
    var pad = S.scene.userData.pad;
    if (!pad) return;
    var st = GameState.portal;
    pad.userData.t += dt;
    pad.scale.setScalar(1 + Math.sin(pad.userData.t*2.2)*0.05);
    var ring = pad.userData.ring;
    if (ring) ring.material.opacity = st === 'dormant' ? 0.32 : (st === 'charged' ? 0.9 : 1.0);
    if (lv.summitZ != null && S.hero.position.z <= lv.summitZ && GameState.get('summit') < 1) TaskSystem.progress('summit', 1);
    if (st === 'charged'){
      var rr3 = lv.padR || CFG.R_PORTAL;
      var dx = pad.position.x - S.hero.position.x, dz = pad.position.z - S.hero.position.z;
      if (dx*dx + dz*dz <= rr3*rr3){
        GameState.portal = 'activated';
        GameState.add('portal', 1);
        Bus.emit('portal:go', {});
        m1Sfx('portalGo'); HUD.flash(CFG.FADE);
        var nx = lv.next || 'home';
        setTimeout(function(){ setScene(nx); }, 380);
      }
    }
  }
};

/* ---- 角色位移 + 贴地（GDD §3.1 / §7.5-2；红线：只改 x/z，y 交给 poseHero）---- */
var PlayerController = {
  vx: 0, vz: 0, moved: false,
  reset: function(){ PlayerController.vx = 0; PlayerController.vz = 0; PlayerController.moved = false; },
  mode: function(k){ return (LEVELS[k] && LEVELS[k].band) ? 'run' : 'idle'; },
  update: function(dt, k, S){
    var lv = LEVELS[k];
    if (dt <= 0 || !lv || !lv.band) return;                /* M2：desert / cave 均可自由移动 */
    if (!S || !S.runnable || !S.hero || !S.scene || !S.scene.userData.ground) return;
    var ground = S.scene.userData.ground;
    var mx = Input.move.x, mz = Input.move.z, l = Math.sqrt(mx*mx + mz*mz);
    var sp = Input.sprint ? CFG.SPEED_F*CFG.SPRINT : CFG.SPEED_F;
    var tvx = 0, tvz = 0;
    if (l > 0){ mx /= l; mz /= l; tvx = mx*sp; tvz = mz*sp; }
    var kk = 1 - Math.exp(-(l > 0 ? 1/CFG.ACC : 1/CFG.DEC) * dt);
    PlayerController.vx += (tvx - PlayerController.vx) * kk;
    PlayerController.vz += (tvz - PlayerController.vz) * kk;
    /* 静止零写入：从未移动且无输入 ⇒ 立即返回，保证形变/位移零发生 */
    if (!PlayerController.moved && l === 0 &&
        Math.abs(PlayerController.vx) < 1e-4 && Math.abs(PlayerController.vz) < 1e-4) return;
    var h = S.hero;
    h.position.x = clamp(h.position.x + PlayerController.vx*dt, lv.band[0], lv.band[1]);
    h.position.z = clamp(h.position.z + PlayerController.vz*dt, lv.band[2], lv.band[3]);
    if (l > 0) h.rotation.y = Math.atan2(-mx, -mz);        /* 模型默认正面 = −z */
    h.userData.baseY = ground(h.position.x, h.position.z);
    PlayerController.moved = true;
  }
};

/* ---- 相机装置 · 方案 B 微跟随（GDD §3.9 / §7.2 M2；Q: 第一关也跟随）
   以定帧机位 CAM[k] 为基准，按 K·(hero − 出生点) 做 x/z **纯平移**跟随
   （相机与注视点同量平移、朝向不变 ⇒ 望远镜式推近，只改取景范围不改朝向）；
   位移经指数平滑（滞后感即"微"）。出生点位移为 0 ⇒ 相机与定帧逐位一致，
   故"静止于出生点"时 heroC 仍零漂移；FREEZE（截图门禁）下整段不执行。
   仅对可玩关（存在 LEVELS[k].band）生效；home/base 保持固定机位。 */
var CameraRig = {
  K: 0.8, RATE: 5.0,
  _base: {}, _look: {}, _off: {}, _spawn: {},
  init: function(k){
    var S = SCN[k]; if (!S || !S.camera || !S.hero || !S.hero.home) return;
    var v = camVectors(CAM[k]);
    CameraRig._base[k]  = v.pos.clone();
    CameraRig._look[k]  = v.look.clone();
    CameraRig._off[k]   = new THREE.Vector3(0, 0, 0);
    CameraRig._spawn[k] = S.hero.home.clone();
  },
  off: function(k){ var o = CameraRig._off[k]; return o ? [+o.x.toFixed(3), +o.y.toFixed(3), +o.z.toFixed(3)] : null; },
  reset: function(k){
    if (CameraRig._off[k]) CameraRig._off[k].set(0, 0, 0);
    var S = SCN[k];
    if (S && S.camera && CameraRig._base[k]){
      S.camera.position.copy(CameraRig._base[k]);
      S.camera.lookAt(CameraRig._look[k]);
    }
  },
  update: function(dt, k){
    var lv = LEVELS[k]; if (!lv || !lv.band) return;      /* 仅可玩关跟随 */
    var S = SCN[k], base = CameraRig._base[k], look = CameraRig._look[k], sp = CameraRig._spawn[k];
    if (!S || !S.camera || !S.hero || !base || !sp) return;
    var h = S.hero.position;
    var tx = (h.x - sp.x) * CameraRig.K;                  /* 只跟水平面：跳跃不带动机位上下抖 */
    var tz = (h.z - sp.z) * CameraRig.K;
    var o = CameraRig._off[k];
    var a = 1 - Math.exp(-CameraRig.RATE * dt);
    o.x += (tx - o.x) * a; o.z += (tz - o.z) * a;
    S.camera.position.set(base.x + o.x, base.y, base.z + o.z);
    S.camera.lookAt(look.x + o.x, look.y, look.z + o.z);
  }
};

/* ---- HUD 接线（GDD §5.3 / §7.5-8）：只在数据变化时重渲染 ---- */
var HUD = {
  dirty: false, _flash: null,
  markDirty: function(){ HUD.dirty = true; },
  sync: function(){
    if (!HUD.dirty) return;
    HUD.dirty = false;
    if (SHOWCASE) return;
    var host = document.getElementById('huds');
    var t = host && host.querySelector('.hudLayer .task');
    if (t) t.innerHTML = taskInner();
  },
  flash: function(sec){
    var f = HUD._flash;
    if (!f){
      f = document.createElement('div');
      f.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:#EAFBFF;' +
        'opacity:0;pointer-events:none;z-index:9999;transition:opacity .18s ease';
      document.body.appendChild(f); HUD._flash = f;
    }
    f.style.opacity = '0.85';
    setTimeout(function(){ f.style.opacity = '0'; }, Math.max(80, (sec || 0.35)*1000*0.5));
  }
};

/* ---- M1 模块入口 ---- */
var M1 = {
  enter: function(k){
    GameState.reset(k);
    PlayerController.reset();
    CameraRig.reset(k);
    var S = SCN[k], sd = (S && S.scene) ? S.scene.userData : null;
    if (sd && sd.gems){
      for (var i = 0; i < sd.gems.length; i++){
        var g = sd.gems[i];
        g.userData.taken = false; g.visible = true;
        g.rotation.y = g.userData.rotY0 || 0;
        g.position.y = g.userData.groundY + 1.2;
      }
    }
    if (sd && sd.pad){ sd.pad.userData.t = 0; sd.pad.scale.setScalar(1); }
    BeatClock.setSong(SONGS[(LEVELS[k] && LEVELS[k].song) || 'sunny']);
    HUD.markDirty();
  },
  interact: function(){
    var S = SCN[cur];
    if (!S || !S.hero || !S.scene) return;
    var gs = S.scene.userData.gems;
    if (gs){
      var rr2 = (CFG.R_COLLECT*1.8)*(CFG.R_COLLECT*1.8);
      for (var i = 0; i < gs.length; i++){
        var g = gs[i]; if (g.userData.taken) continue;
        var dx = g.position.x - S.hero.position.x, dz = g.position.z - S.hero.position.z;
        if (dx*dx + dz*dz <= rr2){ m1Collect(g); return; }
      }
    }
    m1Sfx('uiClick');
  }
};
Bus.on('progress', function(){ HUD.markDirty(); });

/* ==========================================================================
   7. 启动
   ========================================================================== */
function boot(){
  srand(0x2F6E2B1); SCN.home   = buildHome();
  srand(0x51C7A3); SCN.desert = buildDesert();
  srand(0x9B31F7); SCN.cave   = buildCave();
  srand(0x77E2D9); SCN.base   = buildBase();
  RENDER_ORDER.forEach(function(k){
    if (SCN[k].hero){
      SCN[k].hero.home = SCN[k].hero.position.clone();
      /* 记录构建期基准，供 setScene 往返复位（保证 heroC 逐位可复现） */
      SCN[k].hero.userData.baseY0 = SCN[k].hero.userData.baseY;
      SCN[k].hero.userData.rotY0 = SCN[k].hero.rotation.y;
    }
  });
  setupCameras();
  RENDER_ORDER.forEach(function(k){ CameraRig.init(k); });   /* M2：记录各关基准机位与出生点 */
  scenesReady = true;
  if (!SCN[cur]) cur = 'home';
  setScene(cur);
  buildHUD();
  if (COMPARE) setupCompare();
  last = performance.now();
  requestAnimationFrame(loop);
}
function setupCompare(){
  document.getElementById('cmp').classList.add('on');
  document.getElementById('cmpbar').classList.add('on');
  var img = document.getElementById('cmpimg');
  img.src = new URLSearchParams(location.search).get('ref') || '15645d0f-8490-47a7-a594-49aa84b6c123.png';
  img.style.opacity = 0.5;
  var sl = document.getElementById('cmpslider');
  sl.addEventListener('input', function(){
    img.style.opacity = (sl.value/100).toFixed(2);
    document.getElementById('cmpval').textContent = sl.value + '%';
  });
}
window.__setScene = setScene;
window.__SCN = SCN; /* 调试钩子：控制台可访问各场景对象 */
window.__info = function(){
  var out = {};
  RENDER_ORDER.forEach(function(k){
    var c = SCN[k].camera, h = SCN[k].hero;
    var e = { cam: c.position.toArray().map(function(v){return +v.toFixed(2);}), children: SCN[k].scene.children.length };
    if (h){
      var box = new THREE.Box3().setFromObject(h);
      var ctr = box.getCenter(new THREE.Vector3());
      function ndcV(v){ var p = v.clone().project(c); return [+((p.x+1)/2).toFixed(3), +((1-p.y)/2).toFixed(3)]; }
      e.heroC = ndcV(ctr);
      e.heroFeet = ndcV(new THREE.Vector3(ctr.x, box.min.y, ctr.z));
      e.heroHead = ndcV(new THREE.Vector3(ctr.x, box.max.y, ctr.z));
      e.hPct = +(e.heroFeet[1] - e.heroHead[1]).toFixed(3);
      e.heroY = +h.position.y.toFixed(3);
      e.baseY = +h.userData.baseY.toFixed(3);
    }
    out[k] = e;
  });
  out.calls = renderer.info.render.calls; out.tris = renderer.info.render.triangles;
  out.jump = { on: jump.on, y: +jump.y.toFixed(3), v: +jump.v.toFixed(3), perfect: !!jump.perfect };
  out.cur = cur;
  var _lv = LEVELS[cur], _t = {};
  if (_lv) for (var _i = 0; _i < _lv.tasks.length; _i++) _t[_lv.tasks[_i].id] = GameState.get(_lv.tasks[_i].id) + '/' + _lv.tasks[_i].need;
  out.m1 = { mode: PlayerController.mode(cur), portal: GameState.portal, gems: GameState.get('gems'),
             tasks: _t, beat: +BeatClock.phase.toFixed(3), inWin: BeatClock.inWindow(),
             heroX: SCN[cur] && SCN[cur].hero ? +SCN[cur].hero.position.x.toFixed(3) : null,
             heroZ: SCN[cur] && SCN[cur].hero ? +SCN[cur].hero.position.z.toFixed(3) : null,
             camOff: CameraRig.off(cur) };
  return out;
};
boot();
})();
