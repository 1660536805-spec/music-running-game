  if (!S || !S.runnable) return;                 /* 仅可玩关响应 */
  if (isCw()){ CWInput.press(); return; }        /* M3-CW：按下待判（轻点→升/降，长按→同调） */
  Lane.request(e.clientX < innerWidth / 2 ? -1 : 1, cur);
});
/* pointerup/cancel 挂 window：指针移出画布也能正确收尾；CWInput 内部有状态守卫，重复调用无副作用 */
addEventListener('pointerup', function(e){ if (isCw()) CWInput.release(e.clientY < innerHeight / 2 ? 1 : -1); });
addEventListener('pointercancel', function(){ if (isCw()) CWInput.cancel(); });
addEventListener('keydown', function(e){
  Input.keys[e.code] = true;
  if (isCw()){
    /* M3-CW：单赛道关——↑/W 升、↓/S 降、长按 空格 同调；不触发跳跃 / 换道 */
    if (e.code === 'ArrowUp'   || e.code === 'KeyW'){ e.preventDefault(); if (!e.repeat) CWInput.lift(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS'){ e.preventDefault(); if (!e.repeat) CWInput.dive(); }
    if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) CWInput.begin(); }
  } else {
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); doJump(); }
    /* M3-OP：键盘换道（← → / A D）；长按不重复触发（e.repeat 守卫） */
    if (!e.repeat){
      if (e.code === 'ArrowLeft'  || e.code === 'KeyA'){ e.preventDefault(); Lane.request(-1, cur); }
      if (e.code === 'ArrowRight' || e.code === 'KeyD'){ e.preventDefault(); Lane.request( 1, cur); }
    }
  }
  if (e.key === '1') setScene('home');
  if (e.key === '2') setScene('desert');
  if (e.key === '3') setScene('cave');
  if (e.key === '4') setScene('base');
  if (e.key === '5') setScene('causeway');
  if (e.key === 'f' || e.key === 'F') M1.interact();
});
addEventListener('keyup', function(e){
  Input.keys[e.code] = false;
  if (e.code === 'Space' && isCw()) CWInput.end();   /* M3-CW：松开空格 = 同调松手 */
});
addEventListener('blur', function(){ Input.keys = {}; Input.btn.sprint = false; if (isCw()) CWInput.cancel(); });

/* ==========================================================================
   6. 主循环
   ========================================================================== */
var T = 0, last = performance.now();
function updateScene(k, dt){
  var S = SCN[k]; if (!S) return;
  var sc = S.scene;
  if (sc.userData.beam){ var s2 = 1 + Math.sin(T*1.1)*0.035; sc.userData.beam.scale.set(s2, 1, s2); }
  var wf = sc.userData.wf;
  if (wf && wf.userData.mist){
    wf.userData.mist.position.y = -0.35 + Math.sin(T*1.7)*0.3;
    wf.userData.mist.scale.set(1 + Math.sin(T*1.2)*0.05, 0.45, 1);
  }
  /* 瀑布落点消散雾的呼吸（一次性收集带 isFall 标记的组，之后每帧只读） */
  var falls = sc.userData._falls;
  if (falls == null){
    falls = [];
    sc.traverse(function(o){ if (o.userData && o.userData.isFall) falls.push(o); });
    sc.userData._falls = falls;
  }
  for (var fi = 0; fi < falls.length; fi++){
    var tl = falls[fi].userData.tail; if (!tl) continue;
    for (var fj = 0; fj < tl.length; fj++){
      var q = tl[fj], bo = q.userData.baseOpacity || 0.4;
      q.material.opacity = bo + Math.sin(T*1.5 + q.userData.phase)*0.06;
      q.scale.y = 0.55 + Math.sin(T*1.3 + q.userData.phase)*0.05;
    }
  }
  /* 风：树 / 灌木 / 草丛轻摆（零 draw call 消耗，相位由世界坐标导出，
     因此相邻植株不会同频，也不需要额外存储随机数） */
  var sway = sc.userData._sway;
  if (sway == null){
    sway = [];
    sc.updateMatrixWorld(true);
    var wp = new THREE.Vector3();
    sc.traverse(function(o){
      if (o.userData && o.userData.swayable){
        o.getWorldPosition(wp);
        o.userData._ph = wp.x*0.7 + wp.z*1.3;
        o.userData._rz = o.rotation.z; o.userData._rx = o.rotation.x;
        sway.push(o);
      }
    });
    sc.userData._sway = sway;
  }
  for (var swi = 0; swi < sway.length; swi++){
    var so = sway[swi], sph = so.userData._ph;
    so.rotation.z = so.userData._rz + Math.sin(T*1.60 + sph)*0.030;
    so.rotation.x = so.userData._rx + Math.sin(T*1.25 + sph*1.4)*0.020;
  }
  /* 飘落花瓣：y 上限内循环下落 + 横向飘摆 */
  var pfs = sc.userData._petals;
  if (pfs == null){
    pfs = []; sc.traverse(function(o){ if (o.userData && o.userData.petal) pfs.push(o); });
    sc.userData._petals = pfs;
  }
  for (var pfi = 0; pfi < pfs.length; pfi++){
    var pf = pfs[pfi], pa = pf.geometry.attributes.position;
    var pb = pf.userData.base, pph = pf.userData.ph, psp = pf.userData.sp;
    var pspan = pf.userData.ySpan, py0 = pf.userData.y0;
    for (var pj = 0; pj < pph.length; pj++){
      var pyb = pb[pj*3+1] - (T*psp[pj]) % pspan;
      if (pyb < py0) pyb += pspan;
      pa.array[pj*3]   = pb[pj*3] + Math.sin(T*psp[pj]*1.6 + pph[pj])*1.7;
      pa.array[pj*3+1] = pyb;
    }
    pa.needsUpdate = true;
  }
  /* 鸟群：绕圆心盘旋 + 上下浮动 + 扇翅 */
  var flocks = sc.userData._flocks;
  if (flocks == null){
    flocks = []; sc.traverse(function(o){ if (o.userData && o.userData.flock) flocks.push(o); });
    sc.userData._flocks = flocks;
  }
  for (var fli = 0; fli < flocks.length; fli++){
    var fl = flocks[fli], orb = fl.userData.orbit, bs = fl.userData.birds;
    for (var bi2 = 0; bi2 < bs.length; bi2++){
      var bd = bs[bi2], ud = bd.userData, ang = ud.a0 + T*orb.s;
      bd.position.set(orb.cx + Math.cos(ang)*orb.r*ud.rr2,
                      orb.cy + Math.sin(T*0.6 + ud.a0)*ud.ys,
                      orb.cz + Math.sin(ang)*orb.r*ud.rr2);
      bd.rotation.y = -ang + Math.PI/2;
      bd.rotation.z = Math.sin(T*ud.fs + ud.fp)*0.55;
    }
  }
  var crs = sc.userData.crystals;
  if (crs) for (var i = 0; i < crs.length; i++){
    var c = crs[i], cp = c.userData.phase;
    /* A13 相位去同步：未显式赋相位的晶簇（占绝大多数）改为「由世界坐标导出相位」，
       零随机数、零存储，使原本 phase=0 而整齐同步脉动的晶簇各自错峰呼吸。 */
    if (cp == null) cp = c.position.x*0.7 + c.position.y*0.9 + c.position.z*0.6;
    var s3 = 1 + Math.sin(T*1.6 + cp)*0.035;
    c.scale.setScalar(s3 * (c.userData.baseScale || 1));
  }
  var mts = sc.userData.motes;
  if (mts) for (var mi2 = 0; mi2 < mts.length; mi2++){
    var mp = mts[mi2], attr = mp.geometry.attributes.position;
    var bs = mp.userData.base, mph = mp.userData.ph, msp = mp.userData.sp;
    for (var mj = 0; mj < mph.length; mj++){
      attr.array[mj*3]   = bs[mj*3]   + Math.sin(T*msp[mj]*0.7 + mph[mj])*1.1;
      attr.array[mj*3+1] = bs[mj*3+1] + Math.sin(T*msp[mj] + mph[mj])*1.4;
    }
    attr.needsUpdate = true;
  }
  /* M3-CW：近处悬浮碎晶自转 + 上下浮动（仅 causeway 有该数组 ⇒ 其余场景零开销） */
  var shards = sc.userData.shards;
  if (shards) for (var shi = 0; shi < shards.length; shi++){
    var so2 = shards[shi], ud = so2.userData;
    so2.rotation.y += dt * ud.spin; so2.rotation.x += dt * ud.spin * 0.6;
    so2.position.y = ud.y0 + Math.sin(T * 1.3 + ud.ph) * 0.9;
  }
  if (S.hero){
    if (jump.on){
      jump.v -= CFG.G*dt; jump.y += jump.v*dt;
      if (jump.y <= 0){
        jump.y = 0; jump.v = 0; jump.on = false;
        if (k === 'desert'){
          /* §5.2：仅踩点跳给地面波纹（未踩点靠"没有正反馈"体现） */
          if (jump.perfect) VFX.land(S.hero.position.x, S.hero.userData.baseY + 0.06, S.hero.position.z);
          m1Sfx('land');
        }
        jump.perfect = false;
      }
    }
    S.hero.position.y = S.hero.userData.baseY + jump.y;
    poseHero(S.hero, PlayerController.mode(k), T + (k === 'cave' ? 3.2 : 0), jump.y);
    /* M3-CW：升降俯仰/越界侧倾必须在 poseHero **之后**叠加 ——
       poseHero('run') 每帧会写 hero.rotation.x 与 rotation.z，先写会被覆盖。 */
    if (k === 'causeway' && !FREEZE){
      if (Track.pitch) S.hero.rotation.x += D2R(Track.pitch);
      if (Track.roll)  S.hero.rotation.z += D2R(Track.roll);
    }
    var sh = S.hero.userData.shadow;
    if (sh){ var kk = 1 - Math.min(0.6, jump.y*0.15); sh.scale.setScalar(kk); sh.material.opacity = kk; }
  }
}
function renderShowcase(){
  var W = innerWidth, H = innerHeight;
  for (var i = 0; i < RENDER_ORDER.length; i++){
    var k = RENDER_ORDER[i], col = i % 2, row = (i/2)|0;
    var x = col*W/2, y = H - (row + 1)*H/2;
    renderer.setViewport(x, y, W/2, H/2);
    renderer.setScissor(x, y, W/2, H/2);
    renderer.setScissorTest(true);
    renderer.render(SCN[k].scene, SCN[k].camera);
  }
  renderer.setScissorTest(false);
}
function loop(now){
  requestAnimationFrame(loop);
  var dt = FREEZE ? 0 : Math.min(0.05, (now - last)/1000);
  last = now;
  if (!FREEZE) T += dt;
  if (scenesReady){
    if (SHOWCASE){
      for (var i = 0; i < RENDER_ORDER.length; i++) updateScene(RENDER_ORDER[i], dt);
      renderShowcase();
    } else {
      /* GDD §6.3 每帧顺序：Input → BeatClock → PlayerController → Collectible → Portal
         → VFX →（既有）updateScene。FREEZE 下整段跳过 ⇒ 对定帧零影响 */
      if (!FREEZE){
        Input.poll();
        BeatClock.update(dt);
        Lane.update(dt, cur);                      /* M3-OP：跑道换道插值（easeOutCubic） */
        Track.update(dt, cur);                     /* M3-CW：单赛道升降层插值（causeway 专用） */
        Obstacle.update(dt, cur, SCN[cur]);        /* M3-CW：谱面→障碍生成 / 掠过判定 / 回收 */
        PlayerController.update(dt, cur, SCN[cur]);
        Collectible.update(dt, cur, SCN[cur]);
        Portal.update(dt, cur, SCN[cur]);
        if (Track.isCw(cur)) Lens.update(dt, cur);  /* M3-CW：causeway 由 Lens 接管（5 镜头状态机） */
        else CameraRig.update(dt, cur);             /* M2：方案 B 微跟随（仅可玩关） */
        CWAnt.update(dt);                          /* M3-CW·P4：预判窗口（段落交界前 2 拍押注 → amo） */
        CWReso.update(dt);                         /* M3-CW·P4：同调长按（呼吸长度判定 → mult） */
        VFX.update(dt, cur);
        RhythmHUD.update(dt);                      /* M3-CW：音游浮层（仅 causeway 显示时写 DOM） */
      }
      updateScene(cur, dt);
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      renderer.setScissorTest(false);
      renderer.render(SCN[cur].scene, SCN[cur].camera);
    }
  }
  if (!FREEZE) scheduleAudio();
  HUD.sync();   /* §7.5-8：仅数据变化时重渲染任务卡 */
  if (DBG){
    document.getElementById('dbg').classList.add('on');
    document.getElementById('dbg').textContent =
      'scene=' + (SHOWCASE ? 'showcase' : cur) + '  freeze=' + FREEZE +
      '  calls=' + renderer.info.render.calls + '  tris=' + renderer.info.render.triangles;
  }
}
addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  if (!scenesReady) return;
  var aspect = innerWidth/innerHeight;
  SCENES_ALL.forEach(function(k){ SCN[k].camera.aspect = aspect; SCN[k].camera.updateProjectionMatrix(); });
  buildHUD();
});

/* ==========================================================================
   6.5 M1 · 可玩闭环（desert 跑跳收集）—— GDD §7.5 八项 + §0.4 五项
   --------------------------------------------------------------------------
   设计约束（红线 §0.3）：
     · 新增物体全部走 dseq / 纯参数 ⇒ 全局 rnd() 随机序列零漂移；
     · 静止时对 hero 零写入 ⇒ 四场景 heroC 逐位不变；
     · 玩法对象只"叠加"，不动既有地物、不动定帧机位基准值。
   ========================================================================== */

/* ---- 手感 / 数值（GDD §3.9 Tuning Sheet）---- */
var CFG = {
  SPEED_F: 4.5, SPEED_S: 1.6, SPRINT: 1.6,      /* 前进 / 横移 (u/s)、冲刺倍率 */
  V0: 6.0, V0_PERFECT: 7.2, G: 18,              /* 跳跃初速 / 踩点加成 / 重力 */
  W_BEAT: 0.09,                                 /* 拍点窗口（占单拍比例）*/
  R_COLLECT: 2.5, R_PORTAL: 3.0,                /* 吸附 / 传送判定半径 */
  ACC: 0.12, DEC: 0.10, FADE: 0.35,             /* 起停缓动 / 白闪时长 */
  X_MIN: -7.0, X_MAX: 7.0, Z_MIN: -24.0, Z_MAX: 1.0,  /* 浅纵深轻量关可玩带（旧：自由移动用，保留） */
  /* ---- M3-OP · 跑道切换（见 docs/声浪星球-跑道切换控制方案.md）----
     自动前进 + 玩家仅左右换道；道宽由 band 宽度 / LANE_N 推导，保证音符落在某条道附近 */
  LANE_N: 5,            /* 跑道数（Normal/Hard） */
  SWITCH_DUR: 0.11,     /* 换道插值时长 (s)：须 < 最快音符间隔，见方案 §3.1 */
  ROLL_MAX: 14,         /* 换道最大侧倾 (deg) */
  BUFFER_T: 0.22,       /* 输入缓冲有效期 (s)：动画中按下 → 排队 1 次 */
  BUMP_T: 0.12,         /* 越界"软墙"回弹时长 (s) */
  BUMP_G: 0.35          /* 越界衰减位移（占 1 道比例） */
};

/* ---- 曲库（GDD §3.6）---- */
var SONGS = {
  sunny:    { name: '晴天', artist: '周杰伦', bpm: 118, total: '04:29', wave: 0.4 },
  nocturne: { name: '夜曲', artist: '周杰伦', bpm: 126, total: '03:46', wave: 2.1 },
  rice:     { name: '稻香', artist: '周杰伦', bpm: 110, total: '03:43', wave: 4.7 },
  /* M3-CW ·《超频长阶》内置合成曲（由 tools/gen_causeway.js 生成，真值谱面同源） */
  superweave: { name: '超频长阶', artist: 'Soundwave Planet', bpm: 158, total: '01:37', wave: 7.3 }

/* ---- 关卡定义（GDD §4.2 / §4.6 / §4.7）----
   M1：desert 浅纵深轻量关（晶体 z 压缩进可玩带，x 布局签名沿用 §4.6）。
   M2：cave 接入同一套模块；band = 可玩带 [xMin, xMax, zMin, zMax]；next = 传送目标关。*/
var M1_GEMS = [[2.0, -8.0], [-3.5, -14.0], [3.5, -20.0]];
var M1_PAD  = [1.0, -23.0];

var CAVE_GEMS = [[-11.0, -20.0], [10.5, -14.0], [-3.4, -38.0]];
var CAVE_PAD  = [-3.4, -42.0];
var LEVELS = {
  desert: { song: 'sunny', spawn: [0.6, -1.5], ground: 'dh',
            band: [-7.0, 7.0, -24.0, 1.0], padR: 3.0, summitZ: -18.0, next: 'cave',
            tasks: [ { id: 'gems',   label: '收集 3 个音乐晶体', need: 3 },
                     { id: 'portal', label: '激活传送装置',     need: 1 },
                     { id: 'summit', label: '到达山顶',         need: 1 } ] },
  cave:   { song: 'nocturne', spawn: [-1.75, -3.2], ground: 'chh',
            band: [-14.0, 14.0, -44.0, 3.0], padR: 3.0, summitZ: null, next: 'base',
            tasks: [ { id: 'gems',   label: '收集 3 个音乐晶体', need: 3 },
                     { id: 'portal', label: '激活传送装置',     need: 1 } ] },
  base:   { song: 'rice',     spawn: null, tasks: [] },
  /* M3-CW ·《超频长阶》：单赛道关。
     · 仍给 band —— PlayerController.update / CameraRig.update 均以 lv.band 为前置守卫，
       不给 band 会连带失去"自动前进"；laneN:1 使 Lane.xAt(k,0) 恰为赛道中心 ⇒ x 锁定中心。
     · 赛道宽 3.5m（xMin/xMax ±1.75）；终点 z = 谱面末障碍之后（Track.zEnd）。

  causeway: { song: 'superweave', mode: 'single-track', laneN: 1,
              spawn: [0.0, 4.0], ground: 'cw', speed: 11,
              band: [-1.75, 1.75, -1260.0, 4.0], padR: 0, summitZ: null, next: null,
              tasks: [] }

/* ---- M3-OP · 跑道（GDD/控制方案 §2/§3）------------------------------------
   自动前进，玩家只做左右换道。车道为离散整数坐标 idx；换道即一次"击打"，
   落在拍点上是 Perfect（判定由 M3-A Judge 消费，本模块只负责位移与手感）。
   设计约束：
     · 一次输入仅跨 1 道（保"1 输入 = 1 击打"的判定语义，防瞬移穿模）；
     · 无硬冷却 → 用 SWITCH_DUR 动画天然限流 + 输入缓冲 1 次；
     · 越界给"软墙"反馈（衰减位移 + 挤压），不断连击、不扣分；
     · 道宽 = band 宽 / LANE_N ⇒ 关卡内所有音符必然落在某条道的吸附半径内；
     · FREEZE（截图门禁）下不写入 hero.position.x ⇒ 定帧 heroC 逐位不变。 */
var Lane = {
  idx: 0, target: 0, from: 0, t: 1, roll: 0, buf: 0, bufT: 0, _bump: 0, bumpBase: 0, bumpDir: 0,
  laneN: function(k){ var lv = LEVELS[k]; return (lv && lv.laneN) ? lv.laneN : CFG.LANE_N; },
  laneW: function(k){ var lv = LEVELS[k];
    return (lv && lv.band) ? (lv.band[1] - lv.band[0]) / Lane.laneN(k) : 2.2; },
  /* 连续车道坐标 → 世界 x（idx 为整数时落在道中心） */
  xAt: function(k, idx){ var lv = LEVELS[k]; if (!lv || !lv.band) return 0;
    return lv.band[0] + (idx + 0.5) * Lane.laneW(k); },
  reset: function(k, snap){
    var lv = LEVELS[k], S = SCN[k];
    var sx = (S && S.hero && S.hero.home) ? S.hero.home.x : 0;
    var cont = (lv && lv.band) ? ((sx - lv.band[0]) / Lane.laneW(k) - 0.5) : 0;
    if (snap){
      /* 实玩时吸附到最近道中心；FREEZE 下保持连续值（= 出生点 x）⇒ 定帧逐位不变 */
      Lane.idx = clamp(Math.round(cont), 0, Lane.laneN(k) - 1);
      if (S && S.hero) S.hero.position.x = Lane.xAt(k, Lane.idx);
      Lane.target = Lane.idx; Lane.from = Lane.idx;
    } else {
      Lane.idx = cont; Lane.target = cont; Lane.from = cont;
    }
    Lane.t = 1; Lane.roll = 0; Lane.buf = 0; Lane.bufT = 0; Lane._bump = 0;
  },
  request: function(dir, k){
    var lv = LEVELS[k]; if (!lv || !lv.band) return false;
    if (Lane._bump > 0) return false;                        /* 软墙回弹中忽略 */
    if (Lane.t < 1){ Lane.buf = dir; Lane.bufT = CFG.BUFFER_T; return false; }   /* 动画中 → 缓冲 1 次 */
    var base = Math.round(Lane.idx);
    var nt = base + dir;
    if (nt < 0 || nt > Lane.laneN(k) - 1){                   /* 越界"软墙" */
      Lane.bumpBase = base; Lane.bumpDir = dir; Lane._bump = CFG.BUMP_T;
      return false;
    }
    Lane.from = Lane.idx; Lane.target = nt; Lane.t = 0;
    return true;
  },
  update: function(dt, k){
    if (dt <= 0) return;
    if (Lane.bufT > 0){ Lane.bufT = Math.max(0, Lane.bufT - dt); if (Lane.bufT === 0) Lane.buf = 0; }
    if (Lane._bump > 0){                                     /* 越界软墙：衰减位移 + 回弹 */
      Lane._bump = Math.max(0, Lane._bump - dt);
      var bp = Lane._bump / CFG.BUMP_T;
      Lane.idx = Lane.bumpBase + Lane.bumpDir * CFG.BUMP_G * bp;
      Lane.roll = Lane.bumpDir * CFG.ROLL_MAX * 0.35 * bp;
      if (Lane._bump === 0){ Lane.idx = Lane.bumpBase; Lane.target = Lane.bumpBase; Lane.from = Lane.bumpBase; Lane.roll = 0; }
      return;
    }
    if (Lane.t < 1){                                         /* 换道插值（easeOutCubic） */
      Lane.t = Math.min(1, Lane.t + dt / CFG.SWITCH_DUR);
      var e = 1 - Math.pow(1 - Lane.t, 3);
      Lane.idx = Lane.from + (Lane.target - Lane.from) * e;
      Lane.roll = (Lane.target - Lane.from) * CFG.ROLL_MAX * (1 - e);
      if (Lane.t >= 1){
        Lane.idx = Lane.target; Lane.roll = 0;
        if (Lane.buf){ var d = Lane.buf; Lane.buf = 0; Lane.bufT = 0; Lane.request(d, k); }
      }
    }
  },
  info: function(){ return { lane: Math.round(Lane.idx), idx: +Lane.idx.toFixed(3), target: +(+Lane.target).toFixed(3),
    roll: +Lane.roll.toFixed(2), buf: Lane.buf, t: +Lane.t.toFixed(3), bump: +Lane._bump.toFixed(3) }; }
};

/* ---- M3-CW · 单赛道升降层（Track）----------------------------------------
   与 Lane 并列的第二套操作范式，**仅对 causeway（mode:'single-track'）生效**。
   横向已由 laneN:1 锁死在赛道中心 ⇒ 玩家唯一输入 = 升(Lift→hi) / 降(Dive→lo)（+ P4 同调长按）。
   设计约束（对齐 docs/声浪星球-关卡设计-超频长阶.md §3）：
     · 层间切换 90ms easeOutCubic（快于换道 110ms，因整体节奏偏快）；
     · **不写 hero.position.y** —— 只更新 Track.layerY，由 scene.userData.ground 注入 baseY；
     · 越界（已在 Hi 再按升）= 软反馈（+6° 仰角 + 音），不断连击；
     · 输入缓冲 1 次；
     · FREEZE 下不更新（causeway 亦不在 RENDER_ORDER）⇒ 定帧零漂移，双保险。 */
var Track = {
  layer: 'lo', target: 'lo', t: 1, fromY: 0, toY: 0, layerY: 0,
  pitch: 0, roll: 0, buf: 0, bufT: 0, bump: 0, bumpDir: 0, songT: 0, section: null, lastSwitchT: 0,
  isCw: function(k){ return !!(LEVELS[k] && LEVELS[k].mode === 'single-track'); },
  /* ---- 谱面时钟几何（镜像 tools/gen_causeway.js：分段常量速度的闭式积分）----
     距离 D(t) / 世界 z(t) / 反函数 t(D)：供 Track 起播锚定与 P3 障碍落位使用。 */
  distAt: function(t){
    var ss = Chart.data ? Chart.data.sections : null; if (!ss) return 0;
    var d = 0;
    for (var i = 0; i < ss.length; i++){ var s = ss[i], a = Math.min(t, s.t1), b = s.t0; if (a > b) d += s.speed * (a - b); }
    return d;
  },
  zOf: function(t){ return CW.Z_START - Track.distAt(t); },
  tAtDist: function(d){
    var ss = Chart.data ? Chart.data.sections : null; if (!ss) return 0;
    var acc = 0;
    for (var i = 0; i < ss.length; i++){ var s = ss[i], seg = s.speed * (s.t1 - s.t0);
      if (d < acc + seg) return s.t0 + (d - acc) / s.speed; acc += seg; }
    return ss[ss.length - 1].t1;
  },
  reset: function(k){
    Track.layer = 'lo'; Track.target = 'lo'; Track.t = 1;
    Track.layerY = 0; Track.fromY = 0; Track.toY = 0;
    Track.pitch = 0; Track.roll = 0; Track.buf = 0; Track.bufT = 0; Track.bump = 0;
    Track.songT = 0; Track.energy = 0; Track.lastSwitchT = -99;
  },
  /* 判定用"有效层"：层间切换动画进行中时按**已提交的目标层**计（玩家已下决心，
     且 90 ms 切换 < 半拍 190 ms ⇒ 允许在闸门前压线切） */
  effLayer: function(){ return (Track.t < 1) ? Track.target : Track.layer; },
  /* 升(+1) / 降(−1)：一次输入翻转一层；同层再按 ⇒ 越界软反馈，不算失败 */
  request: function(dir, k){
    var to = (dir > 0) ? 'hi' : 'lo';
    if (Track.t < 1){ Track.buf = dir; Track.bufT = CFG.BUFFER_T; return false; }   /* 动画中缓冲 1 次 */
    if (to === Track.target){ Track._bump(dir); return false; }
    Track.fromY = Track.layerY; Track.toY = (to === 'hi') ? CW.LAYER_HI : 0;
    Track.target = to; Track.t = 0;
    Track.lastSwitchT = Track.songT;                 /* M3-CW：供 Judge 量取"操作新鲜度" */
    Bus.emit('cw:layer', { to: to });
    return true;
  },
  _bump: function(dir){
    Track.bump = 0.16; Track.bumpDir = dir;
    if (typeof m1Sfx === 'function') m1Sfx('uiClick');
    Bus.emit('cw:bump', { dir: dir });
  },
  /* 前进速度：能量 ≥0.85 的段落自动冲刺（P2 接入 Chart.mood.energy；P1 固定基础速） */
  speed: function(){
    if (!Track.isCw(cur)) return CFG.SPEED_F;
    return (Track.energy >= CW.SPRINT_AT) ? CW.SPRINT : CW.BASE;
  },
  energy: 0,                                  /* P2 起由 Chart 写入当前段落能量 */
  update: function(dt, k){
    if (dt <= 0 || !Track.isCw(k)) return;
    /* 音乐时钟：优先取 BGM 播放位置（与谱面同源采样 ⇒ 逐拍对齐）；
       无音频时（未解码 / 无手势 / 静音环境）退化为"由已行进距离反解" ⇒ 谱面照常推进。 */
    if (BGM.playing) Track.songT = BGM.songT();
    else {
      var S2 = SCN[k];
      var d2 = (S2 && S2.hero) ? Math.max(0, CW.Z_START - S2.hero.position.z) : 0;
      Track.songT = Chart.ready ? Track.tAtDist(d2) : 0;
    }
    var sec = Chart.ready ? Chart.sectionAt(Track.songT) : null;
    if (sec){ Track.energy = sec.energy; Track.section = sec; }
    if (Track.bufT > 0){ Track.bufT = Math.max(0, Track.bufT - dt); if (Track.bufT === 0) Track.buf = 0; }
    if (Track.bump > 0) Track.bump = Math.max(0, Track.bump - dt);
    if (Track.t < 1){
      Track.t = Math.min(1, Track.t + dt / (CW.SWITCH_MS / 1000));
      var e = 1 - Math.pow(1 - Track.t, 3);                     /* easeOutCubic */
      Track.layerY = Track.fromY + (Track.toY - Track.fromY) * e;
      Track.pitch = ((Track.toY > Track.fromY) ? 1 : -1) * CW.PITCH_MAX * (1 - e);  /* 升抬头 / 降俯冲 */
      if (Track.t >= 1){
        Track.layerY = Track.toY; Track.layer = Track.target; Track.pitch = 0;
        if (Track.buf){ var d = Track.buf; Track.buf = 0; Track.bufT = 0; Track.request(d, k); }
      }
    } else { Track.pitch = 0; }
    Track.roll = (Track.bump > 0) ? Track.bumpDir * CW.BUMP_DEG * (Track.bump / 0.16) : 0;
  },
  info: function(){ return { layer: Track.layer, target: Track.target, layerY: +Track.layerY.toFixed(3),
    t: +Track.t.toFixed(3), pitch: +Track.pitch.toFixed(2), roll: +Track.roll.toFixed(2),
    songT: +Track.songT.toFixed(3), energy: +Track.energy.toFixed(2) }; }
};

/* ---- 轻量事件总线（GDD §6.5）---- */
var Bus = (function(){
  var m = {};
  return {
    on: function(ev, fn){ (m[ev] = m[ev] || []).push(fn); },
    emit: function(ev, d){ var a = m[ev]; if (a) for (var i = 0; i < a.length; i++){ try { a[i](d); } catch(e){} } }
  };
})();

/* ---- 局内状态（GDD §6.2，可序列化）---- */
var GameState = {
  level: 'desert', counters: {}, portal: 'dormant',
  reset: function(k){
    GameState.level = k;
    GameState.counters = {};
    var lv = LEVELS[k];
    if (lv) for (var i = 0; i < lv.tasks.length; i++) GameState.counters[lv.tasks[i].id] = 0;
    GameState.portal = 'dormant';
  },
  add: function(id, n){
    GameState.counters[id] = (GameState.counters[id] || 0) + (n == null ? 1 : n);
    Bus.emit('progress', { id: id, value: GameState.counters[id] });
    return GameState.counters[id];
  },
  get: function(id){ return GameState.counters[id] || 0; },
  taskDone: function(t){ return GameState.get(t.id) >= t.need; }
};

/* ---- 输入抽象（GDD §5.1 / §6.8）——键盘在既有 keydown 处接线 ---- */
var Input = {
  enabled: true, keys: {}, move: { x: 0, z: 0 },   /* M3-OP：虚拟摇杆已移除，stick 字段删除 */
  sprint: false, btn: { sprint: false },
  poll: function(){
    var k = Input.keys, mx = 0, mz = 0;
    if (Input.enabled){
      if (k['KeyW']) mz -= 1;
      if (k['KeyS']) mz += 1;
      if (k['KeyA']) mx -= 1;
      if (k['KeyD']) mx += 1;
    }
    var l = Math.sqrt(mx*mx + mz*mz);
    if (l > 1){ mx /= l; mz /= l; }
    Input.move.x = mx; Input.move.z = mz;
    Input.sprint = !!(k['ShiftLeft'] || k['ShiftRight'] || Input.btn.sprint);
  }
};

/* ---- 节拍时钟（GDD §3.2 / §6.6）——音频在跑时锁到 kick，否则自由拍 ---- */
var BeatClock = {
  bpm: 118, phase: 0, index: 0,
  setSong: function(s){ if (!s) return; BeatClock.bpm = s.bpm; bpm = s.bpm; BeatClock.phase = 0; },
  update: function(dt){
    var bp = 60 / BeatClock.bpm;
    /* M3-CW：单赛道关以 BGM 播放位置为主时钟（其 kick/hat 调度已停播 ⇒ 不能再用 nextBeat 推导） */
    if (LEVELS[cur] && LEVELS[cur].mode === 'single-track' && BGM.playing){
      var sp = BGM.songT();
      BeatClock.phase = (((sp % bp) + bp) % bp) / bp;
      BeatClock.index = Math.floor(sp / bp);
      return;
    }
    if (actx && actx.state === 'running'){
      var since = bp - (nextBeat - actx.currentTime);
      BeatClock.phase = (((since % bp) + bp) % bp) / bp;
    } else if (dt > 0){
      BeatClock.phase += dt / bp;
      while (BeatClock.phase >= 1) BeatClock.phase -= 1;
    }
  },
  onKick: function(){ BeatClock.index++; Bus.emit('beat', { index: BeatClock.index, strong: true }); },
  inWindow: function(){ var p = BeatClock.phase; return p <= CFG.W_BEAT || p >= 1 - CFG.W_BEAT; },
  tap: function(){ Bus.emit('beatTap', {}); }
};

/* ---- 局内 SFX（GDD §6.6，汇入既有 master，不随 bpm 变速）---- */
function m1Sfx(kind){
  if (!actx) return;
  var t = actx.currentTime;
  try {
    function tone(type, f0, f1, dur, vol){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    }
    if (kind === 'collect'){
      for (var i = 0; i < 3; i++){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(523.25 * Math.pow(2, i*4/12), t + i*0.06);
        g.gain.setValueAtTime(0.0001, t + i*0.06);
        g.gain.exponentialRampToValueAtTime(0.45, t + i*0.06 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 0.22);
        o.connect(g); g.connect(master); o.start(t + i*0.06); o.stop(t + i*0.06 + 0.24);
      }
    }
    else if (kind === 'beatPerfect') tone('square', 1760, 1760, 0.08, 0.32);
    else if (kind === 'jump')        tone('sine', 320, 620, 0.12, 0.20);
    else if (kind === 'land')        tone('sine', 160, 70, 0.14, 0.24);
    else if (kind === 'portalGo')    tone('sawtooth', 220, 1320, 0.55, 0.26);
    else if (kind === 'uiClick')     tone('triangle', 880, 880, 0.06, 0.16);
    /* M3-CW ·《超频长阶》判定音（与 BGM 并行、走 SFX 总线，故音量压低避免盖住音乐） */
    else if (kind === 'cwHit')       tone('square',   1320, 1320, 0.07, 0.22);
    else if (kind === 'cwGood')      tone('triangle',  988,  988, 0.07, 0.18);
    else if (kind === 'cwOrb')       tone('triangle', 1568, 2093, 0.10, 0.20);
    else if (kind === 'cwMiss')      tone('sawtooth',  190,   95, 0.16, 0.20);
  } catch(e){}
}

/* ==========================================================================
   M3-CW ·《超频长阶》运行时支撑：BGM 播放 / 真值谱面 / 单赛道输入
   --------------------------------------------------------------------------
   设计约束：
     · BGM 走独立音乐总线（不并入 SFX master），避免与既有 kick/hat 互相影响；
     · **不在无用户手势时创建 AudioContext**（规避自动播放告警）：进关仅置 want + 预取，
       首次手势触发 initAudio 后再解码并起播；
     · 起播时按"已行进距离"反解 songT 做锚定 ⇒ 无论何时开声，音乐都与角色位置对齐；
     · Chart 与 WAV 同源生成（tools/gen_causeway.js）⇒ 无需运行时音频分析。
   ========================================================================== */
var musicBus = null, bgmSrc = null, bgmBuf = null, bgmAB = null, bgmT0 = 0;
function initMusicBus(){
  if (musicBus || !actx) return;
  musicBus = actx.createGain(); musicBus.gain.value = 0.60; musicBus.connect(actx.destination);
}
function loadBGM(){
  if (bgmBuf || bgmAB || loadBGM._l) return;
  loadBGM._l = true;
  try {
    fetch('assets/causeway.wav')
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ bgmAB = ab; bgmDecode(); })
      .catch(function(){ loadBGM._l = false; });
  } catch(e){ loadBGM._l = false; }
}
/* 待 actx 就绪后再解码（decodeAudioData 必须挂在 AudioContext 上） */
function bgmDecode(){
  if (bgmBuf || !bgmAB || !actx) return;
  var ab = bgmAB;
  try {
    actx.decodeAudioData(ab).then(function(buf){
      bgmBuf = buf; Bus.emit('bgm:ready', {});
      if (BGM.want && !BGM.playing) BGM.start();
    }).catch(function(){ bgmAB = null; loadBGM._l = false; });
  } catch(e){ bgmAB = null; loadBGM._l = false; }
}
var BGM = {
  want: false, playing: false,
  start: function(){
    BGM.want = true;
    if (!actx){ loadBGM(); return; }             /* 尚无声手势 → 仅预取，待 initAudio 续播 */
    initMusicBus();
    if (!bgmBuf){ loadBGM(); bgmDecode(); return; }
    if (BGM.playing) return;
    try {
      if (bgmSrc){ try{ bgmSrc.stop(); }catch(e){} try{ bgmSrc.disconnect(); }catch(e){} }
      bgmSrc = actx.createBufferSource(); bgmSrc.buffer = bgmBuf; bgmSrc.connect(musicBus);
      /* 起播锚定：令 songT 与"已行进距离"一致，消除手势延迟造成的时间错位 */
      var S = SCN[cur];
      var dist = (S && S.hero) ? Math.max(0, CW.Z_START - S.hero.position.z) : 0;
      var at = Track.tAtDist(dist);
      bgmT0 = actx.currentTime - at;
      bgmSrc.start(0);
      BGM.playing = true;
      Bus.emit('bgm:play', { at: +at.toFixed(3) });
    } catch(e){ BGM.playing = false; }
  },
  stop: function(){
    BGM.want = false;
    if (bgmSrc){ try{ bgmSrc.stop(); }catch(e){} try{ bgmSrc.disconnect(); }catch(e){} bgmSrc = null; }
    BGM.playing = false;
  },
  songT: function(){ return (BGM.playing && actx) ? Math.max(0, actx.currentTime - bgmT0) : 0; }
};

/* ---- M3-CW · 真值谱面（与 WAV 同源；P3 起驱动障碍/判定，P2 仅取段落能量驱动冲刺）---- */
var Chart = {
  data: null, ready: false, _l: false,
  load: function(){
    if (Chart.ready || Chart._l) return;
    Chart._l = true;
    try {
      fetch('assets/causeway-chart.json')
        .then(function(r){ return r.json(); })
        .then(function(j){ Chart.data = j; Chart.ready = true; Bus.emit('chart:ready', {}); })
        .catch(function(){ Chart._l = false; });
    } catch(e){ Chart._l = false; }
  },
  sectionAt: function(t){
    var ss = Chart.data ? Chart.data.sections : null; if (!ss) return null;
    for (var i = 0; i < ss.length; i++) if (t >= ss[i].t0 && t < ss[i].t1) return ss[i];
    return ss.length ? ss[ss.length - 1] : null;
  }
};

/* ---- M3-CW · 单赛道输入（升 / 降 / 同调长按）----------------------------------
   键盘：↑/W 升、↓/S 降、长按 空格 同调（在全局 keydown/keyup 处分流）。
   触摸：上半屏轻点=升 / 下半屏轻点=降 / 长按任意处=同调（轻点与长按由 HOLD_MS 区分）。
   兜底：HUD 常驻「同调」圆钮（按下 = begin，松手 = end）。
   仅 causeway 生效 —— 其余关仍走 Lane 换道，互不干扰。 */
var btnRes = null;
var CWInput = {
  HOLD_MS: 220, _down: false, _timer: null, resonating: false,
  _audio: function(){ initAudio(); if (actx && actx.state === 'suspended') actx.resume(); },
  lift: function(){ CWInput._audio(); Track.request(+1, cur); },
  dive: function(){ CWInput._audio(); Track.request(-1, cur); },
  press: function(){
    CWInput._audio();
    CWInput._down = true;
    if (CWInput._timer) clearTimeout(CWInput._timer);
    CWInput._timer = setTimeout(function(){
      CWInput._timer = null; CWInput._down = false; CWInput.begin();
    }, CWInput.HOLD_MS);
  },
  /* halfDir：+1 上半屏 / −1 下半屏 */
  release: function(halfDir){
    if (CWInput._timer){ clearTimeout(CWInput._timer); CWInput._timer = null; }
    if (CWInput._down){ CWInput._down = false; if (halfDir > 0) CWInput.lift(); else CWInput.dive(); }
    else if (CWInput.resonating){ CWInput.end(); }
  },
  cancel: function(){
    if (CWInput._timer){ clearTimeout(CWInput._timer); CWInput._timer = null; }
    CWInput._down = false; CWInput.end();
  },
  begin: function(){
    CWInput._audio();
    if (CWInput.resonating) return;
    CWInput.resonating = true;
    if (btnRes) btnRes.classList.add('on');
    Bus.emit('cw:resonate', { on: true });
  },
  end: function(){
    if (!CWInput.resonating) return;
    CWInput.resonating = false;
    if (btnRes) btnRes.classList.remove('on');
    Bus.emit('cw:resonate', { on: false });
  },
  reset: function(){ CWInput.cancel(); }
};

/* ==========================================================================
   M3-CW · 判定 / 计分（Judge + CWScore）
   --------------------------------------------------------------------------
   判定模型（对齐 docs/声浪星球-关卡设计-超频长阶.md §6 / §7）：
     · 障碍按其谱面时刻 t 迎面掠过角色平面；**掠过瞬间**比较 Track 的有效层与障碍答案；
     · 答案在闸门前 ≤160 ms 内完成切换 ⇒ 按切换新鲜度给 Perfect/Good；更早站好位 ⇒ 直接 Perfect；
     · 站错层 ⇒ Miss（连击归零）；脉冲球漏掉不扣连击；误导体永不判定（只留痕）。
     · 承"只奖励理解、不惩罚失手"：预判/同调均只加成、不失分。
   ========================================================================== */
var Judge = {
  P: 0.080, G: 0.160,
  rate: function(dt){ var a = Math.abs(dt); return a <= Judge.P ? 'perfect' : (a <= Judge.G ? 'good' : 'miss'); },
  cross: function(o){
    var st = Track.songT, eff = Track.effLayer();
    /* ① 误导体：从不判定；仅在"被它骗到"（近期切换过）时留痕，不扣分 */
    if (o.answer === 'ignore'){
      if (st - Track.lastSwitchT <= 0.28) CWScore.decoy++;
      o.grade = 'none'; return;
    }
    /* ② 双闸门：**不操作**才是正解 —— 静默窗口内未切换层 ⇒ Perfect，切换过 ⇒ Miss */
    if (o.answer === 'hold'){
      var quiet = (st - Track.lastSwitchT) > Obstacle.JUDGE_HOLD;
      Judge._apply(o, quiet ? 'perfect' : 'miss'); return;
    }
    /* ③ 脉冲球：同层穿过即得（漏掉仅不计，不破连击） */
    if (o.type === 'orb'){
      if (eff === o.layer){ CWScore.orbs++; Judge._apply(o, 'perfect', 50); }
      else { CWScore.orbMiss++; o.grade = 'none'; }
      return;
    }
    /* ④ 闸门 / 连环柱：必须处于 answer 层 */
    if (eff === o.answer){
      var fresh = st - Track.lastSwitchT;
      Judge._apply(o, (fresh <= Judge.G) ? Judge.rate(fresh) : 'perfect');
    } else Judge._apply(o, 'miss');
  },
  _apply: function(o, grade, base){
    o.grade = grade;
    o.fxT = 0.34;                                   /* 命中/失误的缩放脉冲 */
    if (grade === 'miss') m1Sfx('cwMiss');
    else if (o.type === 'orb') m1Sfx('cwOrb');
    else m1Sfx(grade === 'perfect' ? 'cwHit' : 'cwGood');
    CWScore.hit(grade, base);
  }
};

var CWScore = {
  perfect: 0, good: 0, miss: 0, combo: 0, maxCombo: 0, score: 0,
  orbs: 0, orbMiss: 0, decoy: 0,
  mult: 1,        /* P4 同调倍率（1.0 + 0.5 × 同调达成率） */
  amo: 1,         /* P4 预判倍率（押对 ×1.5 / 其余 ×1.0） —— 本段内有效 */
  reset: function(){
    CWScore.perfect = CWScore.good = CWScore.miss = 0;
    CWScore.combo = CWScore.maxCombo = CWScore.score = 0;
    CWScore.orbs = CWScore.orbMiss = CWScore.decoy = 0;
    CWScore.mult = 1; CWScore.amo = 1;
  },
  comboMult: function(){ return 1 + Math.min(CWScore.combo, 50) / 50 * 0.5; },
  hit: function(grade, base){
    if (grade === 'miss'){ CWScore.miss++; CWScore.combo = 0; }
    else {
      if (grade === 'perfect') CWScore.perfect++; else CWScore.good++;
      CWScore.combo++;
      if (CWScore.combo > CWScore.maxCombo) CWScore.maxCombo = CWScore.combo;
      var b = (base == null) ? (grade === 'perfect' ? 100 : 60) : base;
      CWScore.score += Math.round(b * CWScore.comboMult() * CWScore.mult * CWScore.amo);
    }
    RhythmHUD.flash(grade);
  },
  accuracy: function(){
    var tot = CWScore.perfect + CWScore.good + CWScore.miss;
    return tot ? ((CWScore.perfect + CWScore.good * 0.6) / tot) : 1;
  },
  rank: function(){
    var a = CWScore.accuracy();
    return a >= 0.95 ? 'S' : a >= 0.85 ? 'A' : a >= 0.70 ? 'B' : 'C';
  },
  judged: function(){ return CWScore.perfect + CWScore.good + CWScore.miss; }
};

/* ==========================================================================
   M3-CW · P4 音乐理解机制（CWAnt 预判窗口 + CWReso 同调长按）
   --------------------------------------------------------------------------
   对齐 docs/声浪星球-关卡设计-超频长阶.md §6 / §7.4：
     · CWAnt  §6.1：段落交界**前 2 拍**开窗，HUD 出走向符号（谱面 melody.slope 预判的 ↑/↓/~）；
       窗口内「长按同调」即完成**押注** ⇒ 交界结算，下一段倍率 amo = ×1.5（押对）/ ×1.0（押错·不押）。
       **只奖励理解、不惩罚失手** —— 押错与不押等价，绝不扣分、不断连击。
     · CWReso §6.2：旋律**持续音**（chart.sustains）按住「同调」，于长音结束拍点 ±80 / ±160 ms 松手
       ⇒ Perfect / Good；未按或错拍 ⇒ Miss（同样只影响乘区，不扣分）。
   两个乘区均并入 CWScore.hit 的结算式：分 = base × 连击倍率 × mult × amo（§7.4）。
   ▸ 随机流纪律：本模块零 rnd()（仅读谱面真值 + 累加）⇒ 不扰动既有关卡随机序列。
   ▸ FREEZE 下不调用（主循环 !FREEZE 块）⇒ 定帧基线不受影响。
   ========================================================================== */
var CWAnt = {
  list: null, idx: 0, open: false, bet: false, ok: null, cur: null, _shown: false, _sym: '',
  reset: function(t){
    if (RhythmHUD._q && RhythmHUD._q.ant && CWAnt._shown) RhythmHUD._q.ant.className = 'ant';
    CWAnt.list = null; CWAnt.idx = 0; CWAnt.open = false; CWAnt.bet = false;
    CWAnt.ok = null; CWAnt.cur = null; CWAnt._shown = false; CWAnt._sym = '';
    CWScore.amo = 1;
    if (t != null) CWAnt._seek(t);
  },
  _list: function(){
    if (!CWAnt.list && Chart.data) CWAnt.list = Chart.data.anticipations || [];
    return CWAnt.list || [];
  },
  /* seek：把游标推进到"下一个尚未结算的窗口"（用于门禁 / 时间跳转） */
  _seek: function(t){
    var L = CWAnt._list(); CWAnt.idx = 0;
    for (var i = 0; i < L.length; i++){ if (L[i].at + L[i].win <= t) CWAnt.idx = i + 1; }
  },
  dirSym: function(d){ return d === 'up' ? '↑' : (d === 'down' ? '↓' : '~'); },
  update: function(dt){
    var L = CWAnt._list(); if (!L.length) return;
    var t = Track.songT;
    /* ① 结算：已越过交界线的窗口 ⇒ 定 amo（押对 ×1.5 / 其余 ×1.0） */
    if (CWAnt.open && CWAnt.cur && t >= CWAnt.cur.at + CWAnt.cur.win){
      CWAnt.ok = CWAnt.bet;
      CWScore.amo = CWAnt.ok ? 1.5 : 1.0;
      if (CWAnt.ok) m1Sfx('cwGood');
      Bus.emit('cw:ant', { dir: CWAnt.cur.dir, ok: CWAnt.ok });
      CWAnt.idx++; CWAnt.open = false; CWAnt.cur = null; CWAnt.bet = false;
    }
    /* ② 开窗：段落交界前 2 拍 */
    var a = L[CWAnt.idx];
    if (!CWAnt.open && a && t >= a.at && t < a.at + a.win){
      CWAnt.open = true; CWAnt.bet = false; CWAnt.cur = a;
    }
    /* ③ 押注：窗口内出现「同调长按」即 latch（§6.1 玩家操作 = 长按同调完成押注） */
    if (CWAnt.open && !CWAnt.bet && CWInput.resonating) CWAnt.bet = true;
    /* ④ HUD（走向符号 + 窗口进度条 + 押注已生效高亮） */
    var q = RhythmHUD._q; if (!q || !q.ant) return;
    if (CWAnt.open && CWAnt.cur){
      if (!CWAnt._shown){ q.ant.className = 'ant on'; CWAnt._shown = true; }
      var sym = CWAnt.dirSym(CWAnt.cur.dir);
      if (CWAnt._sym !== sym){ q.antSym.textContent = sym; CWAnt._sym = sym; }
      q.antBar.style.width = (clamp((t - CWAnt.cur.at) / CWAnt.cur.win, 0, 1) * 100).toFixed(0) + '%';
      if (CWAnt.bet) q.ant.classList.add('ok'); else q.ant.classList.remove('ok');
    } else if (CWAnt._shown){
      q.ant.className = 'ant'; CWAnt._shown = false; CWAnt._sym = '';
    }
  },
  info: function(){ return { open: CWAnt.open, bet: CWAnt.bet, ok: CWAnt.ok,
    dir: CWAnt.cur ? CWAnt.cur.dir : null, idx: CWAnt.idx, amo: CWScore.amo }; }
};

var CWReso = {
  list: null, done: null, total: 0, perfect: 0, good: 0, miss: 0, _auto: null,
  reset: function(t){
    CWReso.list = null; CWReso.done = null; CWReso.total = 0;
    CWReso.perfect = CWReso.good = CWReso.miss = 0; CWReso._auto = null;
    CWScore.mult = 1;
    if (t != null) CWReso._seek(t);
  },
  _list: function(){
    if (!CWReso.list && Chart.data) CWReso.list = Chart.data.sustains || [];
    return CWReso.list || [];
  },
  /* seek：t 之前已过窗的长音标记 'skip'（跳过的时点不是玩家的责任 ⇒ 不计入分母） */
  _seek: function(t){
    var L = CWReso._list();
    CWReso.done = L.map(function(s){ return (s.t1 + Judge.G < t) ? 'skip' : null; });
    CWReso._recount();
  },
  /* 松手：落点 ±Good 窗内的未决长音一并判定（数据里 4 对长音仅差 38 ms ⇒ 共享同一次"呼吸"） */
  release: function(tr){
    var L = CWReso._list(); if (!L.length) return false;
    if (!CWReso.done || CWReso.done.length !== L.length)
      CWReso.done = L.map(function(s){ return (s.t1 + Judge.G < Track.songT) ? 'skip' : null; });
    var hit = false;
    for (var i = 0; i < L.length; i++){
      if (CWReso.done[i] !== null) continue;
      var d = tr - L[i].t1, a = Math.abs(d);
      if (a <= Judge.P){ CWReso.done[i] = 'perfect'; hit = true; }
      else if (a <= Judge.G){ CWReso.done[i] = 'good'; hit = true; }
    }
    if (hit){ CWReso._recount(); m1Sfx('cwGood'); }
    return hit;
  },
  update: function(dt){
    var L = CWReso._list(); if (!L.length) return;
    if (!CWReso.done || CWReso.done.length !== L.length)
      CWReso.done = L.map(function(){ return null; });
    var t = Track.songT;
    /* 自动松手（门禁 / 调试）：到点走与真人一致的 CWInput.end 通道 */
    if (CWReso._auto != null && t >= CWReso._auto){ CWReso._auto = null; CWInput.end(); return; }
    /* 越过 Good 窗仍未松手 ⇒ Miss（只是"没有加成"，不扣分、不断连击） */
    var changed = false;
    for (var i = 0; i < L.length; i++){
      if (CWReso.done[i] === null && t > L[i].t1 + Judge.G){ CWReso.done[i] = 'miss'; changed = true; }
    }
    if (changed) CWReso._recount();
  },
  _recount: function(){
    var d = CWReso.done || [], p = 0, g = 0, m = 0, n = 0;
    for (var i = 0; i < d.length; i++){
      if (d[i] === 'skip') continue;
      n++;
      if (d[i] === 'perfect') p++; else if (d[i] === 'good') g++; else if (d[i] === 'miss') m++;
    }
    CWReso.perfect = p; CWReso.good = g; CWReso.miss = m; CWReso.total = n;
    CWScore.mult = 1 + 0.5 * (n ? p / n : 0);          /* §7.4：同调倍率 = 1.0 + 0.5 × (Perfect / 总数) */
  },
  autoRelease: function(t){ CWReso._auto = t; },
  info: function(){ return { perfect: CWReso.perfect, good: CWReso.good, miss: CWReso.miss,
    total: CWReso.total, mult: +CWScore.mult.toFixed(3), held: CWInput.resonating }; }
};
Bus.on('cw:resonate', function(e){ if (e && e.on === false && Track.isCw(cur)) CWReso.release(Track.songT); });

/* ==========================================================================
   M3-CW · 障碍系统（Obstacle）—— 谱面 → 世界物体 → 掠过判定
   --------------------------------------------------------------------------
   障碍按谱面 z 静态落位（z = CW.Z_START − distAt(t) = Track.zOf(t)），角色沿 −z 迎面逼近。
   实体用「按 type:layer 分池 + 通过后回收」管理：同时存活数由 (LOOKAHEAD + RECYCLE) 窗口界定
   （谱面最小间隔恰为 1 拍 0.380 s ⇒ 窗口内至多 ~10 个），故常驻 draw call 极低。
   6 类视觉语义（docs/声浪星球-关卡设计-超频长阶.md §4）：
     · gate   闸门：横梁占据「layer 所指那一层」的通行空间 ⇒ 必须切到 answer 层
     · pillar 连环柱：柱体 + 横梁（判定同 gate，成串出现）
     · twin   双闸门：上下夹击留缝 ⇒ **不操作**才是正解
     · orb    脉冲球：落在谱面音符上，**同层穿过**即得
     · decoy  误导体：半透明幽灵闸门，**必须无视**
   几何对应：Lo 地面 y=0、Hi 地面 y=0.9（CW.LAYER_HI）；
     layer='lo' 的梁贴地 0→0.78（Hi 层角色从上方越过）；layer='hi' 的梁悬空 1.58→2.34（Lo 层角色从下方钻过）。
   ========================================================================== */
var Obstacle = {
  LOOKAHEAD: 2.6,      /* 提前生成的音乐时间窗 (s)：15 u/s ⇒ 约 39 m 视距 */
  RECYCLE: 1.1,        /* 掠过判定后延迟回收 (s)，留出脉冲反馈时间 */
  JUDGE_HOLD: 0.25,    /* twin「不操作」的静默窗口 (s) */
  root: null, pools: null, free: null, live: null, nextIdx: 0, mounted: false,
  LO_BAND: [0.00, 0.78], HI_BAND: [1.58, 2.34],      /* 梁的垂直占据带 */

  mount: function(){
    if (Obstacle.mounted || FREEZE) return;           /* FREEZE 下不挂载 ⇒ 定帧 children 数不变 */
    var S = SCN.causeway; if (!S || !S.scene) return;
    Obstacle.root = new THREE.Group(); Obstacle.root.name = 'cwObstacles';
    S.scene.add(Obstacle.root);
    Obstacle.pools = {}; Obstacle.free = {}; Obstacle.live = [];
    Obstacle.mounted = true;
    /* 预热：9 种 type:layer 各建 1 个置于相机之后，编译一次着色器再移除。
       three 的 program 缓存按材质参数（而非材质实例）复用 ⇒ 后续 make() 新建材质直接命中，
       从而消除"首个障碍生成瞬间"的着色器编译卡顿。不留下常驻对象、不影响 draw call。 */
    var kinds = [['gate','lo'],['gate','hi'],['orb','lo'],['orb','hi'],['twin','both'],
                 ['pillar','lo'],['pillar','hi'],['decoy','lo'],['decoy','hi']];
    var warm = [], zBack = (S.hero ? S.hero.position.z : 0) + 80;
    for (var i = 0; i < kinds.length; i++){
      var o = Obstacle._alloc(kinds[i][0], kinds[i][1]);
      o.mesh.position.set(0, 0, zBack); o.mesh.visible = true;
      warm.push(o);
    }
    if (S.camera) renderer.compile(S.scene, S.camera);
    for (var j = 0; j < warm.length; j++) Obstacle._retire(warm[j], true);
  },
  /* ---- 视觉构件 ---- */
  /* 通用横梁：高自发光主体 + 近白能量芯 + 上下近白描边 ⇒ 梁体明显比赛道粉边更亮、轮廓清晰 */
  _beam: function(g, layer, color, op, core){
    var b = (layer === 'hi') ? Obstacle.HI_BAND : Obstacle.LO_BAND;
    var h = b[1] - b[0], yc = (b[0] + b[1]) / 2, W = CW.W;
    add(g, new THREE.BoxGeometry(W, h, 0.30),
      M(color, { emissive: shade(color, 0.9), ei: 1.15, transparent: true, opacity: op == null ? 0.95 : op, fog: false }),
      0, yc, 0, { cast: false, recv: false });
    add(g, new THREE.BoxGeometry(W - 0.12, h * 0.26, 0.34),
      basic(core == null ? 0xFFFFFF : core, { transparent: true, opacity: 0.70, additive: true, fog: false, depthWrite: false }),
      0, yc, 0, { cast: false, recv: false });
    var edge = basic(0xFFFFFF, { transparent: true, opacity: 0.90, fog: false, depthWrite: false });
    add(g, new THREE.BoxGeometry(W + 0.06, 0.06, 0.34), edge, 0, b[1] - 0.01, 0, { cast: false, recv: false });
    add(g, new THREE.BoxGeometry(W + 0.06, 0.06, 0.34), edge, 0, b[0] + 0.01, 0, { cast: false, recv: false });
  },
  make: function(type, layer){
    var g = new THREE.Group(), W = CW.W, hi = CW.LAYER_HI;
    var C_GATE = 0xFF5A8A, C_PIL = 0xFFA62B, C_ORB = CW.ACC, C_DECOY = 0xA78BEA;
    if (type === 'gate'){ Obstacle._beam(g, layer, C_GATE); }
    else if (type === 'pillar'){
      Obstacle._beam(g, layer, C_PIL, null, 0xFFE6B0);          /* 暖芯：保持琥珀身份，不与 gate 的冷白混淆 */
      /* 双侧柱：高自发光 + 顶端亮帽，强化「连环柱」的琥珀暖色，与 gate 的冷粉拉开对比 */
      var colMat = M(C_PIL, { emissive: shade(C_PIL, 0.85), ei: 1.0, transparent: true, opacity: 0.95, fog: false });
      var capMat = basic(0xFFFFFF, { transparent: true, opacity: 0.88, additive: true, fog: false, depthWrite: false });
      add(g, new THREE.BoxGeometry(0.22, 2.5, 0.22), colMat, -W / 2 + 0.16, 1.25, 0, { cast: false, recv: false });
      add(g, new THREE.BoxGeometry(0.22, 2.5, 0.22), colMat,  W / 2 - 0.16, 1.25, 0, { cast: false, recv: false });
      add(g, new THREE.BoxGeometry(0.30, 0.10, 0.30), capMat, -W / 2 + 0.16, 2.52, 0, { cast: false, recv: false });
      add(g, new THREE.BoxGeometry(0.30, 0.10, 0.30), capMat,  W / 2 - 0.16, 2.52, 0, { cast: false, recv: false });
    }
    else if (type === 'twin'){
      Obstacle._beam(g, 'lo', C_GATE);
      Obstacle._beam(g, 'hi', C_GATE);
      /* 中缝：先铺一条近黑暗带（"这里是个洞"），再叠中央导引光带（明示保持层、穿缝而过） */
      var gTp = Obstacle.HI_BAND[0], gBt = Obstacle.LO_BAND[1], gcn = (gTp + gBt) / 2;
      add(g, new THREE.BoxGeometry(W, gTp - gBt, 0.16),
        basic(0x0A0418, { transparent: true, opacity: 0.72, fog: false, depthWrite: false }),
        0, gcn, 0, { cast: false, recv: false });
      var slot = add(g, new THREE.BoxGeometry(W - 0.5, (gTp - gBt) * 0.5, 0.08),
        basic(C_ORB, { transparent: true, opacity: 0.30, additive: true, fog: false, depthWrite: false }),
        0, gcn, 0, { cast: false, recv: false });
      g.userData.slot = slot;
    }
    else if (type === 'orb'){
      var y = (layer === 'hi' ? hi : 0) + 0.95;
      var s = add(g, new THREE.SphereGeometry(0.34, 14, 10),
        M(C_ORB, { emissive: shade(C_ORB, 0.7), ei: 1.2, transparent: true, opacity: 0.95, fog: false }),
        0, y, 0, { cast: false, recv: false });
      add(g, new THREE.TorusGeometry(0.55, 0.055, 8, 24),
        basic(C_ORB, { transparent: true, opacity: 0.5, additive: true, fog: false, depthWrite: false }),
        0, y, 0, { cast: false, recv: false, rot: [Math.PI / 2, 0, 0] });
      var ring2 = add(g, new THREE.TorusGeometry(0.80, 0.028, 8, 24),
        basic(C_ORB, { transparent: true, opacity: 0.34, additive: true, fog: false, depthWrite: false }),
        0, y, 0, { cast: false, recv: false, rot: [Math.PI / 2, 0, 0] });
      g.userData.orb = s; g.userData.orbY = y; g.userData.ring2 = ring2;
    }
    else if (type === 'decoy'){
      /* 幽灵闸门：结构与 gate 相同（形似障碍），但用「全息扫描线」材质 —— 可见但明显非实体、可穿 */
      var bb = (layer === 'hi') ? Obstacle.HI_BAND : Obstacle.LO_BAND;
      var bh = bb[1] - bb[0], byc = (bb[0] + bb[1]) / 2;
      add(g, new THREE.BoxGeometry(W, bh, 0.26),
        M(C_DECOY, { emissive: shade(C_DECOY, 0.55), ei: 0.6, transparent: true, opacity: 0.20, fog: false }),
        0, byc, 0, { cast: false, recv: false });
      var sc = basic(0xE0D2FF, { transparent: true, opacity: 0.50, additive: true, fog: false, depthWrite: false });
      for (var sI = 0; sI < 5; sI++){
        add(g, new THREE.BoxGeometry(W - 0.25, 0.05, 0.32), sc,
          0, bb[0] + bh * (0.10 + 0.20 * sI), 0, { cast: false, recv: false });
      }
      g.userData.holo = true;
    }
    return g;
  },
  _alloc: function(type, layer){
    var key = type + ':' + layer;
    var f = Obstacle.free[key];
    if (f && f.length){ var o = f.pop(); o.mesh.visible = true; o.mesh.scale.setScalar(1); return o; }
    var g = Obstacle.make(type, layer);
    Obstacle.root.add(g);
    return { mesh: g, type: type, layer: layer };
  },
  _retire: function(o, hard){
    o.mesh.visible = false; o.mesh.scale.setScalar(1);
    if (o.type === 'orb' && o.mesh.userData.orb) o.mesh.userData.orb.visible = true;
    if (hard) { Obstacle.root.remove(o.mesh); return; }
    var key = o.type + ':' + o.layer;
    (Obstacle.free[key] = Obstacle.free[key] || []).push(o);
  },
  /* 时间跳转（调试 / 门禁用）：把游标推到窗口起点并清空存活集 */
  seek: function(t){
    var list = Chart.data ? Chart.data.obstacles : null;
    Obstacle.reset();
    if (!list) return;
    Obstacle.nextIdx = 0;
    while (Obstacle.nextIdx < list.length && list[Obstacle.nextIdx].t < t - 0.04) Obstacle.nextIdx++;
  },
  reset: function(){
    if (!Obstacle.live) return;
    for (var i = 0; i < Obstacle.live.length; i++) Obstacle._retire(Obstacle.live[i], false);
    Obstacle.live.length = 0; Obstacle.nextIdx = 0;
  },
  update: function(dt, k, S){
    if (!Obstacle.mounted || !Track.isCw(k)) return;
    var ch = Chart.data; if (!ch) return;
    var list = ch.obstacles, st = Track.songT;
    if (!list) return;
    /* ① 生成：谱面时刻进入前视窗即实体化 */
    while (Obstacle.nextIdx < list.length && list[Obstacle.nextIdx].t <= st + Obstacle.LOOKAHEAD){
      var d = list[Obstacle.nextIdx++];
      var o = Obstacle._alloc(d.type, d.layer);
      o.answer = d.answer; o.t = d.t; o.z = d.z; o.judged = false; o.grade = null; o.fxT = 0;
      o.mesh.position.set(0, 0, d.z);
      Obstacle.live.push(o);
    }
    /* ② 掠过判定 + 回收（倒序以便安全 splice） */
    for (var i = Obstacle.live.length - 1; i >= 0; i--){
      var o2 = Obstacle.live[i];
      if (!o2.judged && st >= o2.t){
        o2.judged = true; Judge.cross(o2);
        if (o2.type === 'decoy') o2.fxT = 0.30;    /* 穿幽灵的「无害火花」：仅视觉，不扣分不断连击 */
      }
      if (st > o2.t + Obstacle.RECYCLE){ Obstacle._retire(o2, false); Obstacle.live.splice(i, 1); }
    }
    /* ③ 动画：脉冲球浮动 / 误导体闪烁 / 命中脉冲 / 中缝呼吸 */
    for (var j = 0; j < Obstacle.live.length; j++){
      var o3 = Obstacle.live[j], ud = o3.mesh.userData;
      if (o3.type === 'orb' && ud.orb){
        var ph = o3.t * 2.4;
        ud.orb.position.y = ud.orbY + Math.sin(T * 2.6 + ph) * 0.10;
        ud.orb.rotation.y += dt * 1.6;
        if (ud.ring2){ var pr = 1 + Math.sin(T * 3.4 + ph) * 0.12; ud.ring2.scale.set(pr, pr, pr); }
      }
      if (o3.type === 'decoy'){
        o3.mesh.scale.set(1, 1 + Math.sin(T * 7.0 + o3.t) * 0.02, 1);
      }
      if (o3.fxT > 0){
        o3.fxT = Math.max(0, o3.fxT - dt);
        var kk = o3.fxT / 0.34;
        o3.mesh.scale.setScalar(1 + 0.22 * kk);
      } else if (o3.type !== 'decoy') o3.mesh.scale.setScalar(1);
    }
  }
};

/* ==========================================================================
   M3-CW · 音游 HUD（RhythmHUD）—— 惰性浮层，仅 causeway 显示
   --------------------------------------------------------------------------
   仿 HUD._flash 的惰性策略：首次进入 causeway 才建 DOM；每帧只写文本/类名，零重排。
   显示：进度条 / 分数 / 准确率 / 收集数 / 连击 / 判定浮字 / 当前层指示。
   ========================================================================== */
var RhythmHUD = {
  el: null, _q: null, _t: 0, _orbTotal: 0,
  ensure: function(){
    if (RhythmHUD.el) return RhythmHUD.el;
    var d = document.createElement('div'); d.id = 'cwhud';
    d.innerHTML =
      '<div class="bar"><i></i></div>' +
      '<div class="sc"><b>0</b><s>ACC 100%</s></div>' +
      '<div class="orb">◈ 0 / 0</div>' +
      '<div class="cmb"><b>0</b><s>COMBO</s></div>' +
      '<div class="ly"><b class="lo">LO · 贴地</b><b class="hi">HI · 悬浮</b></div>' +
      '<div class="ant"><b>↑</b><em>预判</em><i><s></s></i></div>' +
      '<div class="mz"></div>' +
      '<div class="lens"></div>' +
      '<div class="jd"></div>';
    document.body.appendChild(d);
    RhythmHUD.el = d;
    RhythmHUD._q = {
      bar: d.querySelector('.bar i'), sc: d.querySelector('.sc b'), acc: d.querySelector('.sc s'),
      orb: d.querySelector('.orb'), cmb: d.querySelector('.cmb b'), jd: d.querySelector('.jd'),
      lo: d.querySelector('.ly .lo'), hi: d.querySelector('.ly .hi'),
      ant: d.querySelector('.ant'), antSym: d.querySelector('.ant b'),
      antBar: d.querySelector('.ant i s'), lens: d.querySelector('.lens'), mz: d.querySelector('.mz')
    };
    RhythmHUD._orbTotal = Chart.data ? Chart.data.obstacles.filter(function(o){ return o.type === 'orb'; }).length : 0;
    return d;
  },
  show: function(on){
    if (!on && !RhythmHUD.el) return;
    RhythmHUD.ensure().classList.toggle('on', !!on);
  },
  flash: function(grade){
    RhythmHUD.ensure();                       /* 注意：ensure() 返回 DOM 元素，模块字段走 RhythmHUD._q */
    var q = RhythmHUD._q;
    q.jd.textContent = grade === 'perfect' ? 'PERFECT' : (grade === 'good' ? 'GOOD' : 'MISS');
    q.jd.className = 'jd ' + grade + ' pop';
    RhythmHUD._t = 0.42;
  },
  update: function(dt){
    var d = RhythmHUD.el; if (!d || d.className.indexOf('on') < 0) return;
    var q = RhythmHUD._q;
    /* 谱面晚于 HUD 就绪时补算脉冲球总数 */
    if (!RhythmHUD._orbTotal && Chart.data)
      RhythmHUD._orbTotal = Chart.data.obstacles.filter(function(o){ return o.type === 'orb'; }).length;
    if (RhythmHUD._t > 0){
      RhythmHUD._t -= dt;
      if (RhythmHUD._t <= 0) q.jd.className = 'jd ' + (q.jd.className.split(' ')[1] || '');
    }
    var dur = Chart.data ? Chart.data.duration : 97.215;
    q.bar.style.width = (clamp(Track.songT / dur, 0, 1) * 100).toFixed(1) + '%';
    q.sc.textContent = String(CWScore.score);
    q.acc.textContent = 'ACC ' + (CWScore.accuracy() * 100).toFixed(1) + '%';
    q.orb.textContent = '◈ ' + CWScore.orbs + ' / ' + RhythmHUD._orbTotal + (CWScore.decoy ? '   〜' + CWScore.decoy : '');
    q.cmb.textContent = String(CWScore.combo);
    var eff = Track.effLayer();
    q.lo.classList.toggle('on', eff === 'lo');
    q.hi.classList.toggle('on', eff === 'hi');
    /* M3-CW·P4：实时倍率（同调 mult × 预判 amo）；仅 >1.0 时占位，避免常规画面被字块干扰 */
    if (q.mz){
      var total = CWScore.mult * CWScore.amo;
      if (total > 1.001){
        if (q.mz.className !== 'mz on') q.mz.className = 'mz on';
        var txt = '×' + total.toFixed(2);
        if (q.mz.textContent !== txt) q.mz.textContent = txt;
      } else if (q.mz.className !== 'mz') q.mz.className = 'mz';
    }
  }
};

/* ---- 地面波纹（落地 / 收集反馈，GDD §5.2）---- */
function groundRipple(){
  var m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.18, 32, 1),
    basic(0xEAFBFF, { transparent: true, opacity: 0, additive: true, side: THREE.DoubleSide, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI/2; m.visible = false;
  return m;
}
var VFX = {
  _i: 0,
  attach: function(S){
    var land = groundRipple(); S.add(land);
    var pool = [];
    for (var i = 0; i < 3; i++){ var r = groundRipple(); S.add(r); pool.push(r); }
    S.userData.vfx = { land: land, pool: pool };   /* per-scene：desert / cave 各持一份 */
  },
  _scene: function(k){ var S = SCN[k]; return (S && S.scene) ? S.scene.userData.vfx : null; },
  _fire: function(mesh, x, y, z, r0, r1, life, op){
    mesh.visible = true; mesh.position.set(x, y, z); mesh.scale.setScalar(r0);
    mesh.material.opacity = op;
    mesh.userData.vf = { t: 0, life: life, r0: r0, r1: r1, op: op };
  },
  land:  function(x, y, z){ var v = VFX._scene(cur); if (v && v.land) VFX._fire(v.land, x, y, z, 0.55, 3.2, 0.5, 0.7); },
  burst: function(x, y, z){
    var v = VFX._scene(cur);
    if (!v || !v.pool.length) return;
    var m = v.pool[VFX._i++ % v.pool.length];
    VFX._fire(m, x, y, z, 0.35, 2.4, 0.42, 0.85);
  },
  update: function(dt, k){
    var v = VFX._scene(k);
    if (!v) return;
    function step(m){
      if (!m || !m.visible) return;
      var vv = m.userData.vf; vv.t += dt;
      var kk = vv.t / vv.life;
      if (kk >= 1){ m.visible = false; m.material.opacity = 0; return; }
      m.scale.setScalar(vv.r0 + (vv.r1 - vv.r0)*kk);
      m.material.opacity = vv.op * (1 - kk);
    }
    step(v.land);
    for (var i = 0; i < v.pool.length; i++) step(v.pool[i]);
  }
};

/* ---- 零 rnd、单 drawcall 音乐晶体（3 棱锥合并为一份几何；GDD §7.5-4）---- */
function musicShard(cMain, cTip, glow){
  var parts = [
    [0.30, 1.30, 5,  0.00, 0.65,  0.00,  0.0],
    [0.18, 0.86, 5, -0.24, 0.43,  0.08,  0.9],
    [0.16, 0.74, 5,  0.22, 0.37, -0.06, -0.7]
  ];
  var P = [], N = [], C = [];
  var mtx = new THREE.Matrix4(), nm = new THREE.Matrix3(), v = new THREE.Vector3();
  var cA = new THREE.Color(cMain), cB = new THREE.Color(cTip), cc = new THREE.Color();
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    var g = new THREE.ConeGeometry(p[0], p[1], p[2], 1).toNonIndexed();
    var pa = g.attributes.position.array, na = g.attributes.normal.array;
    mtx.makeRotationY(p[6]); mtx.setPosition(p[3], p[4], p[5]);
    nm.getNormalMatrix(mtx);
    for (var j = 0; j < pa.length; j += 3){
      v.set(pa[j], pa[j+1], pa[j+2]).applyMatrix4(mtx); P.push(v.x, v.y, v.z);
      v.set(na[j], na[j+1], na[j+2]).applyMatrix3(nm).normalize(); N.push(v.x, v.y, v.z);
      var tt = clamp((pa[j+1] + p[1]*0.5) / p[1], 0, 1);
      cc.copy(cA).lerp(cB, tt*tt); C.push(cc.r, cc.g, cc.b);
    }
    g.dispose();
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(N, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(C, 3));
  var mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    vertexColors: true, flatShading: true,
    emissive: shade(cMain, 0.55), emissiveIntensity: glow,
    transparent: true, opacity: 0.94
  }));
  mesh.castShadow = true;
  mesh.userData.cMain = cMain; mesh.userData.cTip = cTip;
  return mesh;
}

/* ---- 传送激活台（GDD §4.6 推荐方案：门正下方新增发光圆台，天空环门作远景呼应）---- */
function portalPad(r){
  var g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(r, r*1.06, 0.18, 24, 1),
    M(0xEAF6FF, { emissive: shade(0x9FEBFF, 0.5), ei: 0.8, transparent: true, opacity: 0.86 }),
    0, 0.09, 0, { cast: false });
  var ring = add(g, new THREE.TorusGeometry(r*1.12, 0.12, 8, 28),
    M(0x9FEBFF, { emissive: shade(0x9FEBFF, 0.7), ei: 1.1, transparent: true, opacity: 0.32 }),
    0, 0.16, 0, { cast: false, recv: false, rot: [Math.PI/2, 0, 0] });
  g.userData.ring = ring; g.userData.t = 0;
  return g;
}

/* ---- 任务卡内容（数据驱动，GDD §5.3 / §7.5-6）---- */
function taskInner(){
  var lv = LEVELS[cur], tasks = (lv && lv.tasks) ? lv.tasks : [];
  var h = '<div class="h">探索目标</div>';
  for (var i = 0; i < tasks.length; i++){
    var t = tasks[i], v = GameState.get(t.id);
    h += '<div class="li"><i class="box' + (v >= t.need ? ' done' : '') + '"></i><span>' +
         t.label + '</span><b>' + v + '/' + t.need + '</b></div>';
  }
  return h;
}

/* ---- 收集（GDD §3.3 / §7.5-5）---- */
function m1Collect(g){
  if (!g || g.userData.taken) return;
  g.userData.taken = true; g.visible = false;
  TaskSystem.progress('gems', 1);
  VFX.burst(g.position.x, g.userData.groundY + 0.12, g.position.z);
  m1Sfx('collect');
  var need = 3, lv = LEVELS[cur], ts = lv && lv.tasks;
  if (ts) for (var qi = 0; qi < ts.length; qi++) if (ts[qi].id === 'gems') need = ts[qi].need;
  if (GameState.get('gems') >= need && GameState.portal === 'dormant'){
    GameState.portal = 'charged';
    Bus.emit('portal:charged', {});
    m1Sfx('beatPerfect');
  }
}
var Collectible = {
  register: function(mesh){ mesh.userData.collectible = true; },
  update: function(dt, k, S){
    var lv = LEVELS[k]; if (!lv || !lv.band || !S || !S.scene) return;
    var gs = S.scene.userData.gems;
    if (!gs) return;
    var h = S.hero; if (!h) return;
    for (var i = 0; i < gs.length; i++){
      var g = gs[i]; if (g.userData.taken) continue;
      g.rotation.y += dt * 1.4;
      g.position.y = g.userData.groundY + 1.2 + Math.sin(T*1.7 + g.userData.phase)*0.16;
      var dx = g.position.x - h.position.x, dz = g.position.z - h.position.z;
      if (dx*dx + dz*dz <= CFG.R_COLLECT*CFG.R_COLLECT) m1Collect(g);
    }
  }
};

/* ---- 任务与进度（GDD §3.5 / §7.5-6）---- */
var TaskSystem = {
  progress: function(id, n){ return GameState.add(id, n); },
  isClear: function(k){
    var lv = LEVELS[k]; if (!lv) return true;
    for (var i = 0; i < lv.tasks.length; i++) if (!GameState.taskDone(lv.tasks[i])) return false;
    return true;
  }
};

/* ---- 传送装置状态机（GDD §3.4）：dormant → charged → activated ---- */
var Portal = {
  update: function(dt, k, S){
    var lv = LEVELS[k]; if (!lv || !lv.band || !S || !S.scene || !S.hero) return;
    var pad = S.scene.userData.pad;
    if (!pad) return;
    var st = GameState.portal;
    pad.userData.t += dt;
    pad.scale.setScalar(1 + Math.sin(pad.userData.t*2.2)*0.05);
    var ring = pad.userData.ring;
    if (ring) ring.material.opacity = st === 'dormant' ? 0.32 : (st === 'charged' ? 0.9 : 1.0);
    if (lv.summitZ != null && S.hero.position.z <= lv.summitZ && GameState.get('summit') < 1) TaskSystem.progress('summit', 1);
    if (st === 'charged'){
      var rr3 = lv.padR || CFG.R_PORTAL;
      var dx = pad.position.x - S.hero.position.x, dz = pad.position.z - S.hero.position.z;
      if (dx*dx + dz*dz <= rr3*rr3){
        GameState.portal = 'activated';
        GameState.add('portal', 1);
        Bus.emit('portal:go', {});
        m1Sfx('portalGo'); HUD.flash(CFG.FADE);
        var nx = lv.next || 'home';
        setTimeout(function(){ setScene(nx); }, 380);
      }
    }
  }
};

/* ---- 角色位移 + 贴地（GDD §3.1；M3-OP：自动前进 + 跑道换道）------------------
   红线：只改 x/z，y 交给 poseHero；FREEZE（截图门禁）下本函数整体不执行 ⇒ 定帧零漂移。 */
var PlayerController = {
  vx: 0, vz: 0, moved: false, stopped: false,
  reset: function(){ PlayerController.vx = 0; PlayerController.vz = 0;
    PlayerController.moved = false; PlayerController.stopped = false; },
  mode: function(k){ return (LEVELS[k] && LEVELS[k].band) ? 'run' : 'idle'; },
  update: function(dt, k, S){
    var lv = LEVELS[k];
    if (dt <= 0 || !lv || !lv.band) return;                /* M2：desert / cave 均可移动 */
    if (!S || !S.runnable || !S.hero || !S.scene || !S.scene.userData.ground) return;
    var ground = S.scene.userData.ground;
    var h = S.hero;
    /* ① 自动前进：沿 −z 恒定速度；抵达 band 末端后钳制（关卡段终点）
       M3-CW：单赛道关（causeway）前进速度由 Track 提供（基础 11 / 冲刺 15），其余关沿用 CFG.SPEED_F */
    var spd = (lv.mode === 'single-track') ? Track.speed() : CFG.SPEED_F;
    var nz = h.position.z - spd * dt;
    if (nz <= lv.band[2]){ nz = lv.band[2]; PlayerController.stopped = true; }
    h.position.z = nz;
    /* ② 横向：完全由 Lane 车道插值决定（玩家唯一输入 = 左/右换道） */
    h.position.x = clamp(Lane.xAt(k, Lane.idx), lv.band[0], lv.band[1]);
    /* ③ 朝向：跑动方向 = −z（模型默认正面 −z） */
    h.rotation.y = 0;
    /* ④ 换道侧倾 roll：无换道时恒为 0 ⇒ 与定帧基准等价 */
    h.rotation.z = Math.abs(Lane.roll) > 0.001 ? D2R(-Lane.roll) : 0;
    h.userData.baseY = ground(h.position.x, h.position.z);
    PlayerController.moved = true;
  }
};

/* ---- 相机装置 · 跑道式跟随（GDD §3.9 / §7.2 M2 → M3-OP 改造）
   以定帧机位 CAM[k] 为基准，**只沿 z 做刚性平移**（相机与注视点同量平移、朝向不变）：
   角色屏幕位置恒定、世界向后流过 ⇒ 跑酷推进感；x / y / pitch / fov 全部锁死为定帧基准
   ⇒ 换道不甩镜（防晕）。出生点 dz = 0 ⇒ 相机与定帧逐位一致 ⇒ 定帧 heroC 零漂移；
   FREEZE（截图门禁）下整段不执行。仅对可玩关（存在 LEVELS[k].band）生效。 */
var CameraRig = {
  K: 0.8, RATE: 5.0,
  _base: {}, _look: {}, _off: {}, _spawn: {},
  init: function(k){
    var S = SCN[k]; if (!S || !S.camera || !S.hero || !S.hero.home) return;
    var v = camVectors(CAM[k]);
    CameraRig._base[k]  = v.pos.clone();
    CameraRig._look[k]  = v.look.clone();
    CameraRig._off[k]   = new THREE.Vector3(0, 0, 0);
    CameraRig._spawn[k] = S.hero.home.clone();
  },
  off: function(k){ var o = CameraRig._off[k]; return o ? [+o.x.toFixed(3), +o.y.toFixed(3), +o.z.toFixed(3)] : null; },
  reset: function(k){
    if (CameraRig._off[k]) CameraRig._off[k].set(0, 0, 0);
    var S = SCN[k];
    if (S && S.camera && CameraRig._base[k]){
      S.camera.position.copy(CameraRig._base[k]);
      S.camera.lookAt(CameraRig._look[k]);
    }
  },
  update: function(dt, k){
    var lv = LEVELS[k]; if (!lv || !lv.band) return;      /* 仅可玩关跟随 */
    var S = SCN[k], base = CameraRig._base[k], look = CameraRig._look[k], sp = CameraRig._spawn[k];
    if (!S || !S.camera || !S.hero || !base || !sp) return;
    /* 只跟 z（刚性、无平滑）：角色屏幕位置恒定；x 锁死 ⇒ 换道不甩镜 */
    var dz = S.hero.position.z - sp.z;
    var o = CameraRig._off[k];
    if (o){ o.x = 0; o.z = dz; }
    S.camera.position.set(base.x, base.y, base.z + dz);
    S.camera.lookAt(look.x, look.y, look.z + dz);
  }
};

/* ==========================================================================
   M3-CW · P4 段落镜头系统（Lens + LensArbiter）
   --------------------------------------------------------------------------
   5 个镜头状态：追尾 chase / 贴身 onboard / 俯视 overhead / 侧视 lateral / 漂移 drift。
   ▸ **只写 SCN.causeway.camera**（position / lookAt / fov）—— 不新增任何 three 对象、
     绝不触碰 hero ⇒ draw calls / tris / heroC 零变化（定帧门禁不受影响）。
   ▸ causeway 下由 Lens 接管相机（主循环分支），CameraRig **源码零改动**、四场景逐位不变。
   ▸ 切换边界 = 乐句（4 小节），由 Chart.lensCues 驱动（生成期已保证：全部落在 4 小节线、
     间隔 ≥4 小节、每乐句 ≤1 次）⇒ LensArbiter = 游标消费 + 结构校验 + 固定追尾守卫。
   ▸ 切换时长 180ms / easeInOutSine（比操作慢 —— 镜头是"运镜"）；roll 恒 0（防晕 §5.4）。
   ========================================================================== */
var LENSG = {
  chase:    { off: [0,    1.55, 4.90], look: [0, 1.20, -0.50], fov: 70 },  /* 与 CAM.causeway 定帧等价 */
  onboard:  { off: [0,    1.62, 1.75], look: [0, 1.28, -7.00], fov: 92 },
  overhead: { off: [0,    6.00, 2.60], look: [0, 0.60, -7.00], fov: 78 },
  lateral:  { off: [4.50, 1.70, 2.60], look: [0, 1.10, -4.00], fov: 70 },
  drift:    { off: [4.20, 2.30, 4.20], look: [0, 1.10, -3.00], fov: 72 }
};
var Lens = {
  cur: 'chase', t: 1, DUR: 0.180, fromGeo: null, fromFov: 70, fov: 70,
  ay: null, driftPh: 0, cueIdx: 0, lastBar: -99, lastPhrase: -1, _lensOn: false,
  fixed: (Q.get('fixchase') === '1'),
  reset: function(){
    Lens.cur = 'chase'; Lens.t = 1; Lens.cueIdx = 0; Lens.lastBar = -99; Lens.lastPhrase = -1;
    Lens.fromGeo = null; Lens.fov = LENSG.chase.fov; Lens.ay = null; Lens.driftPh = 0;
    if (FREEZE) return;                                   /* 定帧绝不写相机 */
    var S = SCN.causeway; if (!S || !S.camera || !S.hero) return;
    S.camera.fov = CAM.causeway.fov; S.camera.updateProjectionMatrix();
    var h = S.hero, G = LENSG.chase;
    S.camera.position.set(h.position.x + G.off[0], h.position.y + G.off[1], h.position.z + G.off[2]);
    S.camera.lookAt(h.position.x + G.look[0], h.position.y + G.look[1], h.position.z + G.look[2]);
  },
  toLens: function(name, bar){
    if (!LENSG[name] || name === Lens.cur){ Lens.cueIdx++; return false; }
    Lens.fromGeo = LENSG[Lens.cur]; Lens.fromFov = Lens.fov;
    Lens.cur = name; Lens.t = 0; Lens.cueIdx++;
    if (bar != null) Lens.lastBar = bar;
    Lens.lastPhrase = Math.floor(Lens.lastBar / 4);
    Bus.emit('cw:lens', { name: name });
    return true;
  },
  update: function(dt, k){
    if (FREEZE || !Track.isCw(k)) return;                 /* 双保险（调用点已在 !FREEZE 内） */
    var S = SCN.causeway; if (!S || !S.camera || !S.hero) return;
    var h = S.hero, cam = S.camera;
    LensArbiter.update(dt);
    if (Lens.t < 1) Lens.t = Math.min(1, Lens.t + dt / Lens.DUR);
    var e = (Lens.t >= 1) ? 1 : easeInOutSine(Lens.t);
    if (Lens.cur === 'drift') Lens.driftPh += dt * 0.35;
    var G = LENSG[Lens.cur], off = G.off, look = G.look;
    if (Lens.cur === 'drift'){                            /* 漂移：绕轴缓慢环绕（dt 积分 ⇒ 零随机） */
      var c = Math.cos(Lens.driftPh), s = Math.sin(Lens.driftPh);
      off = [LENSG.drift.off[0] * c, LENSG.drift.off[1], LENSG.drift.off[0] * s];
    }
    var FG = Lens.fromGeo || G, FF = Lens.fromGeo ? Lens.fromFov : G.fov;
    var fo = FG.off, fl = FG.look;
    var px = fo[0] + (off[0] - fo[0]) * e, py = fo[1] + (off[1] - fo[1]) * e, pz = fo[2] + (off[2] - fo[2]) * e;
    var lx = fl[0] + (look[0] - fl[0]) * e, ly = fl[1] + (look[1] - fl[1]) * e, lz = fl[2] + (look[2] - fl[2]) * e;
    /* FOV 随速度/能量向 92 插值（速度感的主要来源，设计 §3.3） */
    var spr = clamp((Track.speed() - CW.BASE) / (CW.SPRINT - CW.BASE), 0, 1);
    var en = clamp(Track.energy, 0, 1);
    var drive = clamp(0.7 * spr + 0.3 * Math.max(0, en - CW.SPRINT_AT) / (1 - CW.SPRINT_AT), 0, 1);
    var fovT = G.fov + (92 - G.fov) * drive;
    Lens.fov = FF + (fovT - FF) * e;
    /* 相机 y 走短时常数阻尼（吃掉 0.9m 层切换的顿挫）；x/z 刚性跟随 ⇒ "世界向后流过" */
    if (Lens.ay == null) Lens.ay = h.position.y;
    Lens.ay += (h.position.y - Lens.ay) * Math.min(1, dt * 8);
    cam.position.set(h.position.x + px, Lens.ay + py, h.position.z + pz);
    cam.lookAt(h.position.x + lx, Lens.ay + ly, h.position.z + lz);
    if (Math.abs(cam.fov - Lens.fov) > 0.05){ cam.fov = Lens.fov; cam.updateProjectionMatrix(); }
    /* 镜头名指示：仅调试 / 固定追尾辅助下显示 */
    var q = RhythmHUD._q;
    if (q && q.lens){
      var show = (Lens.fixed || DBG);
      if (show){
        if (!Lens._lensOn){ q.lens.className = 'lens on'; Lens._lensOn = true; }
        var nm = Lens.fixed ? '固定追尾' : Lens.cur.toUpperCase();
        if (q.lens.textContent !== nm) q.lens.textContent = nm;
      } else if (Lens._lensOn){ q.lens.className = 'lens'; Lens._lensOn = false; }
    }
  },
  info: function(){ return { lens: Lens.cur, t: +Lens.t.toFixed(3), fov: +Lens.fov.toFixed(1),
                             fixed: Lens.fixed, cue: Lens.cueIdx }; },
  /* 调试 / seek：按时刻直接落位（不做插值），并保证 cue 游标不错位 */
  snapForTime: function(t){
    var cues = Chart.data ? Chart.data.lensCues : null; if (!cues) return;
    var target = 'chase', bar = 0, idx = 0;
    for (var i = 0; i < cues.length; i++){ if (t >= cues[i].t){ target = cues[i].lens; bar = cues[i].bar; idx = i + 1; } }
    if (Lens.fixed){ target = 'chase'; bar = 0; }        /* §5.4：固定追尾下 seek 同样不越权 */
    Lens.cur = target; Lens.t = 1; Lens.cueIdx = idx; Lens.lastBar = bar; Lens.lastPhrase = Math.floor(bar / 4);
    Lens.fromGeo = null; Lens.fov = LENSG[target].fov; Lens.driftPh = 0; Lens.ay = null;
    if (!FREEZE && SCN.causeway && SCN.causeway.camera){
      SCN.causeway.camera.fov = Lens.fov; SCN.causeway.camera.updateProjectionMatrix();
    }
  }
};
var LensArbiter = {
  update: function(dt){
    if (Lens.fixed) return;                               /* §5.4 固定追尾：不吃 cue */
    var cues = Chart.data ? Chart.data.lensCues : null; if (!cues) return;
    if (Lens.t < 1) return;                               /* 上次运镜未结束 ⇒ 段内稳定、不抖动 */
    var c = cues[Lens.cueIdx]; if (!c) return;
    if (Track.songT < c.t) return;
    var bar = c.bar, phrase = Math.floor(bar / 4);
    var onPhrase = Math.abs(bar / 4 - phrase) < 1e-6;     /* 必须在 4 小节线 */
    var coolOK = (bar - Lens.lastBar) >= 2;               /* 冷却 ≥2 小节 */
    var onceOK = (phrase !== Lens.lastPhrase);            /* 同一乐句 ≤1 次 */
    if (!onPhrase || !coolOK || !onceOK){ Lens.toLens('chase', bar); return; }  /* 违规 → 静默降级 */
    Lens.toLens(c.lens, bar);
  }
};

/* ---- HUD 接线（GDD §5.3 / §7.5-8）：只在数据变化时重渲染 ---- */
var HUD = {
  dirty: false, _flash: null,
  markDirty: function(){ HUD.dirty = true; },
  sync: function(){
    if (!HUD.dirty) return;
    HUD.dirty = false;
    if (SHOWCASE) return;
    var host = document.getElementById('huds');
    var t = host && host.querySelector('.hudLayer .task');
    if (t) t.innerHTML = taskInner();
  },
  flash: function(sec){
    var f = HUD._flash;
    if (!f){
      f = document.createElement('div');
      f.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:#EAFBFF;' +
        'opacity:0;pointer-events:none;z-index:9999;transition:opacity .18s ease';
      document.body.appendChild(f); HUD._flash = f;
    }
    f.style.opacity = '0.85';
    setTimeout(function(){ f.style.opacity = '0'; }, Math.max(80, (sec || 0.35)*1000*0.5));
  }
};

/* ---- M1 模块入口 ---- */
var M1 = {
  enter: function(k){
    GameState.reset(k);
    PlayerController.reset();
    CameraRig.reset(k);
    Lane.reset(k, !FREEZE);          /* M3-OP：吸附到最近道；FREEZE 下保持连续值 ⇒ 定帧不变 */
    Track.reset(k);                  /* M3-CW：回到 Lo 层、清空同调/缓冲/俯仰 */
    CWInput.reset();                 /* M3-CW：清「轻点待判 / 同调长按」状态 */
    if (k === 'causeway'){
      Chart.load(); BGM.start();     /* M3-CW：加载真值谱面 + 起播 BGM（待首个用户手势） */
      CWScore.reset();
      Lens.reset();                  /* M3-CW·P4：相机复位（fov 归 70 + 贴回 chase ⇒ 修往返后 fov 残留） */
      CWAnt.reset();                 /* M3-CW·P4：清预判窗口 / 押注 / amo */
      CWReso.reset();                /* M3-CW·P4：清同调长音判定 / mult */
      Obstacle.mount(); Obstacle.reset();   /* FREEZE 下 mount 内部自会跳过 ⇒ 定帧 children 不变 */
      RhythmHUD.show(true);
    } else {
      BGM.stop();                    /* 离开单赛道关 → 停 BGM（其余关沿用内置 kick/hat） */
      RhythmHUD.show(false);
    }
    var S = SCN[k], sd = (S && S.scene) ? S.scene.userData : null;
    if (sd && sd.gems){
      for (var i = 0; i < sd.gems.length; i++){
        var g = sd.gems[i];
        g.userData.taken = false; g.visible = true;
        g.rotation.y = g.userData.rotY0 || 0;
        g.position.y = g.userData.groundY + 1.2;
      }
    }
    if (sd && sd.pad){ sd.pad.userData.t = 0; sd.pad.scale.setScalar(1); }
    BeatClock.setSong(SONGS[(LEVELS[k] && LEVELS[k].song) || 'sunny']);
    HUD.markDirty();
  },
  interact: function(){
    var S = SCN[cur];
    if (!S || !S.hero || !S.scene) return;
    var gs = S.scene.userData.gems;
    if (gs){
      var rr2 = (CFG.R_COLLECT*1.8)*(CFG.R_COLLECT*1.8);
      for (var i = 0; i < gs.length; i++){
        var g = gs[i]; if (g.userData.taken) continue;
        var dx = g.position.x - S.hero.position.x, dz = g.position.z - S.hero.position.z;
        if (dx*dx + dz*dz <= rr2){ m1Collect(g); return; }
      }
    }
    m1Sfx('uiClick');
  }
};
Bus.on('progress', function(){ HUD.markDirty(); });

/* ==========================================================================
   7. 启动
   ========================================================================== */
function boot(){
  srand(0x2F6E2B1); SCN.home   = buildHome();
  srand(0x51C7A3); SCN.desert = buildDesert();
  srand(0x9B31F7); SCN.cave   = buildCave();
  srand(0x77E2D9); SCN.base   = buildBase();
  srand(0xC0A5E7); SCN.causeway = buildCauseway();   /* M3-CW：第 5 个可玩场景（单赛道；不进 RENDER_ORDER） */
  SCENES_ALL.forEach(function(k){
    if (SCN[k].hero){
      SCN[k].hero.home = SCN[k].hero.position.clone();
      /* 记录构建期基准，供 setScene 往返复位（保证 heroC 逐位可复现） */
      SCN[k].hero.userData.baseY0 = SCN[k].hero.userData.baseY;
      SCN[k].hero.userData.rotY0 = SCN[k].hero.rotation.y;
    }
  });
  setupCameras();
  SCENES_ALL.forEach(function(k){ CameraRig.init(k); });   /* M2：记录各关基准机位与出生点 */
  scenesReady = true;
  if (!SCN[cur]) cur = 'home';
  setScene(cur);
  buildHUD();
  if (COMPARE) setupCompare();
  last = performance.now();
  requestAnimationFrame(loop);
}
function setupCompare(){
  document.getElementById('cmp').classList.add('on');
  document.getElementById('cmpbar').classList.add('on');
  var img = document.getElementById('cmpimg');
  img.src = new URLSearchParams(location.search).get('ref') || '15645d0f-8490-47a7-a594-49aa84b6c123.png';
  img.style.opacity = 0.5;
  var sl = document.getElementById('cmpslider');
  sl.addEventListener('input', function(){
    img.style.opacity = (sl.value/100).toFixed(2);
    document.getElementById('cmpval').textContent = sl.value + '%';
  });
}
window.__setScene = setScene;
/* M3-CW · 调试 / 门禁钩子：把 causeway 跳到指定音乐时刻
   （同步 角色 z = Track.zOf(t)、BGM 锚点、谱面游标、计分），便于在数秒内验证判定链路 */
window.__cwSeek = function(t){
  var S = SCN.causeway;
  if (!S || !S.hero || !Chart.ready) return false;
  t = clamp(t, 0, Chart.data.duration - 0.25);
  S.hero.position.z = Track.zOf(t);
  Track.reset('causeway');
  Track.songT = t; Track.lastSwitchT = -99;
  if (BGM.playing && actx) bgmT0 = actx.currentTime - t;
  CWScore.reset();
  Obstacle.mount(); Obstacle.seek(t);
  Lens.snapForTime(t);                         /* M3-CW·P4：镜头按时刻直接落位 */
  CWAnt.reset(t);                              /* M3-CW·P4：预判游标随时刻前移 */
  CWReso.reset(t);                             /* M3-CW·P4：同调游标随时刻前移（早于 t 的长音不计） */
  RhythmHUD.ensure();
  return true;
};
/* M3-CW·P4 调试 / 门禁钩子：镜头状态机 + 同调自动松手 */
window.__cwChart = function(){ return Chart.data; };
window.__cwLensInfo = function(){ return Lens.info(); };
window.__cwLens = function(name){ return Lens.toLens(name, null); };
window.__cwLensFixed = function(on){ Lens.fixed = !!on; if (on) Lens.cur = Lens.cur || 'chase'; return Lens.fixed; };
window.__cwAutoRelease = function(t){ CWReso.autoRelease(t); };
window.__SCN = SCN; /* 调试钩子：控制台可访问各场景对象 */
window.__info = function(){
  var out = {};
  SCENES_ALL.forEach(function(k){
    var c = SCN[k].camera, h = SCN[k].hero;
    var e = { cam: c.position.toArray().map(function(v){return +v.toFixed(2);}), children: SCN[k].scene.children.length };
    if (h){
      var box = new THREE.Box3().setFromObject(h);
      var ctr = box.getCenter(new THREE.Vector3());
      function ndcV(v){ var p = v.clone().project(c); return [+((p.x+1)/2).toFixed(3), +((1-p.y)/2).toFixed(3)]; }
      e.heroC = ndcV(ctr);
      e.heroFeet = ndcV(new THREE.Vector3(ctr.x, box.min.y, ctr.z));
      e.heroHead = ndcV(new THREE.Vector3(ctr.x, box.max.y, ctr.z));
      e.hPct = +(e.heroFeet[1] - e.heroHead[1]).toFixed(3);
      e.heroY = +h.position.y.toFixed(3);
      e.baseY = +h.userData.baseY.toFixed(3);
    }
    out[k] = e;
  });
  out.calls = renderer.info.render.calls; out.tris = renderer.info.render.triangles;
  out.jump = { on: jump.on, y: +jump.y.toFixed(3), v: +jump.v.toFixed(3), perfect: !!jump.perfect };
  out.cur = cur;
  var _lv = LEVELS[cur], _t = {};
  if (_lv) for (var _i = 0; _i < _lv.tasks.length; _i++) _t[_lv.tasks[_i].id] = GameState.get(_lv.tasks[_i].id) + '/' + _lv.tasks[_i].need;
  out.m1 = { mode: PlayerController.mode(cur), portal: GameState.portal, gems: GameState.get('gems'),
             tasks: _t, beat: +BeatClock.phase.toFixed(3), inWin: BeatClock.inWindow(),
             heroX: SCN[cur] && SCN[cur].hero ? +SCN[cur].hero.position.x.toFixed(3) : null,
             heroZ: SCN[cur] && SCN[cur].hero ? +SCN[cur].hero.position.z.toFixed(3) : null,
             camOff: CameraRig.off(cur),
             lane: Lane.info(), stopped: PlayerController.stopped, autoSpeed: CFG.SPEED_F,
             track: Track.info() };
  /* M3-CW：单赛道运行时快照（供 causeway 门禁 / 调试） */
  out.cw = { chart: Chart.ready, bgm: BGM.playing, audio: actx ? actx.state : null,
             songT: +Track.songT.toFixed(3),
             energy: +Track.energy.toFixed(2), section: (Track.section ? Track.section.kind : null),
             resonate: CWInput.resonating, zOf: +Track.zOf(Track.songT).toFixed(2),
             obs: { live: Obstacle.live ? Obstacle.live.length : 0, next: Obstacle.nextIdx,
                    total: Chart.data ? Chart.data.obstacles.length : 0 },
             score: { value: CWScore.score, combo: CWScore.combo, maxCombo: CWScore.maxCombo,
                      perfect: CWScore.perfect, good: CWScore.good, miss: CWScore.miss,
                      orbs: CWScore.orbs, orbMiss: CWScore.orbMiss, decoy: CWScore.decoy,
                      mult: +CWScore.mult.toFixed(3), amo: CWScore.amo,
                      acc: +CWScore.accuracy().toFixed(3), rank: CWScore.rank() },
             lens: Lens.info(),
             ant: CWAnt.info(),
             reso: CWReso.info() };
  return out;
};
boot();
})();
