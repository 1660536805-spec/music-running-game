<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<link rel="icon" href="data:," />
<title>声浪星球 · Soundwave Planet</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#BFE9FF;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* ============ HUD 容器 ============ */
  #huds{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hudLayer{ --px: calc(100vh / 941); position:absolute;inset:0;overflow:hidden }
  .quad{position:absolute;width:50%;height:50%;overflow:hidden}
  .quad.q0{left:0;top:0} .quad.q1{left:50%;top:0}
  .quad.q2{left:0;top:50%} .quad.q3{left:50%;top:50%}
  .quad>.hudLayer{width:100vw;height:100vh;inset:auto;left:0;top:0;
    transform:scale(.5);transform-origin:0 0}

  #divider{position:absolute;inset:0;display:none;pointer-events:none;z-index:12}
  #divider.on{display:block}
  #divider:before{content:"";position:absolute;left:calc(50% - 2.5px);top:0;width:5px;height:100%;background:#fff}
  #divider:after{content:"";position:absolute;top:calc(50% - 2.5px);left:0;height:5px;width:100%;background:#fff}

  /* ============ 通用玻璃卡 ============ */
  .glass{
    background:rgba(28,60,88,.44);
    border:calc(1px) solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:calc(26 * var(--px));
    box-shadow:0 calc(10 * var(--px)) calc(30 * var(--px)) rgba(14,35,54,.18);
  }
  .hud{position:absolute;pointer-events:none}
  h1,h2,p{margin:0}

  /* ---------- 音乐卡 ---------- */
  .music{left:calc(40*var(--px));top:calc(44*var(--px));
    width:calc(372*var(--px));height:calc(134*var(--px));
    padding:calc(24*var(--px));display:flex;gap:calc(22*var(--px));align-items:center}
  .music .cover{width:calc(86*var(--px));height:calc(86*var(--px));border-radius:calc(18*var(--px));
    flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#F6C3CE,#8E6BA6 58%,#3E3660)}
  .music .cover:after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 64% 26%,rgba(255,244,218,.95) 0 13%,rgba(255,244,218,0) 44%)}
  .music .meta{flex:1;min-width:0}
  .music .meta .t{font-size:calc(30*var(--px));font-weight:700;color:#fff;letter-spacing:.02em;
    line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .music .meta .a{font-size:calc(21*var(--px));font-weight:500;color:rgba(255,255,255,.78);margin-top:calc(3*var(--px))}
  .music .meta .time{font-size:calc(18*var(--px));font-weight:500;color:rgba(255,255,255,.74);
    margin-top:calc(8*var(--px));letter-spacing:.04em}
  .wave{display:flex;align-items:flex-end;gap:calc(3*var(--px));height:calc(20*var(--px));margin-top:calc(6*var(--px))}
  .wave i{width:calc(3*var(--px));border-radius:calc(2*var(--px));background:rgba(168,238,255,.95);display:block}
  .wave i.dim{background:rgba(255,255,255,.30)}

  /* ---------- 任务卡 ---------- */
  .task{right:calc(66*var(--px));top:calc(36*var(--px));
    width:calc(340*var(--px));padding:calc(26*var(--px)) calc(28*var(--px))}
  .task .h{font-size:calc(28*var(--px));font-weight:700;color:#fff;margin-bottom:calc(12*var(--px));
    letter-spacing:.05em}
  .task .li{display:flex;align-items:center;gap:calc(14*var(--px));
    font-size:calc(23*var(--px));color:rgba(255,255,255,.90);font-weight:500;padding:calc(7*var(--px)) 0}
  .task .li .box{width:calc(20*var(--px));height:calc(20*var(--px));flex:0 0 auto;
    border:calc(2.4*var(--px)) solid rgba(255,255,255,.55);border-radius:calc(5*var(--px))}
  .task .li .box.done{background:rgba(168,238,255,.92);border-color:rgba(168,238,255,.92)}
  .task .li span{flex:1}
  .task .li b{font-weight:600;color:#fff;font-variant-numeric:tabular-nums}

  /* ---------- 资源栏 ---------- */
  .res{right:calc(150*var(--px));top:calc(40*var(--px));display:flex;gap:calc(34*var(--px));
    padding:calc(18*var(--px)) calc(32*var(--px))}
  .res i{display:flex;align-items:center;gap:calc(13*var(--px));font-style:normal;
    font-size:calc(24*var(--px));font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .res i em{width:calc(20*var(--px));height:calc(20*var(--px));border-radius:calc(6*var(--px));
    transform:rotate(45deg);display:block}

  /* ---------- 圆钮（M3-OP：虚拟摇杆 .stick 已移除，换道改由半区轻点/← →）---------- */
  .rbtns{right:calc(150*var(--px));bottom:calc(56*var(--px));display:flex;align-items:center;gap:calc(24*var(--px))}
  .rbtns b{width:calc(76*var(--px));height:calc(76*var(--px));border-radius:50%;
    border:calc(2.5*var(--px)) solid rgba(255,255,255,.34);background:rgba(255,255,255,.13);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:calc(30*var(--px));font-weight:600}
  .rbtns b.big{width:calc(104*var(--px));height:calc(104*var(--px));background:rgba(255,255,255,.20);
    font-size:calc(40*var(--px))}
  /* 参考图右缘中部的独立跑步圆钮 */
  .runbtn{right:calc(66*var(--px));top:42%;transform:translateY(-50%)}
  .runbtn b{width:calc(86*var(--px));height:calc(86*var(--px));border-radius:50%;
    border:calc(2.5*var(--px)) solid rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:calc(32*var(--px));font-weight:600}
  /* ---------- M3-CW ·《超频长阶》常驻「同调」圆钮（触摸长按屏幕的兜底通道）---------- */
  .cwres{right:calc(150*var(--px));bottom:calc(150*var(--px))}
  .cwres b{width:calc(126*var(--px));height:calc(126*var(--px));border-radius:50%;
    border:calc(2.5*var(--px)) solid rgba(140,255,200,.34);background:rgba(140,255,200,.16);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:calc(26*var(--px));font-weight:700;letter-spacing:.04em;
    transition:background .10s,border-color .10s,transform .10s}
  .cwres b.on{background:rgba(140,255,200,.58);border-color:rgba(140,255,200,.95);transform:scale(1.08)}
  /* ---------- M3-CW · 单赛道操作提示：移到画面上方天空区（不遮挡近场障碍） ---------- */
  .hud.cwhint{left:50%;top:calc(128*var(--px));transform:translateX(-50%);
    padding:calc(12*var(--px)) calc(30*var(--px));font-size:calc(23*var(--px));letter-spacing:.03em;
    opacity:.88}
  .hud.cwhint kbd{padding:calc(3*var(--px)) calc(12*var(--px));font-size:calc(20*var(--px))}

  /* ---------- M3-CW · 音游 HUD（惰性层：仅进入 causeway 时创建并显示） ---------- */
  #cwhud{--px:calc(100vh / 941);position:fixed;inset:0;z-index:12;pointer-events:none;
    display:none;color:#fff;font-family:inherit;user-select:none;-webkit-user-select:none}
  #cwhud.on{display:block}
  #cwhud .bar{position:absolute;left:0;right:0;top:0;height:calc(7*var(--px));background:rgba(255,255,255,.10)}
  #cwhud .bar i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,#18E0FF,#8CFFC8,#FF4FD8);
    box-shadow:0 0 calc(14*var(--px)) rgba(140,255,200,.65)}
  #cwhud .sc{position:absolute;right:calc(40*var(--px));top:calc(38*var(--px));text-align:right;
    text-shadow:0 calc(3*var(--px)) calc(16*var(--px)) rgba(0,0,0,.55)}
  #cwhud .sc b{display:block;font-size:calc(56*var(--px));font-weight:800;letter-spacing:.02em;line-height:1.05}
  #cwhud .sc s{display:block;font-size:calc(24*var(--px));font-weight:700;text-decoration:none;
    color:rgba(255,255,255,.72);margin-top:calc(6*var(--px))}
  #cwhud .cmb{position:absolute;left:calc(46*var(--px));top:calc(430*var(--px));
    text-shadow:0 calc(6*var(--px)) calc(26*var(--px)) rgba(0,0,0,.5)}
  #cwhud .cmb b{display:block;font-size:calc(104*var(--px));font-weight:800;line-height:.98}
  #cwhud .cmb s{display:block;font-size:calc(22*var(--px));font-weight:700;letter-spacing:.22em;
    text-decoration:none;color:rgba(255,255,255,.60)}
  #cwhud .jd{position:absolute;left:50%;top:calc(390*var(--px));transform:translate(-50%,-50%) scale(.86);
    font-size:calc(70*var(--px));font-weight:800;letter-spacing:.08em;opacity:0}
  #cwhud .jd.perfect{color:#8CFFC8;text-shadow:0 0 calc(30*var(--px)) rgba(140,255,200,.85)}
  #cwhud .jd.good{color:#FFE27A;text-shadow:0 0 calc(30*var(--px)) rgba(255,226,122,.75)}
  #cwhud .jd.miss{color:#FF6B8A;text-shadow:0 0 calc(30*var(--px)) rgba(255,107,138,.75)}
  #cwhud .jd.pop{opacity:1;transform:translate(-50%,-50%) scale(1);
    transition:opacity .10s ease,transform .10s ease}
  #cwhud .ly{position:absolute;left:calc(46*var(--px));top:calc(700*var(--px));
    display:flex;flex-direction:column;gap:calc(10*var(--px))}
  #cwhud .ly b{padding:calc(7*var(--px)) calc(22*var(--px));border-radius:calc(999*var(--px));
    font-size:calc(24*var(--px));font-weight:800;letter-spacing:.14em;
    border:calc(2*var(--px)) solid rgba(255,255,255,.20);color:rgba(255,255,255,.46);
    background:rgba(255,255,255,.05);transition:background .10s,color .10s,border-color .10s}
  #cwhud .ly b.on{color:#fff}
  #cwhud .ly b.lo.on{background:rgba(24,224,255,.34);border-color:rgba(24,224,255,.85)}
  #cwhud .ly b.hi.on{background:rgba(255,79,216,.34);border-color:rgba(255,79,216,.85)}
  #cwhud .orb{position:absolute;right:calc(40*var(--px));top:calc(168*var(--px));
    font-size:calc(26*var(--px));font-weight:700;color:rgba(255,255,255,.78);
    text-shadow:0 calc(3*var(--px)) calc(14*var(--px)) rgba(0,0,0,.5)}
  /* P4 · 预判窗口提示（段落交界前 2 拍出现；走向符号 ↑ 上行 / ↓ 下行 / ~ 持续） */
  #cwhud .ant{position:absolute;left:50%;top:calc(210*var(--px));transform:translateX(-50%) scale(.94);
    display:none;align-items:center;gap:calc(14*var(--px));
    padding:calc(9*var(--px)) calc(26*var(--px));border-radius:calc(999*var(--px));
    background:rgba(10,4,24,.55);border:calc(2*var(--px)) solid rgba(255,255,255,.30);
    font-size:calc(24*var(--px));font-weight:800;letter-spacing:.10em;color:#fff;
    text-shadow:0 calc(3*var(--px)) calc(14*var(--px)) rgba(0,0,0,.5);transition:border-color .12s,box-shadow .12s}
  #cwhud .ant.on{display:flex}
  #cwhud .ant b{font-size:calc(42*var(--px));line-height:1}
  #cwhud .ant em{font-style:normal;color:rgba(255,255,255,.62);font-size:calc(21*var(--px));letter-spacing:.06em}
  #cwhud .ant.ok{border-color:rgba(140,255,200,.95);box-shadow:0 0 calc(26*var(--px)) rgba(140,255,200,.55)}
  #cwhud .ant i{display:block;height:calc(5*var(--px));width:calc(120*var(--px));border-radius:calc(999*var(--px));
    background:rgba(255,255,255,.18);overflow:hidden}
  #cwhud .ant i s{display:block;height:100%;width:0;background:linear-gradient(90deg,#18E0FF,#8CFFC8)}
  /* P4 · 实时倍率（同调 mult × 预判 amo）；仅 >1.0 时显示，不占常规画面 */
  #cwhud .mz{position:absolute;right:calc(40*var(--px));top:calc(206*var(--px));
    display:none;font-size:calc(25*var(--px));font-weight:800;letter-spacing:.03em;
    color:#8CFFC8;text-shadow:0 calc(3*var(--px)) calc(16*var(--px)) rgba(0,0,0,.55)}
  #cwhud .mz.on{display:block}
  #cwhud .mz b{color:#FFE27A;font-weight:800}
  /* P4 · 当前镜头名（仅调试 / 固定追尾辅助时显示，不污染常规截图） */
  #cwhud .lens{position:absolute;left:50%;bottom:calc(34*var(--px));transform:translateX(-50%);
    display:none;font-size:calc(21*var(--px));font-weight:700;letter-spacing:.22em;
    color:rgba(255,255,255,.60);text-shadow:0 calc(3*var(--px)) calc(14*var(--px)) rgba(0,0,0,.5)}
  #cwhud .lens.on{display:block}
  .side{right:calc(66*var(--px));top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:calc(22*var(--px))}
  .side b{width:calc(96*var(--px));height:calc(96*var(--px));border-radius:calc(26*var(--px));
    display:flex;align-items:center;justify-content:center;font-size:calc(42*var(--px));
    color:rgba(255,255,255,.92)}

  /* ---------- 洞穴收集提示 ---------- */
  .prompt{left:calc(50% + 140*var(--px));transform:translateX(-50%);top:calc(560*var(--px));
    padding:calc(22*var(--px)) calc(46*var(--px));display:flex;align-items:center;gap:calc(22*var(--px));
    font-size:calc(28*var(--px));font-weight:600;color:#fff;letter-spacing:.04em;white-space:nowrap}
  .prompt kbd{background:rgba(255,255,255,.94);color:#22384C;border-radius:calc(9*var(--px));
    padding:calc(4*var(--px)) calc(15*var(--px));font-size:calc(24*var(--px));font-weight:800;
    font-family:inherit;box-shadow:0 calc(3*var(--px)) 0 rgba(0,0,0,.16)}
  .prompt em{color:#7DE8FF;font-style:normal;font-size:calc(34*var(--px))}

  /* ---------- 小地图 ---------- */
  .map{right:calc(130*var(--px));bottom:calc(56*var(--px));width:calc(236*var(--px));
    display:flex;flex-direction:column;align-items:center;gap:calc(18*var(--px))}
  .map .dial{width:calc(236*var(--px));height:calc(236*var(--px));border-radius:50%;
    background:radial-gradient(circle at 50% 42%,rgba(228,244,248,.60),rgba(198,222,234,.36) 70%,rgba(188,214,228,.22));
    border:calc(3*var(--px)) solid rgba(255,255,255,.44);backdrop-filter:blur(8px);
    position:relative;overflow:hidden}
  .map .dial:before{content:"";position:absolute;inset:calc(24*var(--px));
    border-radius:50%;border:calc(1.6*var(--px)) dashed rgba(60,110,140,.26)}
  .map .dial:after{content:"";position:absolute;left:50%;top:calc(50% - 8*var(--px));
    width:0;height:0;margin-left:calc(-20*var(--px));
    border-left:calc(20*var(--px)) solid transparent;border-right:calc(20*var(--px)) solid transparent;
    border-bottom:calc(38*var(--px)) solid #fff;
    filter:drop-shadow(0 calc(3*var(--px)) calc(6*var(--px)) rgba(40,70,95,.35))}
  .map .label{font-size:calc(28*var(--px));font-weight:700;color:#fff;
    text-shadow:0 calc(3*var(--px)) calc(11*var(--px)) rgba(30,60,85,.55);letter-spacing:.20em}

  /* ---------- HOME 标题菜单 ---------- */
  .title{left:calc(46*var(--px));top:calc(150*var(--px))}
  .title h1{font-size:calc(132*var(--px));font-weight:800;color:#fff;letter-spacing:.01em;
    line-height:1;text-shadow:0 calc(6*var(--px)) calc(30*var(--px)) rgba(24,64,96,.38)}
  .title p{font-size:calc(32*var(--px));font-weight:500;color:#fff;
    margin-top:calc(28*var(--px));letter-spacing:.10em;
    text-shadow:0 calc(3*var(--px)) calc(16*var(--px)) rgba(24,64,96,.42)}
  .menu{margin-top:calc(66*var(--px));display:flex;flex-direction:column;gap:calc(20*var(--px))}
  .menu button{width:calc(330*var(--px));height:calc(64*var(--px));border-radius:calc(999*var(--px));
    border:calc(1.5px) solid rgba(255,255,255,.16);background:rgba(42,70,88,.50);
    backdrop-filter:blur(13px);color:#fff;font-family:inherit;cursor:pointer;
    font-size:calc(27*var(--px));font-weight:600;letter-spacing:.10em;
    display:flex;align-items:center;gap:calc(18*var(--px));padding-left:calc(30*var(--px));
    transition:transform .16s,background .16s;pointer-events:auto;
    box-shadow:0 calc(7*var(--px)) calc(22*var(--px)) rgba(14,35,54,.16)}
  .menu button:hover{transform:translateX(calc(6*var(--px)))}
  .menu button.primary{background:rgba(186,244,200,.96);color:#204055;border-color:rgba(186,244,200,.96);
    box-shadow:0 calc(10*var(--px)) calc(30*var(--px)) rgba(120,220,170,.36)}
  .menu button .ic{font-size:calc(28*var(--px));width:calc(30*var(--px));text-align:center}

  /* ============ 开发调试层 ============ */
  #cmp{position:fixed;inset:0;z-index:13;display:none;pointer-events:none}
  #cmp.on{display:block}
  #cmp img{width:100%;height:100%;object-fit:fill}
  #cmpbar{position:fixed;left:14px;bottom:14px;z-index:14;display:none;gap:8px;align-items:center;
    background:rgba(10,18,28,.72);color:#fff;padding:8px 12px;border-radius:10px;font-size:12px}
  #cmpbar.on{display:flex}
  #dbg{position:fixed;right:10px;bottom:10px;z-index:20;display:none;
    background:rgba(10,18,28,.76);color:#9fe8ff;font:11px/1.5 ui-monospace,Menlo,monospace;
    padding:8px 10px;border-radius:8px;max-width:44vw;white-space:pre-wrap}
  #dbg.on{display:block}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11;transition:opacity .1s}
</style>
</head>
<body>
<div id="stage"></div>
<div class="flash" id="flash"></div>
<div id="huds"></div>
<div id="divider"></div>
<div id="cmp"><img id="cmpimg" alt="" /></div>
<div id="cmpbar">对比叠加 <input id="cmpslider" type="range" min="0" max="100" value="50" /><span id="cmpval">50%</span></div>
<div id="dbg"></div>

<script src="./three.min.js"></script>
<script>
/* ============================================================================
   声浪星球 Soundwave Planet — 低多边形 3D（四场景 · 1:1 视觉复刻版）
   ========================================================================== */
(function(){
'use strict';

/* ---------------------------------------------------------------- 0. 参数 */
var Q = new URLSearchParams(location.search);
var FREEZE   = Q.get('freeze') === '1';
var SHOWCASE = Q.get('showcase') === '1';
var COMPARE  = Q.get('compare') === '1';
var STARTKEY = Q.get('scene') || 'home';
if (SHOWCASE) STARTKEY = 'showcase';
var DBG = Q.get('dbg') === '1';

var _seed = 0x2F6E2B1 >>> 0;
function srand(s){ _seed = (s >>> 0) || 1; }
function rnd(){ _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0; return _seed / 4294967296; }
function rr(a,b){ return a + (b-a)*rnd(); }
function ri(a,b){ return Math.floor(rr(a, b + 0.999)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
/* 独立确定性随机序列：供"零漂移"新增元素使用——走自己的 seed，绝不触碰全局 _seed，
   因此可以在已调好的场景里任意插入随机外观的元素而不打乱既有构图 */
function dseq(seed){ var s = (seed >>> 0) || 1; return function(){ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
/* M3-CW · P4：运镜缓动（比操作慢 —— 镜头是"运镜"而非"操作"，见设计 §5.2） */
function easeInOutSine(t){ return -(Math.cos(Math.PI * t) - 1) / 2; }
function sstep(t){ t = clamp(t,0,1); return t*t*(3-2*t); }
function D2R(d){ return d*Math.PI/180; }

/* ------------------------------------------------------------------ 工具 */
function shade(hex,k){
  var c = new THREE.Color(hex);
  c.r = Math.min(1, c.r*k); c.g = Math.min(1, c.g*k); c.b = Math.min(1, c.b*k);
  return c.getHex();
}
/* ------------------------------------------------------- 程序化 canvas 贴图
   合规说明：规范禁止 PBR / 照片纹理 / 法线贴图。这里全部由 canvas 现画渐变、
   条纹、噪点生成（与已有 blobTex() 同类），只用来做柔和过渡与层次，不引入真实影像。 */
var _ptexCache = {};
function _pSeed(s){ return function(){ s = (s*1664525 + 1013904223) & 0x7fffffff; return s / 0x7fffffff; }; }
function ptex(key, cA, cB, opt){
  opt = opt || {};
  var bands = opt.bands || 0, grains = opt.n || 0, size = opt.size || 128;
  var rp = opt.rep || [1, 1];
  var ck = [key, cA, cB, bands, grains, size, rp[0], rp[1]].join('|');
  if (_ptexCache[ck]) return _ptexCache[ck];

  var S = size, cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  var g = cv.getContext('2d');
  var rndT = _pSeed(0x51F3A7 + S + bands*17 + grains);
  var a = '#' + ('000000' + (cA >>> 0).toString(16)).slice(-6);
  var b = '#' + ('000000' + (cB >>> 0).toString(16)).slice(-6);
  var lg = g.createLinearGradient(0, 0, 0, S);
  lg.addColorStop(0, a); lg.addColorStop(1, b);
  g.fillStyle = lg; g.fillRect(0, 0, S, S);

  /* 横向柔和条带（地层 / 纬度带 / 水流纹） */
  for (var i = 0; i < bands; i++){
    var y = (i + 0.5) / bands * S;
    var hb = S / bands * (0.35 + 0.30*rndT());
    g.globalAlpha = 0.08 + 0.07*rndT();
    g.fillStyle = (i % 2) ? '#ffffff' : '#000000';
    g.fillRect(0, y - hb*0.5, S, hb);
  }
  /* 细颗粒噪点，破掉大色块的塑料感 */
  for (var j = 0; j < grains; j++){
    var x2 = rndT()*S, y2 = rndT()*S, r2 = 1 + rndT()*3.2;
    g.globalAlpha = 0.025 + rndT()*0.055;
    g.fillStyle = rndT() < 0.5 ? '#ffffff' : '#000000';
    g.beginPath(); g.arc(x2, y2, r2, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;

  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rp[0], rp[1]);
  t.needsUpdate = true;
  _ptexCache[ck] = t;
  return t;
}

/* 地表通用柔和噪点贴图（与顶点色相乘，只做柔化不做图案） */
function terrainTex(rep){

function M(color, o){

    color: color, flatShading: true,

}
function basic(color, o){

function add(parent, geo, mat, x, y, z, opts){

  if (opts.rot) m.rotation.set(opts.rot[0]||0, opts.rot[1]||0, opts.rot[2]||0);

  m.receiveShadow = opts.recv !== false;

}
function grp(parent, x,y,z){ var g = new THREE.Group(); g.position.set(x||0,y||0,z||0); parent.add(g); return g; }

function makeSky(zenith, horizon, groundBelow){
  var R = 4000;
  var g = new THREE.SphereGeometry(R, 28, 18);
  var p = g.attributes.position, cols = [];
  var cz = new THREE.Color(zenith), ch = new THREE.Color(horizon), cg = new THREE.Color(groundBelow || horizon);
  for (var i = 0; i < p.count; i++){
    var y = p.getY(i) / R;
    var c = y > 0 ? ch.clone().lerp(cz, Math.pow(y, 0.32)) : ch.clone().lerp(cg, Math.pow(-y, 0.6));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false
  }));
  m.renderOrder = -1000;
  return m;
}

/* 低多边形起伏地表 */
function planeTerrain(W, D, SW, SD, hFn, cFn, jitter){
  var g = new THREE.PlaneGeometry(W, D, SW, SD);
  g.rotateX(-Math.PI / 2);
  var p = g.attributes.position;
  for (var i = 0; i < p.count; i++) p.setY(i, hFn(p.getX(i), p.getZ(i)));
  var ng = g.toNonIndexed();
  ng.computeVertexNormals();
  var np = ng.attributes.position, cols = [];
  var j = jitter == null ? 0.13 : jitter;
  for (var k = 0; k < np.count; k += 3){
    var cx = (np.getX(k) + np.getX(k+1) + np.getX(k+2)) / 3;
    var cz = (np.getZ(k) + np.getZ(k+1) + np.getZ(k+2)) / 3;
    var cy = (np.getY(k) + np.getY(k+1) + np.getY(k+2)) / 3;
    var col = new THREE.Color(shade(cFn(cx, cz, cy), 1 - j/2 + j*rnd()));
    for (var t = 0; t < 3; t++) cols.push(col.r, col.g, col.b);
  }
  ng.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  ng.computeVertexNormals();
  return ng;
}

/* 浮岛：起伏草皮顶盖 + 不规则车削岩体 */
function floatingIsland(opt){
  opt = opt || {};
  var R = opt.r, seg = opt.seg || 11;
  var g = new THREE.Group();
  var thick = opt.thick || 2.2;
  var bumpy = opt.bumpy == null ? 1 : opt.bumpy;
  var cliff = opt.cliff || 0x9AAE9C, rockC = opt.rock || 0x8FA6AC;

  /* 1) 草皮顶盖（边缘起伏、顶面微隆） */
  var cap = new THREE.CylinderGeometry(R*0.985, R, thick, seg, 1);
  var pp = cap.attributes.position;
  for (var i = 0; i < pp.count; i++){
    var x = pp.getX(i), y = pp.getY(i), z = pp.getZ(i);
    var ang = Math.atan2(z, x);
    var j = 1 + 0.075*Math.sin(ang*3.0 + R*0.7) + (rnd() - 0.5)*0.065*bumpy;
    pp.setX(i, x*j); pp.setZ(i, z*j);
    if (y > 0) pp.setY(i, y + (rnd() - 0.55)*0.30*bumpy);
  }
  cap.computeVertexNormals();
  var capMesh = new THREE.Mesh(cap, M(opt.top, { emissive: shade(opt.top, 0.20), ei: 1 }));
  capMesh.castShadow = capMesh.receiveShadow = true;
  g.add(capMesh);

  /* 2) 岩体：车削体（顶部宽、腰部微鼓、底部收尖） */
  var H = opt.coneH || 12;
  var prof = [], nP = 7;
  for (var s = nP; s >= 0; s--){
    var t = s/nP;
    var rad = R * (1 - Math.pow(t, 0.90)*0.965);
    /* 双频扰动：让岩体轮廓出现"层叠台阶"而不是光滑圆锥（参考图浮岛底部是分层的岩石锥） */
    rad *= 1 + 0.16*Math.sin(t*5.1 + R*0.9) + 0.09*Math.sin(t*11.3 + R*2.1);
    rad *= 1 + 0.13*Math.sin(t*Math.PI);
    if (s === 0) rad = R*0.995;
    prof.push(new THREE.Vector2(Math.max(R*0.045, rad), -thick/2 - t*H));
  }
  var rockGeo = new THREE.LatheGeometry(prof, seg);
  var rp = rockGeo.attributes.position;
  for (var k = 0; k < rp.count; k++){
    var s2 = 1 + (rnd() - 0.5)*0.18*bumpy;
    rp.setX(k, rp.getX(k)*s2); rp.setZ(k, rp.getZ(k)*s2);
  }
  rockGeo.computeVertexNormals();
  /* 岩体贴地层条纹贴图（LatheGeometry 的 v 恰好沿剖面自上而下，最适合做岩层） */
  var rockMat = M(rockC, { emissive: shade(rockC, 0.28), ei: 1,
    map: ptex('islrock', shade(rockC, 1.14), shade(rockC, 0.58), { bands: 13, n: 36 }) });
  var rockMesh = new THREE.Mesh(rockGeo, rockMat);
  rockMesh.castShadow = true;
  g.add(rockMesh);

  /* 3) 岩块碎屑 */
  var n = opt.chunks == null ? 5 : opt.chunks;
  for (var c2 = 0; c2 < n; c2++){
    var a2 = rr(0, 6.283), rad2 = R*rr(0.32, 0.90);
    var ch = add(g, new THREE.IcosahedronGeometry(rr(0.6,1.5)*(R/12), 0), M(shade(cliff, rr(0.84,1.10))),
      Math.cos(a2)*rad2, -thick/2 - rr(0.6, H*0.72), Math.sin(a2)*rad2);
    ch.rotation.set(rr(0,3), rr(0,3), rr(0,3));
  }
  return g;
}

function waterfall(w, h){
  var g = new THREE.Group();
  for (var i = 0; i < 3; i++){
    var m = add(g, new THREE.PlaneGeometry(w*(1 - i*0.20), h),
      M(0xEAF9FF, { transparent: true, opacity: 0.60 - i*0.14, side: THREE.DoubleSide,
                    emissive: 0xBFEFFF, ei: 0.60, depthWrite: false,
                    map: ptex('flow', 0xFFFFFF, 0xBFE4F5, { bands: 9, n: 14, rep: [1, 2] }) }),
      (i - 1)*w*0.22, -h/2, (i - 1)*0.20);
    m.userData.phase = i*1.7;
  }
  var mist = add(g, new THREE.SphereGeometry(w*0.72, 7, 5),
    M(0xFFFFFF, { transparent: true, opacity: 0.66, emissive: 0xEAF7FF, ei: 0.5, depthWrite: false }), 0, -h*0.02, 0);
  mist.scale.set(1, 0.45, 1);
  g.userData.mist = mist;
  /* 落点消散：底部两团由浓到淡的软雾，让瀑布"化进云里"而不是被硬切成一截矩形
     （纯几何追加，零 rnd 消耗 → 全场景随机序列与构图零漂移） */
  var tail = [];
  var tailSpec = [[0.90, 1.06, 0.50], [1.05, 1.50, 0.24]];
  for (var ti = 0; ti < tailSpec.length; ti++){
    var tp = tailSpec[ti];
    var tm = add(g, new THREE.SphereGeometry(w*tp[1], 8, 6),
      M(0xFFFFFF, { transparent: true, opacity: tp[2], emissive: 0xEAF7FF, ei: 0.5, depthWrite: false }),
      0, -h*tp[0], 0, { cast: false, recv: false });
    tm.scale.set(1, 0.55, 1);
    tm.userData.phase = ti*1.6; tm.userData.baseOpacity = tp[2];
    tail.push(tm);
  }
  g.userData.tail = tail;
  g.userData.isFall = true;
  return g;
}

function lowPolyTree(opt){
  opt = opt || {};

  var th = opt.h || 4;
  add(g, new THREE.CylinderGeometry(th*0.055, th*0.085, th*0.46, 5), M(opt.trunk || 0x8A6A52), 0, th*0.23, 0)
    .rotation.set(rr(-0.05,0.05), rr(0,3), rr(-0.05,0.05));
  var crownN = opt.crown || 3, baseC = opt.leaf || 0x5FA85A;
  /* 分层树冠：自下而上逐层收小、逐层提亮（模拟顶部受光），破除"三个球堆一起"的塑料感 */
  for (var i = 0; i < crownN; i++){

    var r = th*(0.31 - k*0.13) * rr(0.92, 1.08);

    .rotation.y = rr(0,3);
  g.userData.swayable = true;   /* 交给主循环做随风轻摆（不新增任何 draw call） */
  return g;
}

/* 花丛/灌木：贴地小色块，快速提升地表丰富度（参考图地面有大量开花矮丛） */
function bush(opt){

/* 低多边形小屋：白墙 + 彩色尖顶 + 发光窗（浮岛村落用） */
function lowPolyHouse(opt){

    add(g, new THREE.BoxGeometry(0.06, hh*0.30, d*0.34),

/* 冷蓝灰棱岩：参考图前景最有辨识度的点缀 */
function blueRock(opt){

    m.rotation.set(rr(0,1.2), rr(0,3), rr(0,1.2));
    m.scale.set(1, rr(0.72, 1.15), rr(0.85, 1.2));

function crystalCluster(opt){
  opt = opt || {};
  var g = new THREE.Group();
  var h = opt.h || 3.2;
  var sides = opt.sides || 6;
  var glow = opt.glow == null ? 0.30 : opt.glow;
  /* 单根晶体：棱面宝石（底大顶尖棱锥 + 八面体尖），整体高约 sc*2.0
     注意：本函数内部 rnd 消费次数保持不变（仅换几何/材质），保证各场景随机序列零漂移 */
  function shard(sc, x, z, col, tilt, slim){
    var grp2 = new THREE.Group();
    /* 柱身偏暗、尖顶提亮：形成"根暗尖亮"的宝石渐变；半透明出宝石质感 */
    var mat = M(col, { emissive: shade(col, 0.42), ei: 1, transparent: true, opacity: 0.92 });
    var matTip = M(shade(col, 1.18), { emissive: shade(col, 0.66), ei: 1, transparent: true, opacity: 0.92 });
    var rb = 0.40*sc*(slim ? 0.7 : 1.0), rt = 0.26*sc*(slim ? 0.7 : 1.0);
    var bodyH = sc*1.42;
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0, rb*1.35, bodyH, sides, 1), mat);
    body.position.y = bodyH*0.5;
    var tip = new THREE.Mesh(new THREE.OctahedronGeometry(sc*0.34, 0), matTip);
    tip.scale.set(0.8, 2.2, 0.8);
    tip.position.y = bodyH + sc*0.30;
    body.castShadow = tip.castShadow = true;
    grp2.add(body); grp2.add(tip);
    grp2.position.set(x, 0, z);
    grp2.rotation.set(tilt ? rr(-0.20,0.20) : 0, rr(0,6.283), tilt ? rr(-0.20,0.20) : 0);
    g.add(grp2);
    return grp2;
  }
  var main = shard(h*0.5, 0, 0, opt.color || 0x59D5ED, true, false);
  g.userData.main = main;
  var n = opt.n == null ? 3 : opt.n;
  for (var i = 0; i < n; i++){
    var a = rr(0, 6.283), d = rr(0.30, 0.90)*h*0.42;
    shard(h*rr(0.18, 0.34), Math.cos(a)*d, Math.sin(a)*d,
      (opt.color2 && rnd() < 0.5) ? opt.color2 : (opt.color || 0x59D5ED), true, rnd() < 0.4);
  }
  if (opt.n == null || opt.n < 6){
    for (var j = 0; j < 3; j++){
      var a2 = rr(0, 6.283), d2 = rr(0.5, 1.05)*h*0.42;
      shard(h*rr(0.08, 0.16), Math.cos(a2)*d2, Math.sin(a2)*d2,
        (opt.color2 || opt.color || 0x59D5ED), true, true);
    }
  }
  return g;
}

  for (var i = 0; i < specs.length; i++){
    var sp = specs[i], sc = h*sp[0]*0.5;
    var col = i < 3 ? cMain : cTip;

    body.position.y = sc*0.71;

    tip.scale.set(0.8, 2.2, 0.8); tip.position.y = sc*1.70;

/* 实体红岩拱（确定性，不消耗随机数）：参考图沙漠的巨型岩桥——极粗壮、下挂浮岩 */
function rockArch(){
  var g = new THREE.Group();
  var c = 0xCB7059;
  var mat = M(c, { emissive: shade(c, 0.24), ei: 1 });
  var mat2 = M(shade(c, 0.90), { emissive: shade(c, 0.22), ei: 1 });
  /* 实体粗拱 */
  add(g, new THREE.TorusGeometry(13.5, 6.5, 6, 20, Math.PI), mat, 0, 13.2, 0);
  /* 两条短拱脚——参考图里浮空岩体下缘是垂坠岩柱，不落地 */
  add(g, new THREE.CylinderGeometry(5.0, 6.4, 7, 7), mat, -13.5, 9.6, 0);
  add(g, new THREE.CylinderGeometry(5.0, 6.4, 7, 7), mat, 13.5, 9.6, 0);
  /* 沿拱线内外两排岩块，把拱完全包成岩桥 */
  for (var i = 0; i < 22; i++){
    var a = Math.PI * (i + 0.5) / 22;
    var row = i % 2;
    var rad = row ? 12.0 : 14.8;
    var ck = add(g, new THREE.IcosahedronGeometry(row ? 3.4 : 4.8, 0), row ? mat2 : mat,
      -Math.cos(a)*rad, 13.2 + Math.sin(a)*rad, row ? -2.2 : 2.2);
    ck.scale.set(1.3, 0.85, 1.15);
    ck.rotation.set(0.22, a*1.7, 0.12);
  }
  /* 拱顶脊线 */

  opt = opt || {};

  for (var i = 0; i < n; i++){

    var w = h*0.085, dx = Math.cos(a), dz = Math.sin(a), vi = pos.length/3;

    pos.push( dz*w, 0, -dx*w);
    pos.push(dx*lean*hh, hh, dz*lean*hh);
    col.push(cb.r,cb.g,cb.b, cb.r,cb.g,cb.b, ct.r,ct.g,ct.b);
    idx.push(vi, vi+1, vi+2);
  }
  var g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({

  var tailGrp = new THREE.Group();

  var segN = 8, segPts = [];
  for (var si = 0; si < segN; si++){

      0.05 + ft*1.05,

  /* 箭镞尾尖：沿末段切线方向的金锥 */
  var dTip = new THREE.Vector3().subVectors(segPts[7], segPts[6]);
  add(tailGrp, new THREE.ConeGeometry(0.13, 0.34, 4), mH,
    segPts[7].x + dTip.x*0.4, segPts[7].y + dTip.y*0.4, segPts[7].z + dTip.z*0.4,
    { rot: [0, 0, -Math.atan2(dTip.x, dTip.y)] });

  g.userData.height = 2.70;

function poseHero(h, mode, t, lift){
  var p = h.userData.parts;
  lift = lift || 0;
  if (mode === 'run'){
    var ph = t*10.5;
    p.armL.rotation.x = Math.sin(ph)*0.95; p.armR.rotation.x = -Math.sin(ph)*0.95;
    p.legL.rotation.x = -Math.sin(ph)*0.95; p.legR.rotation.x = Math.sin(ph)*0.95;
    h.rotation.z = Math.sin(ph)*0.045; h.rotation.x = 0.05;
    h.position.y = h.userData.baseY + lift + Math.abs(Math.sin(ph))*0.06;
  } else {
    var ph2 = t*1.9;
    p.armL.rotation.x = Math.sin(ph2)*0.10; p.armR.rotation.x = -Math.sin(ph2)*0.10;
    p.legL.rotation.x = 0.02; p.legR.rotation.x = -0.02;
    h.rotation.z = 0; h.rotation.x = 0;
    h.position.y = h.userData.baseY + lift + Math.sin(ph2)*0.045;
    p.head.rotation.y = Math.sin(t*0.6)*0.12;
  }
  for (var i = 0; i < p.tailSegs.length; i++){
    var s = p.tailSegs[i], tt = s.userData.t;
    /* 保留排布基准 x（userData.bx），在其上叠加逐节摆动 */
    s.position.x = (s.userData.bx || 0) + Math.sin(t*2.4 - tt*2.6)*(0.03 + tt*0.12);
  }
  if (p.tail) p.tail.rotation.y = Math.sin(t*1.3)*0.09;
}

function puffGeo(r, topC, botC){

function addClouds(S, color, n, minD, maxD, spanY, sizeMin, sizeMax, baseY, spread){
  var g = new THREE.Group();
  var sm = sizeMin || 2.4, sM = sizeMax || 5.6;
  var y0 = baseY == null ? 26 : baseY;
  /* 云更扁平柔和：竖向压得更扁、整体收小、底部颜色更淡 → 破除"气球团"感（对齐参考图柔软云）
     注意：puff 数量与 rr 调用次数必须与原实现完全一致，否则会打乱后续对象的随机序列 */
  var topC = color || 0xFFFFFF, botC = 0xCBD9EA;
  for (var i = 0; i < n; i++){
    var c = new THREE.Group();
    var puffs = ri(5, 8);
    for (var j = 0; j < puffs; j++){
      var r = rr(sm, sM);

      puff.position.set(rr(-22,22), rr(-1.7,1.7), rr(-6,6));

    var ang = rr(-1.45, 1.45), d = rr(minD, maxD);
    var yy = y0 + rr(0, spanY);
    c.position.set(Math.sin(ang)*d, yy, -Math.abs(Math.cos(ang))*d - 40 - (spread||0));
    g.add(c);

}

function bigPlanet(opt){
  opt = opt || {};
  var R = opt.r || 18;
  var g = new THREE.Group();
  var bodyC = opt.body || 0xC6DCF0, bandC = opt.band || 0xE3EFFA, ringC = opt.ring || 0xEAF2F8;
  var ringRot = opt.ringRot || [1.26, 0.24, 0.18];
  var NOFOG = { fog: false };

  /* 星球本体（纬度带贴图：顺手把此前一直没被读取的 opt.band 用起来） */
  var bodyTop = opt.band ? shade(bandC, 1.0) : shade(bodyC, 1.06);
  var body = new THREE.Mesh(new THREE.IcosahedronGeometry(R, 4),
    M(bodyC, { fog: false, emissive: shade(bodyC, 0.36), ei: 1,
               map: ptex('planet', bodyTop, shade(bodyC, 0.90), { bands: 5, size: 256 }) }));
  body.castShadow = false; body.receiveShadow = false;
  g.add(body);

  /* 纬度云带（贴合球面） */
  var bands = [[0.30,0.13],[0.53,0.09],[0.78,0.11],[1.14,0.08],[1.42,0.10],[1.86,0.07]];
  for (var b = 0; b < bands.length; b++){
    var sph = new THREE.SphereGeometry(R*1.006, 30, 3, 0, Math.PI*2, bands[b][0]*Math.PI, bands[b][1]*Math.PI);
    var bc = b % 2 ? shade(bodyC, 1.03) : shade(bodyC, 0.985);
    var band = new THREE.Mesh(sph, M(bc, { fog: false, emissive: shade(bc, 0.36), ei: 1 }));
    band.castShadow = false; band.receiveShadow = false;
    g.add(band);
  }

  /* 光环：多层同心环带 */
  var rbands = [[1.30, 1.62, 0.60], [1.66, 1.90, 0.40], [1.94, 2.08, 0.24]];
  for (var r2 = 0; r2 < rbands.length; r2++){
    var rg = new THREE.RingGeometry(R*rbands[r2][0], R*rbands[r2][1], 72, 1);
    var rm = new THREE.Mesh(rg, basic(ringC, {
      transparent: true, opacity: rbands[r2][2], side: THREE.DoubleSide, depthWrite: false, fog: false }));
    rm.rotation.set(ringRot[0], ringRot[1], ringRot[2]);
    rm.renderOrder = -5;
    g.add(rm);
  }
  /* 环外缘高光 */
  var edge = new THREE.Mesh(new THREE.TorusGeometry(R*1.90, R*0.012, 3, 72), M(0xFFFFFF, NOFOG));
  edge.rotation.set(ringRot[0], ringRot[1], ringRot[2]);

  return g;

/* 漂浮光尘：加性点云，逐帧缓慢上浮 + 横向漂移（参考图大量光点/尘埃是画面质感关键） */
function motes(opt){
  opt = opt || {};
  var n = opt.n || 90, col = opt.color || 0xFFFFFF;
  var w = opt.w || 60, y0 = opt.y0 == null ? 1 : opt.y0, y1 = opt.y1 == null ? 20 : opt.y1;
  var z0 = opt.z0 == null ? 2 : opt.z0, z1 = opt.z1 == null ? 120 : opt.z1;
  var pos = new Float32Array(n*3), base = new Float32Array(n*3);

  for (var i = 0; i < n; i++){
    base[i*3]   = rr(-w, w);
    base[i*3+1] = rr(y0, y1);

    ph[i] = rr(0, 6.283); sp[i] = rr(0.22, 0.75);

  pts.frustumCulled = false;
  pts.userData.base = base; pts.userData.ph = ph; pts.userData.sp = sp;

/* 分段石环遗迹（确定性，不消耗随机数）：参考图家园的粗壮灰白巨环，由一段段石块砌成 */
function ringMonument(){
  var g = new THREE.Group();
  var stone = 0xEDEAE0;
  var N = 16, R = 6.2;
  for (var i = 0; i < N; i++){
    var a = i / N * Math.PI * 2;
    /* 段间留缝读出"分段砌筑"；三档明差模拟石块错落；轴向切向（rotation.z = a） */
    var shadeK = [1.0, 0.94, 1.06][i % 3];
    var seg = add(g, new THREE.CylinderGeometry(0.88, 0.98, 2.05, 5),
      M(shade(stone, shadeK), { emissive: shade(stone, shadeK*0.24), ei: 1 }),
      Math.cos(a)*R, Math.sin(a)*R, 0);
    seg.rotation.z = a;
  }
  /* 内圈青蓝发光细环 */
  add(g, new THREE.TorusGeometry(5.5, 0.20, 4, 36),
    M(0x6FD8F0, { emissive: 0x4FC4E8, ei: 0.45 }));
  return g;
}

function h2(x,z){ return (Math.abs(Math.sin(x*12.9898 + z*78.233)*43758.5453)) % 1; }
function fbmv(x,z,s){
  var gx = Math.floor(x*s), gz = Math.floor(z*s);
  var fx = x*s-gx, fz = z*s-gz;
  var ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  var a = h2(gx,gz), b = h2(gx+1,gz), c = h2(gx,gz+1), d = h2(gx+1,gz+1);
  return (a*(1-ux)+b*ux)*(1-uz) + (c*(1-ux)+d*ux)*uz;
}

  var isl = floatingIsland({ r: 7.8, seg: 12, top: 0x83C15F, cliff: 0xDEE3D7, rock: 0xD4D6C4,
                             thick: 1.6, coneH: 8.5, chunks: 6, bumpy: 1.0 });
  isl.position.set(19.5, 9.0, -24);

  /* 岩体地层带：草皮下方两圈浅→深色岩层，破除"白萝卜"式的单调岩体 */
  add(isl, new THREE.CylinderGeometry(7.90, 7.55, 1.05, 12, 1),
    M(0xC5D4C4, { emissive: shade(0xC5D4C4, 0.22), ei: 1 }), 0, -1.05, 0);
  add(isl, new THREE.CylinderGeometry(7.00, 6.60, 1.25, 12, 1),
    M(0x9FB4A4, { emissive: shade(0x9FB4A4, 0.20), ei: 1 }), 0, -2.45, 0);
  /* 岛顶村落：紫顶小屋 + 发光窗（对应参考图岛上的紫顶建筑群）
     参考图村落屋顶是粉 / 蓝 / 紫 / 白混色，而非单一紫系；pick() 只消耗一次 rnd，
     扩色板不改变随机调用次数 → 布局零漂移 */
  var ROOFS = [0xB79BE0, 0xA98AD8, 0xD79BC8, 0x9E86D6, 0xC9A2E4,
               0x8FC4EC, 0xE8A0C0, 0xF2EEE6, 0x9FD8E8];
  for (var b = 0; b < 11; b++){

  /* 小圆顶观测屋 */

  /* 储罐 / 天线杆，打破屋顶轮廓的单一性 */
  for (var tn = 0; tn < 5; tn++){

    add(isl, new THREE.CylinderGeometry(rr(0.18,0.30), rr(0.20,0.32), th2, 7),

  /* 岛顶增补：白墙紫顶小楼 ×6 + 紫粉树 ×3（确定性坐标，不消耗随机数） */
  var fixB = [[3.5,-2.2,1.5,1.3],[-2.8,3.0,1.7,1.1],[4.2,2.6,1.3,1.4],
              [-4.4,-1.6,1.1,1.0],[1.2,-3.6,1.6,1.2],[-1.6,-3.0,1.2,1.35]];
  for (var fbi = 0; fbi < fixB.length; fbi++){

    var bld = new THREE.Group();
    add(bld, new THREE.BoxGeometry(bp[2], bp[3], bp[2]*0.9),
      M(0xF3EFE6, { emissive: shade(0xF3EFE6, 0.24), ei: 1 }), 0, bp[3]/2, 0);
    add(bld, new THREE.ConeGeometry(bp[2]*0.8, bp[3]*1.05, 7),

    add(bld, new THREE.BoxGeometry(bp[2]*0.3, bp[3]*0.3, 0.05),

  var fixT = [[5.2,1.4,0xB07BE0],[-5.0,0.8,0xD07BB8],[0.2,4.6,0xB07BE0]];
  for (var fti = 0; fti < fixT.length; fti++){

    add(tr3, new THREE.CylinderGeometry(0.10, 0.14, 0.8, 5), M(0x7A5F72), 0, 0.40, 0);

    add(tr3, new THREE.IcosahedronGeometry(0.40, 0),

    tr3.position.set(tp2[0], 0.5, tp2[1]);
    isl.add(tr3);

  /* 瀑布（自右侧岛缘垂落，参考图岛右缘的宽瀑布很醒目） */
  var wf = waterfall(3.6, 26);
  wf.position.set(-3.2, -3.4, -6.2); isl.add(wf); S.userData.wf = wf;
  var wf2 = waterfall(2.6, 20);
  wf2.position.set(6.0, -2.6, 3.0); isl.add(wf2);

  wf3.position.set(7.5, -3.0, -2.0); isl.add(wf3);

  /* 中景小浮岛：屏幕 ~ (0.28, 0.40) */
  var mid = floatingIsland({ r: 2.6, seg: 9, top: 0x83C15F, cliff: 0xCCD8D3, rock: 0xB4C3C0,

  mid.position.set(-14.5, 8.2, -34); S.add(mid);
  var mt = lowPolyTree({ h: 1.6, leaf: 0x83C15F }); mt.position.y = 0.4; mid.add(mt);
  add(mid, new THREE.CylinderGeometry(0.22, 0.26, 1.0, 6), M(0xE9F0F1), 0.6, 1.0, 0.2);

  /* 远处小浮岛 */
  for (var k = 0; k < 12; k++){
    /* 远景小浮岛：收小 + 推远，避免中景天空被碎岛塞满（参考图天际留白更多） */
    var ang = rr(-1.05, 1.05), dist = rr(62, 195);
    var small = floatingIsland({ r: rr(0.8, 1.9), seg: 8, top: 0x83C15F, cliff: 0xC2CFC6, rock: 0xB2BEB4,
                                 thick: 0.5, coneH: rr(2.4,5.0), chunks: 2, bumpy: 1 });
    small.position.set(Math.sin(ang)*dist, rr(4, 30), -Math.abs(Math.cos(ang))*dist - 22);

    small.traverse(function(o){ o.castShadow = false; }); /* 远景不参与阴影，省渲染 */
    S.add(small);
  }

  /* 巨大环形星球：参考图屏幕 ~ (0.49, 0.19)，直径约画面宽 36%
     构图校正：r 30→25（原版偏大约 40%）、x -31→-16（原版偏左，屏幕中心 0.41→约 0.49）、
     y 104→112（略微上移）。bigPlanet 零 rnd → 不影响 heroC */
  var pl = bigPlanet({ r: 25, body: 0xD3B4E2, band: 0xF0E2F6, ring: 0xF7ECFA, ringRot: [1.44, 0.26, 0.30] });
  pl.position.set(-16, 112, -205); S.add(pl);
  /* 右上小环星：屏幕 ~ (0.80, 0.10) */
  var pl2 = bigPlanet({ r: 7.5, body: 0xD3E5F3, band: 0xEFF6FC, ring: 0xF4F9FC, ringRot: [1.40, -0.20, -0.30] });
  pl2.position.set(114, 102, -252); S.add(pl2);

  addClouds(S, 0xFFFFFF, 12, 60, 250, 78, 3.0, 7.2, 22);
  addClouds(S, 0xFFFFFF, 7, 130, 330, 30, 5.2, 10.0, 14);

  var hero = createDragonAstronaut();
  hero.scale.setScalar(1.22);
  hero.userData.baseY = gh(0.55, 1.30) + 0.10;
  hero.position.set(0.55, hero.userData.baseY, 1.30);
  hero.rotation.y = 0.26;
  S.add(hero);

  /* 英雄旁的黄色晶体 + 右下粉青晶簇（参考图前景水晶为粉+青色系）
     C5 构图校正：右下晶簇原在 (9.0,·,3.2)，投影到屏幕 x≈1.09（出画、几乎不可见）；
     移至 (7.2,·,2.4)（屏幕 ≈0.90/0.94）并放大 h1.8→2.4。仅改参数/坐标，
     crystalCluster 内 rnd 调用次数不变 → 全局随机序列零漂移。 */
  var yc = crystalCluster({ h: 1.1, color: 0xE7BE55, color2: 0xF0D27A, n: 2, sides: 5, glow: 0.5 });
  yc.position.set(-1.15, gh(-1.15, 1.15), 1.15); S.add(yc);
  var pk = crystalCluster({ h: 1.7, color: 0xF06FB4, color2: 0x8FD8EE, n: 3, sides: 5, glow: 0.5 });
  pk.position.set(7.6, gh(7.6, 3.0), 3.0); S.add(pk);
  /* 近景右下亮粉晶簇：补参考图底缘的粉色水晶焦点（gemCluster 确定性、零 rnd 消耗） */
  var pkA = gemCluster(1.5, 0xF06FB4, 0xF7B0D8, 0.90);
  pkA.position.set(6.6, gh(6.6, 2.0), 2.0); S.add(pkA);
  var pkB = gemCluster(1.1, 0xF08FC0, 0xF7C6E4, 0.85);
  pkB.position.set(8.8, gh(8.8, 3.2), 3.2); S.add(pkB);
  /* 晶簇脚下粉色光晕（确定性：单面色片，呼应既有 gemCluster 用法） */
  add(S, new THREE.PlaneGeometry(7, 7),
    basic(0xF06FB4, { transparent:true, opacity:0.26, additive:true, depthWrite:false }),
    7.3, gh(7.3, 2.6) + 0.10, 2.6, { rot:[-Math.PI/2,0,0], cast:false, recv:false }).renderOrder = 1;

  /* S3 生命感：飘落花瓣 + 高空鸟群（走 dseq 独立随机流，零全局 rnd → 构图零漂移） */
  var petals = petalFall({ n: 70, color: 0xFFC2E4, w: 24, y0: 0.2, y1: 13, z0: 2, z1: 44,
                           size: 0.34, opacity: 0.92, seed: 0x7E01 });
  S.add(petals);
  var petals2 = petalFall({ n: 34, color: 0xFFF0B8, w: 30, y0: 3, y1: 18, z0: 22, z1: 92,
                            size: 0.28, opacity: 0.58, seed: 0x7E02 });
  S.add(petals2);
  var birds = birdFlock({ n: 7, color: 0x46536A, cx: -2, cy: 26, cz: -54,
                          r: 30, speed: 0.11, seed: 0xB101 });
  S.add(birds);

  /* 漂浮光尘：暖色花粉 + 远处粉色微粒 */
  var mt1 = motes({ n: 110, color: 0xFFE7A8, w: 34, y0: 0.5, y1: 15, z0: 2, z1: 62, size: 0.26, opacity: 0.85 });
  S.add(mt1);
  var mt2 = motes({ n: 60, color: 0xFFC2E4, w: 40, y0: 2, y1: 22, z0: 20, z1: 110, size: 0.34, opacity: 0.55 });
  S.add(mt2);
  S.userData.motes = [mt1, mt2];

  return { scene: S, hero: hero, runnable: false };
}

/* ============================================================== DESERT ==== */
function buildDesert(){
  var S = new THREE.Scene();
  S.background = new THREE.Color(0x5E9CD8);
  S.fog = new THREE.Fog(0xEBD2DC, 85, 470);
  S.add(makeSky(0x4590D8, 0x86B4E8, 0xE8C4D6));

  S.add(new THREE.HemisphereLight(0xDCEBFF, 0xC98D92, 0.48));
  var sun = new THREE.DirectionalLight(0xFFF2DC, 0.95);
  sun.position.set(-60, 100, 30); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  var sd = 30;
  sun.shadow.camera.left=-sd; sun.shadow.camera.right=sd; sun.shadow.camera.top=sd; sun.shadow.camera.bottom=-sd;
  sun.shadow.camera.near=1; sun.shadow.camera.far=280; sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.05;
  S.add(sun); S.add(sun.target); S.userData.sun = sun;
  var fill = new THREE.DirectionalLight(0xFFE2DC, 0.22); fill.position.set(20, 18, 44); S.add(fill);

  function dh(x,z){
    var h = Math.sin(z*0.042)*2.3 + Math.cos(x*0.058)*1.9 + Math.sin(x*0.105 - z*0.075)*1.0;
    var d = sstep((-z - 8)/120);
    var ridge = Math.abs(Math.sin(x*0.085 + z*0.05))*1.4*d;
    var ridge2 = Math.sin(x*0.021 + z*0.017)*3.1*d;
    return h*(0.40 + 1.20*d) + ridge + ridge2 - d*4.2;
  }
  function dcol(x,z,y){
    var n = fbmv(x,z,0.05), n2 = fbmv(x+90, z-60, 0.13), n3 = fbmv(x-140, z+30, 0.22);
    var col;
    /* 珊瑚粉家族（规范主色 #EE7C80）：浅橙沙 / 暖粉 / 主珊瑚 / 深玫 / 亮珊瑚
       保持原饱和度（调色采样 s≈44 与参考一致），靠提高明度基线把整体抬到参考的亮沙面 */
    if (n3 > 0.94) col = 0xE8967A;
    else if (n2 > 0.88) col = 0xD8828A;
    else if (n > 0.66) col = 0xF08A84;
    else if (n < 0.34) col = 0xBE617C;
    else col = 0xEE7C80;
    /* 依高度做明暗分离：丘顶亮、丘谷暗，沙丘层次才出得来 */
    return shade(col, 0.85 + clamp((y || 0)*0.05, -0.16, 0.18));
  }
  var dm = new THREE.Mesh(planeTerrain(420, 340, 56, 48, dh, dcol, 0.13),
    new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, map: sandTex() }));
  dm.position.z = -150; dm.receiveShadow = true; dm.castShadow = true;
  S.add(dm);

  /* 大块岩石台地 */
  for (var i = 0; i < 46; i++){
    var side = rnd() < 0.5 ? -1 : 1;
    var x = side*rr(7, 95), z = -rr(2, 260), y = dh(x,z), r = rr(1.4, 5.2);
    var rock = add(S, new THREE.IcosahedronGeometry(r, 0), M(shade(0xCF8792, rr(0.88,1.14))), x, y + r*rr(0.2,0.55), z);
    rock.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    rock.scale.set(1, rr(0.7,1.5), 1);
  }
  /* 两侧大体量红岩墙：搭出参考图的峡谷围合感（参考图两侧岩壁占到 y18–50%） */
  for (var i3 = 0; i3 < 10; i3++){
    var sg3 = rnd() < 0.5 ? -1 : 1;
    var cxx = sg3*rr(26, 78), czz = -rr(6, 120);
    var mound = add(S, new THREE.IcosahedronGeometry(rr(4.5, 9.5), 0),
      M(shade(0xCF8790, rr(0.90, 1.10))), cxx, dh(cxx, czz) + rr(0.5, 2.5), czz);
    mound.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    mound.scale.set(rr(0.95,1.5), rr(1.7, 2.8), rr(0.95,1.5));
  }
  /* 散布的碎石堆 */
  for (var i4 = 0; i4 < 40; i4++){
    var sg4 = rnd() < 0.5 ? -1 : 1;
    var sxx = sg4*rr(4, 60), szz = -rr(2, 150);
    var peb = add(S, new THREE.IcosahedronGeometry(rr(0.35, 1.05), 0),
      M(shade(0xD79DA4, rr(0.88, 1.16))), sxx, dh(sxx, szz) + rr(0.05, 0.3), szz);
    peb.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    peb.scale.set(1, rr(0.6, 1.0), 1);
  }
  for (var i2 = 0; i2 < 12; i2++){
    var s2 = rnd() < 0.5 ? -1 : 1;
    var x2 = s2*rr(14, 70), z2 = -rr(10, 230);
    var mh = rr(7, 14);   /* 台地加高 → 与两侧岩墙一起围合出峡谷纵深 */
    var mesa = add(S, new THREE.CylinderGeometry(rr(4.0,8.5), rr(5.5,11.0), mh, ri(6,9), 1),
      M(shade(0xC98793, rr(0.92,1.08))), x2, dh(x2,z2) + rr(1,3) + mh*0.5 - 3, z2);
    mesa.rotation.y = rr(0,3);
    add(S, new THREE.CylinderGeometry(rr(3.5,7.5), rr(4.8,10.0), 0.6, ri(6,9), 1),
      M(0xF7AC86), x2, mesa.position.y + mh*0.5 + rr(1.6,4.6) - 3, z2).rotation.y = mesa.rotation.y + 0.2;
  }

  /* 红橙树 */
  for (var t = 0; t < 26; t++){
    var st = rnd() < 0.5 ? -1 : 1;
    var tx = st*rr(5, 52), tz = -rr(2, 170);
    var tree = lowPolyTree({ h: rr(2.6, 6.4), leaf: pick([0xEE6B72, 0xE6816B, 0xF1797F, 0xD75F6E]),
                             trunk: 0x8A5A62, crown: 3, tall: rnd() < 0.5 });
    tree.position.set(tx, dh(tx,tz), tz);
    tree.scale.setScalar(rr(0.9, 1.6));
    S.add(tree);
  }
  /* 晶簇 */
  for (var c = 0; c < 16; c++){
    var sc = rnd() < 0.5 ? -1 : 1;
    var cx = sc*rr(4, 42), cz = -rr(4, 140);
    var cl = crystalCluster({ h: rr(1.6, 4.0), color: 0x58D7EF, color2: 0xD85CEA, n: 3, sides: 5 });
    cl.position.set(cx, dh(cx,cz), cz);
    S.add(cl);
  }
  /* 两簇地标级大水晶：左蓝右紫（参考图沙漠的中景视觉锚点） */
  var bc1 = crystalCluster({ h: 6.8, color: 0x58D7EF, color2: 0x9FE9F6, n: 4, sides: 6 });
  bc1.position.set(-11.0, dh(-11.0, -27), -27); S.add(bc1);
  var bc2 = crystalCluster({ h: 5.4, color: 0xD85CEA, color2: 0xB06EE8, n: 3, sides: 6 });
  bc2.position.set(12.0, dh(12.0, -36), -36); S.add(bc2);

  /* S2 细节层：石林 / 立石岩柱（参考图沙丘之间竖立的岩柱）——走 dseq 独立随机流 */
  var Rr = dseq(0x3E11);
  for (var rp2 = 0; rp2 < 10; rp2++){
    var rside = (rp2 % 2) ? 1 : -1;
    var rx2 = rside*(10 + Rr()*52), rz2 = -6 - Rr()*130;
    var rspH = 2.4 + Rr()*5.6;
    var rsp = rockSpire(rspH, (Rr() < 0.5 ? 0xD06F55 : 0xC98793), dseq(0xA00 + rp2));
    rsp.position.set(rx2, dh(rx2, rz2), rz2); S.add(rsp);
  }

  /* 浮空巨岩拱：屏幕 ~ (0.45, 0.28) —— 参考图顶部悬空岩体（x22-68%, y10-50%），
     下方留出天空与远地平线；走浮空可避免远距离投在地上的脱节阴影 */
  var arch = rockArch();
  arch.position.set(1.0, dh(1,-118) + 21.0, -118);
  arch.scale.set(2.20, 1.50, 1.26);   /* 对齐参考图顶部浮空岩体的屏幕占比：宽≈42%、高≈30% */
  arch.traverse(function(o){ o.castShadow = false; });
  S.add(arch);
  /* 旧随机拱块共消耗 319 次 rnd，burn 对齐保证其后布局零漂移 */
  for (var _b2 = 0; _b2 < 319; _b2++) rnd();

  /* 环门 + 能量柱：屏幕 ~ (0.50, 0.46) —— 参考图远端地平线上的小石环，收小并推远 */
  var gate = ringGate({ r: 6.4, tube: 1.0, seg: 34, frame: 0xEDE6DA, glow: 0.55 });
  gate.position.set(-1.2, dh(-1.2,-84) + 15.5, -84);
  S.add(gate);

  var beam = new THREE.Group();
  add(beam, new THREE.CylinderGeometry(1.0, 1.7, 150, 18, 1, true),
    basic(0x9FEBFF, { transparent:true, opacity:0.15, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    0, 75, 0, { cast:false, recv:false });
  add(beam, new THREE.CylinderGeometry(0.45, 0.8, 150, 14, 1, true),
    basic(0xEAFBFF, { transparent:true, opacity:0.22, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    0, 75, 0, { cast:false, recv:false });
  beam.position.set(-1.2, dh(-1.2,-84) + 3, -84);
  S.add(beam); S.userData.beam = beam;

  /* 远处浮岛（珊瑚粉岩体） */
  for (var f = 0; f < 6; f++){
    var fi = floatingIsland({ r: rr(3,9), seg:8, top:0x7FB070, cliff:0xB07C8A, rock:0xB2798A,
                              thick:1.2, coneH:rr(6,12), chunks:2, bumpy:1 });
    fi.position.set(rr(-300,300), rr(38,110), -rr(180,420));
    fi.traverse(function(o){ o.castShadow = false; }); /* 远景不参与阴影 */
    S.add(fi);
  }
  /* 中天红浮岩已删（参考图沙漠天空无漂浮岩块）——burn 81 次对齐随机序列 */
  for (var _b1 = 0; _b1 < 81; _b1++) rnd();
  addClouds(S, 0xFFFFFF, 16, 130, 340, 200, 3.8, 8.6, 40);

  /* 峡谷围合岩壁：参考图左右两侧的高岩壁（约 x0–20% / x80–100%，y15–50%）。
     走 dseq 独立随机流 → 对全局 rnd 零消耗，四场景构图零漂移 */
  var Rw = dseq(0x7A11);
  var WALLS = [[-46, -58], [46, -58], [-70, -112], [70, -112]];
  /* [dx, 半径系数, y 中心系数, x 拉伸, y 拉伸] —— 六块碎石堆出锯齿状岩壁轮廓 */
  var lumpSpec = [[  0, 1.00, 2.80, 1.20, 2.80],
                  [ -6, 0.70, 2.20, 1.15, 2.60],
                  [  6, 0.66, 2.40, 1.15, 2.50],
                  [ -7, 0.52, 1.70, 1.15, 2.40],
                  [  7, 0.55, 1.90, 1.15, 2.40],
                  [  2, 0.46, 3.20, 1.20, 2.30]];
  for (var wi = 0; wi < WALLS.length; wi++){
    var wx = WALLS[wi][0], wz = WALLS[wi][1];
    var wy = dh(wx, wz);
    var wR = wi < 2 ? 7.5 : 9.0;
    var wc = shade(0xD98F94, 0.98 + Rw()*0.10);   /* 珊瑚粉：参考图两侧岩壁是受光的亮珊瑚色 */
    for (var wl = 0; wl < lumpSpec.length; wl++){
      var lp = lumpSpec[wl];
      var lm = add(S, new THREE.IcosahedronGeometry(wR * lp[1], 0),
        M(wc, { emissive: shade(wc, 0.16), ei: 1 }),
        wx + lp[0], wy + wR*lp[2], wz + (wl % 3 ? 3 : -3));
      lm.rotation.set(0, Rw()*3, 0);
      lm.scale.set(lp[3], lp[4], 1.15);
    }
  }

  var hero = createDragonAstronaut();
  hero.scale.setScalar(1.50);
  hero.userData.baseY = dh(0.6, -1.5);
  hero.position.set(0.6, hero.userData.baseY, -1.5);
  hero.rotation.y = 0.06;
  S.add(hero);

  /* 风沙光尘：近处细密、远处稀疏 */
  var mtD1 = motes({ n: 120, color: 0xFFDCA8, w: 40, y0: 0.5, y1: 16, z0: 2, z1: 70, size: 0.28, opacity: 0.80 });
  S.add(mtD1);
  var mtD2 = motes({ n: 70, color: 0xFFF0D8, w: 60, y0: 3, y1: 34, z0: 40, z1: 150, size: 0.42, opacity: 0.50 });
  S.add(mtD2);
  S.userData.motes = [mtD1, mtD2];

  /* ========================================================================
     M1 · 可玩闭环内容（GDD §4.6）：贴地函数导出 + 3 颗可采晶体 + 传送激活台 + 落地波纹
     全部走 dseq / 纯参数 ⇒ 对全局 rnd() 零消耗，既有构图零漂移 */
  S.userData.ground = dh;                       /* 供 PlayerController 做贴地采样 */

  var Rg = dseq(0xC011);                         /* §7.5-4 指定种子：独立随机流 */
  var _gemCols = [[0x58D7EF, 0xD85CEA], [0xD85CEA, 0x9FE9F6], [0x58D7EF, 0xB06EE8]];
  var gems = [];
  for (var gi = 0; gi < M1_GEMS.length; gi++){
    var gx = M1_GEMS[gi][0], gz = M1_GEMS[gi][1];
    var gm = musicShard(_gemCols[gi][0], _gemCols[gi][1], 0.9 + Rg()*0.2);
    var gy = dh(gx, gz);
    gm.position.set(gx, gy + 1.2, gz);
    gm.rotation.y = Rg()*6.283;
    gm.userData.groundY = gy;
    gm.userData.phase = Rg()*6.283;
    gm.userData.rotY0 = gm.rotation.y;
    gm.userData.taken = false;
    Collectible.register(gm);
    S.add(gm); gems.push(gm);
  }
  S.userData.gems = gems;

  var pad = portalPad(2.6);
  pad.position.set(M1_PAD[0], dh(M1_PAD[0], M1_PAD[1]) + 0.02, M1_PAD[1]);
  S.add(pad); S.userData.pad = pad;

  VFX.attach(S);                                 /* 1 落地波纹 + 3 收集波纹池（默认隐藏，不占 draw call）*/

  return { scene: S, hero: hero, runnable: true };
}

/* ================================================================ CAVE ==== */
function buildCave(){
  var S = new THREE.Scene();
  S.background = new THREE.Color(0x102544);
  S.fog = new THREE.FogExp2(0x1B3460, 0.0098);
  S.add(makeSky(0x0B1734, 0x1B3563, 0x0A1330));

  S.add(new THREE.HemisphereLight(0x5E92C8, 0x1A2C46, 0.53));
  var shaft = new THREE.DirectionalLight(0xCBE8FA, 0.98); shaft.position.set(-5, 60, -14); S.add(shaft);
  var rim = new THREE.DirectionalLight(0x8FC4F4, 0.32); rim.position.set(30, 16, 22); S.add(rim);
  var fill = new THREE.DirectionalLight(0xA8CEF2, 0.26); fill.position.set(6, 12, 40); S.add(fill);

  function chh(x,z){
    var d = sstep((-z)/90);
    return Math.sin(x*0.16)*0.45 + Math.cos(z*0.11)*0.5 - d*2.4;
  }
  function ccol(x,z){
    var n = fbmv(x,z,0.06);
    if (n > 0.70) return 0x1E4F67;
    if (n < 0.34) return 0x10263B;
    return 0x15394F;
  }
  var fm = new THREE.Mesh(planeTerrain(130, 220, 42, 48, chh, ccol, 0.15),
    new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true, map: terrainTex() }));
  fm.position.z = -70; fm.receiveShadow = true;
  S.add(fm);

  /* 道路中心冷光引导带（近处更亮） */
  for (var g = 0; g < 26; g++){
    var gz = -3 - g*5.0;
    var st = add(S, new THREE.PlaneGeometry(1.7 + Math.sin(g*0.7)*0.7, 3.6),
      basic(0x7FE0F8, { transparent:true, opacity: Math.max(0.04, 0.24 - g*0.009), additive:true, depthWrite:false }),
      0.4, chh(0.4, gz) + 0.14, gz, { rot:[-Math.PI/2,0,0], cast:false, recv:false });
    st.renderOrder = 1;
  }

  /* 洞壁与洞顶 */
  var wall = new THREE.Group();
  for (var i = 0; i < 74; i++){
    var side = rnd() < 0.5 ? -1 : 1;
    var r = rr(2.4, 7.6);
    var wx = side*rr(9, 48), wy = rr(-3, 24), wz = -rr(3, 200);
    /* 上层走廊（|x|<20 且 z>-85）不放高位岩块，避免挡住倒挂晶簇 */
    if (wy > 12 && wz > -85 && Math.abs(wx) < 20 && rnd() < 0.8) continue;
    var rock = add(wall, new THREE.IcosahedronGeometry(r, 0), M(shade(pick([0x31508A, 0x3E3678, 0x27406E]), rr(0.80,1.28))),
      wx, wy, wz);
    rock.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    rock.scale.set(rr(0.8,1.3), rr(0.9,1.6), rr(0.8,1.3));
  }
  for (var j = 0; j < 42; j++){
    var ccx = rr(-42, 42), ccz = -rr(-10, 200);
    /* 天光柱走廊上方留出开口，倒挂晶簇才读得到 */
    if (Math.abs(ccx) < 15 && ccz > -78) continue;
    var cw = add(wall, new THREE.IcosahedronGeometry(rr(5,12), 0), M(shade(pick([0x1C2E54, 0x272556]), rr(0.76,1.14))),
      ccx, rr(25, 42), ccz);
    cw.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    cw.scale.set(1, rr(0.6,1.0), 1);
  }
  S.add(wall);

  /* S2 细节层：石笋 + 倒挂钟乳（低面数岩溶造型，刻意区别于发光晶体）
     走 dseq 独立随机流，零全局 rnd → 既有晶体布局与构图零漂移 */
  var Rs = dseq(0x55A1);
  for (var st2 = 0; st2 < 14; st2++){
    var sside = (st2 % 2) ? 1 : -1;
    var sx = sside*(4.5 + Rs()*27), sz = -4 - Rs()*124;
    var smc = stalagmite(1.0 + Rs()*2.8, (Rs() < 0.5 ? 0x3E638F : 0x33547C), dseq(0x900 + st2));
    smc.position.set(sx, chh(sx, sz), sz); S.add(smc);
  }
  for (var shc = 0; shc < 7; shc++){
    var shx = (Rs()*2 - 1)*20, shz = -6 - Rs()*70;
    var smt = stalagmite(1.3 + Rs()*2.4, 0x2E4E76, dseq(0x980 + shc));
    smt.position.set(shx, 20.5 - Rs()*2.5, shz);
    smt.rotation.x = Math.PI; smt.rotation.z = (Rs() - 0.5)*0.2;
    S.add(smt);
  }

  /* 顶部天光柱：屏幕 x ~0.42 */
  /* 天光柱：三层同心锥体叠加（外缘淡蓝薄雾 / 中段亮青 / 内芯近白），
     加性叠加让光束沿视线累积变亮 —— 参考图洞顶中央是全场最亮的区域（v≈93） */
  var beam = new THREE.Group();
  var b1 = beamCone(3.4, 8.6, 66, 0xCFE6FF, 0x08142A, 0.30); b1.position.set(0, 32, 0); beam.add(b1);
  var b2 = beamCone(1.7, 4.6, 66, 0xEEF7FF, 0x0C1B36, 0.34); b2.position.set(0, 32, 0); beam.add(b2);
  var b3 = beamCone(0.5, 1.6, 66, 0xFFFFFF, 0x122444, 0.40); b3.position.set(0, 32, 0); beam.add(b3);
  beam.position.set(-3.4, 0, -42);
  S.add(beam); S.userData.beam = beam;
  /* 洞顶天光开口：让光柱有明确的来源（外圈散射 + 内圈高亮） */
  add(S, new THREE.CircleGeometry(17.5, 22),
    basic(0x8FC8F0, { transparent:true, opacity:0.34, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    -3.4, 41.5, -42, { rot:[Math.PI/2, 0, 0], cast:false, recv:false }).renderOrder = 2;
  add(S, new THREE.CircleGeometry(9.0, 20),
    basic(0xE4F4FF, { transparent:true, opacity:0.74, additive:true, side:THREE.DoubleSide, depthWrite:false, fog:false }),
    -3.4, 41.2, -42, { rot:[Math.PI/2, 0, 0], cast:false, recv:false }).renderOrder = 2;
  /* 开口处的大范围辉光（Sprite 恒面向相机）：把洞顶中央真正照亮 */
  var gTop = glowSprite(0xCFE9FF, 62, 0.55); gTop.position.set(-3.4, 33, -42); S.add(gTop);
  var gTop2 = glowSprite(0xF2FAFF, 30, 0.42); gTop2.position.set(-3.4, 38, -42); S.add(gTop2);

  /* 大发光晶体 */
  var crystals = [];
  function pc(x, z, h, c1, c2, glow, sc){
    var cl = crystalCluster({ h: h, color: c1, color2: c2, n: 4, sides: 5, glow: glow });
    cl.position.set(x, chh(x,z), z);
    if (sc) cl.scale.setScalar(sc);
    cl.userData.phase = rr(0, 6.28);
    S.add(cl); crystals.push(cl);
    /* 晶体脚下的冷光晕 */
    var pool = add(S, new THREE.PlaneGeometry(h*1.5, h*1.5),
      basic(c1, { transparent:true, opacity:0.30, additive:true, depthWrite:false }),
      x, chh(x,z) + 0.16, z, { rot:[-Math.PI/2,0,0], cast:false, recv:false });
    pool.renderOrder = 1;
    return cl;
  }
  pc(-7.0, -13, 9.5, 0x59D5ED, 0x9E5EE8, 0.85);
  pc( 6.6, -17, 11.0, 0x7FD8F0, 0xE55AC7, 0.85);
  pc(-5.4, -30, 8.0, 0x59D5ED, 0x9E5EE8, 0.78);
  pc( 8.6, -36, 9.0, 0xE55AC7, 0x59D5ED, 0.76);
  pc(-10.0, -46, 7.0, 0x9E5EE8, 0xE55AC7, 0.72);
  pc( 4.0, -54, 7.4, 0x59D5ED, 0x9E5EE8, 0.72);
  pc(-13.5, -22, 6.0, 0xE55AC7, 0x9E5EE8, 0.70);
  pc( 12.5, -25, 6.6, 0x9E5EE8, 0x59D5ED, 0.70);
  for (var k = 0; k < 52; k++){
    var s2 = rnd() < 0.5 ? -1 : 1;
    var cc2 = crystalCluster({ h: rr(1.2, 3.8), color: pick([0x9E5EE8, 0xE55AC7, 0x59D5ED, 0x7FD8F0]), n: 3, sides: 5, glow: 0.62 });
    var kx = s2*rr(6, 36), kz = -rr(6, 160);
    cc2.position.set(kx, chh(kx, kz), kz);
    S.add(cc2); crystals.push(cc2);
  }
  /* 贴地小晶芽，把地面填满晶簇感 */
  for (var k2 = 0; k2 < 40; k2++){
    var s5 = rnd() < 0.5 ? -1 : 1;
    var qx = s5*rr(5, 30), qz = -rr(4, 140);
    var qc = crystalCluster({ h: rr(0.5, 1.1), color: pick([0x9E5EE8, 0xE55AC7, 0x59D5ED]), n: 2, sides: 5, glow: 0.55 });
    qc.position.set(qx, chh(qx, qz), qz);
    S.add(qc); crystals.push(qc);
  }
  /* 洞顶倒挂晶簇：参考图洞顶垂下的蓝紫钟乳晶，天光柱两侧最密 */
  for (var hg = 0; hg < 16; hg++){
    var hx = rr(-18, 18), hz = -rr(6, 72);
    var hc = crystalCluster({ h: rr(2.2, 4.6), color: pick([0x59D5ED, 0x7FD8F0, 0x9E5EE8, 0xE55AC7]), n: 2, sides: 5, glow: 0.62 });
    hc.position.set(hx, rr(16.5, 21.5), hz);
    hc.rotation.x = Math.PI;
    S.add(hc); crystals.push(hc);
  }
  /* 天光柱两侧的地标级倒挂巨晶 */
  var hb1 = crystalCluster({ h: 7.2, color: 0x59D5ED, color2: 0x9FE9F6, n: 3, sides: 6, glow: 0.7 });
  hb1.position.set(-9.5, 19.5, -38); hb1.rotation.x = Math.PI; S.add(hb1); crystals.push(hb1);
  var hb2 = crystalCluster({ h: 6.0, color: 0x9E5EE8, color2: 0xE55AC7, n: 2, sides: 6, glow: 0.7 });
  hb2.position.set(5.5, 18.5, -50); hb2.rotation.x = Math.PI; S.add(hb2); crystals.push(hb2);
  /* 参考图的两个色彩焦点（确定性，不消耗随机数）：
     左中品红大晶簇（屏幕 15-32%, 35-68%）+ 右上橙红晶簇（75% 处暖色锚点） */
  var gc1 = gemCluster(10.5, 0xE55AC7, 0xF08FD8, 0.9);
  gc1.position.set(-11, chh(-11, -20), -20); S.add(gc1);
  crystals.push(gc1); gc1.userData.phase = 1.3;
  var gc2 = gemCluster(7.5, 0xE8734F, 0xF0A060, 0.85);
  gc2.position.set(10.5, chh(10.5, -14), -14); S.add(gc2);
  crystals.push(gc2); gc2.userData.phase = 2.9;
  /* 两簇脚下的彩色光晕 */
  add(S, new THREE.PlaneGeometry(14, 14),
    basic(0xE55AC7, { transparent:true, opacity:0.28, additive:true, depthWrite:false }),
    -11, chh(-11,-20) + 0.16, -20, { rot:[-Math.PI/2,0,0], cast:false, recv:false }).renderOrder = 1;
  add(S, new THREE.PlaneGeometry(10, 10),
    basic(0xE8734F, { transparent:true, opacity:0.26, additive:true, depthWrite:false }),
    10.5, chh(10.5,-14) + 0.16, -14, { rot:[-Math.PI/2,0,0], cast:false, recv:false }).renderOrder = 1;

  /* 角色脚下向深处延伸的青蓝发光地砖路径（规范 6C.2） */
  for (var ti = 0; ti < 8; ti++){
    var tz = -3.2 - (ti + 1)*4.0;
    var tx = -1.75 + Math.sin(ti*1.7)*0.8;
    var tile = add(S, new THREE.BoxGeometry(2.2, 0.12, 2.2),
      M(0x2A6A8E, { emissive: 0x3FB8E0, ei: 0.75 }),
      tx, chh(tx, tz) + 0.06, tz);
    tile.rotation.y = ti*0.35;
  }
  S.userData.crystals = crystals;

  var hero = createDragonAstronaut();
  hero.scale.setScalar(1.34);
  var hy = chh(-1.75, -3.2) + 0.20;
  hero.userData.baseY = hy;
  hero.position.set(-1.75, hy, -3.2);
  hero.rotation.y = 0.18;
  S.add(hero);

  /* 洞内发光孢子：青蓝为主 + 少量品红 */
  var mtC1 = motes({ n: 130, color: 0xA6F0FF, w: 26, y0: 0.5, y1: 18, z0: 2, z1: 80, size: 0.30, opacity: 0.90 });
  S.add(mtC1);
  var mtC2 = motes({ n: 60, color: 0xF0A6E8, w: 24, y0: 1, y1: 22, z0: 8, z1: 110, size: 0.26, opacity: 0.75 });
  S.add(mtC2);
  S.userData.motes = [mtC1, mtC2];

  /* ========================================================================
     M2 · cave 可玩闭环（GDD §4.7）：贴地函数导出 + 3 采集点 + 天光柱传送台 + VFX
     全部走 dseq / 纯参数 ⇒ 对全局 rnd() 零消耗，既有洞窟构图零漂移 */
  S.userData.ground = chh;                        /* 供 PlayerController 贴地采样 */

  var Rc = dseq(0xCA7E);
  var _cgemCols = [[0xD85CEA, 0x9FE9F6], [0xE8843C, 0xFFD27A], [0x58D7EF, 0xB06EE8]];
  var cgems = [];
  for (var cgi = 0; cgi < CAVE_GEMS.length; cgi++){
    var cgx = CAVE_GEMS[cgi][0], cgz = CAVE_GEMS[cgi][1];
    var cgm = musicShard(_cgemCols[cgi][0], _cgemCols[cgi][1], 0.9 + Rc()*0.2);
    var cgy = chh(cgx, cgz);
    cgm.position.set(cgx, cgy + 1.2, cgz);
    cgm.rotation.y = Rc()*6.283;
    cgm.userData.groundY = cgy;
    cgm.userData.phase = Rc()*6.283;
    cgm.userData.rotY0 = cgm.rotation.y;
    cgm.userData.taken = false;
    Collectible.register(cgm);
    S.add(cgm); cgems.push(cgm);
  }
  S.userData.gems = cgems;

  var cpad = portalPad(3.0);
  cpad.position.set(CAVE_PAD[0], chh(CAVE_PAD[0], CAVE_PAD[1]) + 0.02, CAVE_PAD[1]);
  S.add(cpad); S.userData.pad = cpad;

  VFX.attach(S);                                  /* 1 落地波纹 + 3 收集波纹池（cave 独立一份）*/

  return { scene: S, hero: hero, runnable: true };
}

/* ================================================================ BASE ==== */
function buildBase(){
  var S = new THREE.Scene();
  S.background = new THREE.Color(0x62A6D8);
  S.fog = new THREE.Fog(0xB6D4E2, 95, 490);
  S.add(makeSky(0x6FAEE2, 0xC8E2F2, 0xBAD6E2));

  S.add(new THREE.HemisphereLight(0xD4EAFF, 0x6B9A7A, 0.45));
  /* 补光：BASE 原先只有 hemi + sun 两盏，比其余场景少一层 → 建筑背光面过暗。
     强度压低到 0.16，避免叠加后把岛面草色洗淡 */
  var fillB = new THREE.DirectionalLight(0xDCEBF6, 0.16); fillB.position.set(34, 26, 48); S.add(fillB);
  var sun = new THREE.DirectionalLight(0xFFF7EA, 0.90);
  sun.position.set(-70, 110, 40); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  var sd = 30;
  sun.shadow.camera.left=-sd; sun.shadow.camera.right=sd; sun.shadow.camera.top=sd; sun.shadow.camera.bottom=-sd;
  sun.shadow.camera.near=1; sun.shadow.camera.far=300; sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.05;
  S.add(sun); S.add(sun.target); S.userData.sun = sun;

  /* 前景悬崖（玩家站立的高地） */
  function fh(x,z){
    var t = sstep((-z - 0.5)/7);
    return 1.65 - t*25 + Math.sin(x*0.45)*0.3 + Math.cos(z*0.5)*0.22;
  }
  function fcol(x,z,y){
    if (z < -7) return 0x678F70;
    var n = fbmv(x,z,0.12);
    if (z < -3.0 && n < 0.55) return 0xD0845C;
    /* 前景橙崖收窄到左侧：参考图橙崖只占底部左侧，右侧是绿草缓坡。
       用噪声扰动边界（edge≈1.1~8.1），既保证角色(x=0.51)站在橙崖上，又避免硬直缝 */
    if (z > -1.0){
      var ne = fbmv(x + 31, z - 17, 0.30);
      var edge = 4.9 + (ne - 0.5)*6.4;   /* edge∈[1.7,8.1]，角色(x=0.51)恒定落在橙崖上 */
      if (x < edge - 0.7) return n > 0.62 ? 0xE39A72 : (n > 0.38 ? 0xD98A64 : 0xC97A56);
      if (x < edge + 0.5) return 0xBE7A5C;   /* 崖沿暗带：让橙崖读出"落差"而不是平铺色块 */
    }
    if (n > 0.6) return 0x8CBE7E;
    return 0x74A868;
  }
  var fm = new THREE.Mesh(planeTerrain(140, 60, 34, 20, fh, fcol, 0.10),
    new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true, map: terrainTex() }));
  fm.receiveShadow = true; fm.castShadow = true;
  S.add(fm);

  /* 环绕海面：参考图基地是悬于海面云层之上的巨岛，海平线与雾融为一体 */
  var ocean = add(S, new THREE.CircleGeometry(1600, 42),
    M(0x74B4D2, { emissive: shade(0x74B4D2, 0.24), ei: 1 }),
    0, -21, -300, { rot: [-Math.PI/2, 0, 0], cast: false, recv: false });
  ocean.renderOrder = -3;
  /* 近岛处加深一圈，做出浅滩→深海的层次 */
  add(S, new THREE.RingGeometry(60, 1600, 42),
    M(0x619FC6, { emissive: shade(0x619FC6, 0.22), ei: 1 }),
    0, -21.15, -300, { rot: [-Math.PI/2, 0, 0], cast: false, recv: false });
  for (var i = 0; i < 12; i++){
    var xx = rr(-28, 28), zz = rr(-6, -1);
    add(S, new THREE.IcosahedronGeometry(rr(0.6,1.5), 0), M(shade(0x8B9E9A, rr(0.86,1.10))),
      xx, fh(xx,zz) + rr(-2.2,-0.4), zz).rotation.set(rr(0,3),rr(0,3),rr(0,3));
  }
  for (var j = 0; j < 10; j++){
    var bx = rr(-24, 24), bz = rr(-2, 16);
    /* 英雄正前方留出视觉走廊，且近处树降矮避免糊脸 */
    if (Math.abs(bx - 0.51) < 2.6 && bz > 0.5 && bz < 8.5) continue;
    var tr = lowPolyTree({ h: bz > 2 ? rr(1.1, 2.0) : rr(1.6, 3.4), leaf: pick([0x6FA96A, 0x86B978, 0x557F67]) });
    tr.position.set(bx, fh(bx,bz), bz); S.add(tr);
  }
  /* 前左赭色崖岩（9 随机 + 3 固定补足 12，固定块不消耗随机数） */
  for (var ci = 0; ci < 9; ci++){
    var cx2 = -rr(5, 30), cz2 = rr(4, 14);
    var ck = add(S, new THREE.IcosahedronGeometry(rr(1.4, 3.0), 0), M(shade(0xD98652, rr(0.86,1.12))),
      cx2, fh(cx2, cz2) - rr(1.0, 3.0), cz2);
    ck.rotation.set(rr(0,3), rr(0,3), rr(0,3));
    ck.scale.set(1, rr(0.7,1.2), 1);
  }
  var fxRock = [[-7.5, 9.5, 2.6], [-12.0, 11.5, 3.1], [-4.2, 12.5, 2.2]];
  for (var fri = 0; fri < fxRock.length; fri++){
    var frp = fxRock[fri];
    var frk = add(S, new THREE.IcosahedronGeometry(frp[2], 0), M(shade(0xD98652, 0.98)),
      frp[0], fh(frp[0], frp[1]) - 1.6, frp[1]);
    frk.rotation.set(fri*0.7, fri*1.3, fri*0.5);
    frk.scale.set(1, 0.85, 1);
  }
  /* 前景点缀：橙崖上的开花矮丛 + 粉晶（全部确定性写法，零随机消耗 → 布局零漂移） */
  var fAcc = [[3.9, 5.4, 0xE86A9E], [5.6, 3.2, 0xF7D06A], [-3.4, 6.4, 0xC79BE0]];
  for (var fai = 0; fai < fAcc.length; fai++){
    var fp = fAcc[fai];
    var fg = new THREE.Group();
    for (var fbj = 0; fbj < 3; fbj++){
      var fbm = add(fg, new THREE.IcosahedronGeometry(0.30 - fbj*0.05, 0), M(shade(fp[2], 1.0 - fbj*0.06)),
        (fbj - 1)*0.24, 0.17 + fbj*0.02, (fbj % 2 ? 0.20 : -0.20));
      fbm.scale.set(1, 0.70, 1);
    }
    fg.position.set(fp[0], fh(fp[0], fp[1]) + 0.05, fp[1]);
    S.add(fg);
  }
  var fCry = gemCluster(1.05, 0xF080B8, 0xF7B0D2, 0.7);
  fCry.position.set(4.6, fh(4.6, 4.2), 4.2); S.add(fCry);

  /* 基地主岛：屏幕 ~ (0.35, 0.45)，宽 ~0.77 */
  var isl = floatingIsland({ r: 36, seg: 14, top: 0x74AB62, cliff: 0x86A08E, rock: 0x7C939A,
                             thick: 3.0, coneH: 26, chunks: 8, bumpy: 1.2 });
  isl.position.set(-12.0, -6.0, -46);
  /* 构图校正：1.08→1.12（逐行天空占比测得 cur 天空比参考多 5.7pt，略放大主岛回收天空）。
     纯缩放，不消耗 rnd、不影响 heroC */
  isl.scale.set(1.12, 0.66, 1.12);
  S.add(isl);
  /* 岛缘岩层分带：草皮 → 浅岩 → 深岩，形成参考图里的崖壁分层 */
  add(isl, new THREE.CylinderGeometry(35.6, 35.0, 2.4, 14, 1),
    M(0xC6D5CF, { emissive: shade(0xC6D5CF, 0.20), ei: 1 }), 0, 0.1, 0);
  add(isl, new THREE.CylinderGeometry(35.2, 34.4, 2.0, 14, 1),
    M(0xA9BDB8, { emissive: shade(0xA9BDB8, 0.16), ei: 1 }), 0, -1.1, 0);
  var turf = add(isl, new THREE.CylinderGeometry(34.8, 35.2, 1.4, 14, 1), M(0x6BA357), 0, 2.0, 0);
  var turfTop = add(isl, new THREE.CircleGeometry(34.4, 14), M(0x78AC63), 0, 2.72, 0,
    { rot:[-Math.PI/2,0,0] });

  /* 道路：中央圆台 + 放射状支路 + 环岛道 */
  add(isl, new THREE.CylinderGeometry(8, 8, 0.34, 10),
    M(0xE0E8E4, { emissive: shade(0xE0E8E4, 0.20), ei: 1 }), 0, 2.85, 0);
  for (var r = 0; r < 6; r++){
    var a = r*1.05;
    add(isl, new THREE.BoxGeometry(rr(12,21), 0.3, rr(2.0,3.2)),
      M(0xDCE5E0, { emissive: shade(0xDCE5E0, 0.20), ei: 1 }),
      Math.cos(a)*rr(7,17), 2.84, Math.sin(a)*rr(7,17)).rotation.y = a;
  }
  for (var r2 = 0; r2 < 16; r2++){
    var ar = r2/16*6.283;
    add(isl, new THREE.BoxGeometry(2.6, 0.26, 6.6), M(0xD5E0DA),
      Math.cos(ar)*20, 2.83, Math.sin(ar)*20).rotation.y = -ar;
  }

  /* 中心高塔：白色分段塔楼（参考图 x≈49% 居中的白塔，段间蓝窗带 + 顶部青光） */
  var tower = grp(isl, 2.0, 2.9, 0);
  var tSeg = [[2.3, 2.6, 7, 0xF2F5F4], [1.9, 2.2, 6, 0xDCE4E6], [1.5, 1.9, 6, 0xF2F5F4], [1.0, 1.6, 5, 0xDCE4E6]];
  var tY = 0;
  for (var tsi = 0; tsi < tSeg.length; tsi++){
    var tsp = tSeg[tsi];
    add(tower, new THREE.CylinderGeometry(tsp[0], tsp[1], tsp[2], 8), M(tsp[3],
      { emissive: shade(tsp[3], 0.24), ei: 1 }), 0, tY + tsp[2]/2, 0);
    /* 段间蓝窗带 */
    add(tower, new THREE.CylinderGeometry(tsp[0]*1.08, tsp[0]*1.08, 0.55, 8),
      M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.85 }), 0, tY + tsp[2], 0);
    tY += tsp[2];
  }
  add(tower, new THREE.OctahedronGeometry(1.3, 0), M(0x7FD2EC, { emissive: 0x62BEE0, ei: 0.9 }), 0, tY + 1.6, 0);
  add(tower, new THREE.TorusGeometry(1.7, 0.22, 3, 14), M(0x7FD2EC, { emissive: 0x54AED2, ei: 0.6 }),
      0, tY + 1.6, 0, { rot:[Math.PI/2,0,0] });
  /* 圆顶观测站 */
  var dome = grp(isl, 13.0, 2.9, -6.0);
  add(dome, new THREE.CylinderGeometry(3.6, 3.9, 2.2, 12), M(0xDCE6E8), 0, 1.1, 0);
  add(dome, new THREE.SphereGeometry(3.6, 14, 7, 0, Math.PI*2, 0, Math.PI/2), M(0x8FD8E8), 0, 2.2, 0);

  /* 白色模块建筑：多层楼 + 冷光窗带（对应参考基地的发光窗建筑群） */
  for (var b = 0; b < 17; b++){
    var a2 = rr(0,6.283), d2 = rr(9, 28);
    var bg = grp(isl, Math.cos(a2)*d2, 2.9, Math.sin(a2)*d2);
    bg.rotation.y = rr(0, 3);
    var bw = rr(3.4, 7.0), bh = rr(1.6, 4.2), bd = rr(2.6, 5.2);
    add(bg, new THREE.BoxGeometry(bw, bh, bd),
      M(0xE4ECEE, { emissive: shade(0xE4ECEE, 0.26), ei: 1 }), 0, bh/2, 0);
    /* 屋顶压边 */
    add(bg, new THREE.BoxGeometry(bw*0.94, 0.34, bd*0.94), M(0xAEBEC2), 0, bh + 0.17, 0);
    /* 逐层冷光窗带：四面都做（正面/背面 + 左右两侧）——参考图建筑任意朝向都有发光窗，
       现状只做两面，转视角即穿帮。纯几何追加、复用已算好的 bw/bh/bd → 零 rnd 消耗 */
    var floors = Math.max(1, Math.round(bh / 1.1));
    for (var f = 0; f < floors; f++){
      var fy = 0.55 + f * (bh / floors);
      add(bg, new THREE.BoxGeometry(bw*0.66, 0.34, 0.14),
        M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.85 }), 0, fy, bd/2 + 0.07);
      add(bg, new THREE.BoxGeometry(bw*0.66, 0.34, 0.14),
        M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.85 }), 0, fy, -bd/2 - 0.07);
      add(bg, new THREE.BoxGeometry(0.14, 0.34, bd*0.66),
        M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.85 }), bw/2 + 0.07, fy, 0);
      add(bg, new THREE.BoxGeometry(0.14, 0.34, bd*0.66),
        M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.85 }), -bw/2 - 0.07, fy, 0);
    }
    /* 入口：正面底部深色门洞 + 门头冷光条（让建筑有"可进入"的暗示，而非实心盒） */
    add(bg, new THREE.BoxGeometry(bw*0.30, bh*0.52, 0.10), M(0x33505C), 0, bh*0.26, bd/2 + 0.05);
    add(bg, new THREE.BoxGeometry(bw*0.38, 0.20, 0.12),
      M(0x9FE4F5, { emissive: 0x63C8E8, ei: 0.90 }), 0, bh*0.56, bd/2 + 0.06);
    /* 屋顶设备 */
    if (rnd() < 0.65) add(bg, new THREE.CylinderGeometry(0.46, 0.66, rr(1.1, 2.6), 6),
      M(0xC6D4D8, { emissive: shade(0xC6D4D8, 0.20), ei: 1 }),
      rr(-bw*0.42, bw*0.42), bh + 0.7, rr(-bd*0.42, bd*0.42));
    if (rnd() < 0.45) add(bg, new THREE.BoxGeometry(bw*0.34, 0.5, bd*0.34),
      M(0x8FD8EC, { emissive: 0x59BCDF, ei: 0.60 }),
      rr(-bw*0.30, bw*0.30), bh + 0.5, rr(-bd*0.30, bd*0.30));
  }
  /* 大型白色圆柱设施 */
  var big = grp(isl, 9.5, 2.9, 9.0);
  add(big, new THREE.CylinderGeometry(4.2, 4.4, 4.4, 10), M(0xDCE6E8), 0, 2.2, 0);
  add(big, new THREE.CylinderGeometry(4.5, 4.5, 0.5, 10), M(0x9CAEB0), 0, 4.6, 0);
  add(big, new THREE.CylinderGeometry(1.0, 1.0, 1.4, 8), M(0x7FD2EC, { emissive:0x4FA8CC, ei:0.45 }), 0, 5.4, 0);

  /* 深蓝太阳能板 */
  for (var s = 0; s < 7; s++){
    var a3 = rr(0,6.283), d3 = rr(11, 28);
    var pg = grp(isl, Math.cos(a3)*d3, 2.9, Math.sin(a3)*d3);
    add(pg, new THREE.CylinderGeometry(0.15, 0.15, 1.8, 5), M(0x9CAEB0), 0, 0.9, 0);
    var pw = rr(3.6,5.4), pd = rr(2.2,3.2);
    add(pg, new THREE.BoxGeometry(pw, 0.22, pd), M(0x426881), 0, 1.9, 0, { rot:[-0.42,0,0] });
    add(pg, new THREE.BoxGeometry(pw*0.9, 0.07, pd*0.88), M(0x31536A), 0, 1.99, 0, { rot:[-0.42,0,0] });
    pg.rotation.y = rr(0,3);
  }

  /* 树（含红树强调） */
  for (var t = 0; t < 36; t++){
    var a4 = rr(0,6.283), d4 = rr(3, 30);
    var tt = lowPolyTree({ h: rr(2.0, 4.8), leaf: pick([0x7FB56E, 0x557F67, 0x9ACB82, 0x6BA268]) });
    tt.position.set(Math.cos(a4)*d4, 2.9, Math.sin(a4)*d4); isl.add(tt);
  }
  /* 开花矮丛：岛面花点，柔化建筑区与草地的过渡 */
  for (var fb2 = 0; fb2 < 22; fb2++){
    var a7 = rr(0,6.283), d7 = rr(3, 31);
    var fbh = bush({ s: rr(0.35, 0.75), color: pick([0xE86A9E, 0xF7D06A, 0xFFF3E0, 0xC79BE0, 0x9ACB82]) });
    fbh.position.set(Math.cos(a7)*d7, 2.9, Math.sin(a7)*d7); isl.add(fbh);
  }
  /* S2 细节层：岛面地被草丛 + 云影（走 dseq 独立随机流，零全局 rnd → 布局零漂移） */
  var Rgb = dseq(0xC0DE), gcsB = [0x5FA85A, 0x4E9B3E, 0x6BA268];
  for (var gtb = 0; gtb < 26; gtb++){
    var gbx = (Rgb()*2 - 1)*31, gbz = (Rgb()*2 - 1)*31;
    if (gbx*gbx + gbz*gbz > 930) continue;
    var gub = grassTuft({ n: 6, h: 0.40 + Rgb()*0.28, seed: 0x300 + gtb,
                          c: gcsB[Math.floor(Rgb()*gcsB.length)] });
    gub.position.set(gbx, 2.75, gbz); isl.add(gub);
  }
  var cshB = [[9, -6, 12, 0.26], [-12, 8, 14, 0.22], [4, 14, 10, 0.24]];
  for (var cbI = 0; cbI < cshB.length; cbI++){
    var cpB = cshB[cbI];
    var csMB = cloudShadow(cpB[2], cpB[3]);
    csMB.position.set(cpB[0], 2.74, cpB[1]); isl.add(csMB);
  }
  /* 冷蓝灰棱岩点缀 */
  for (var br = 0; br < 22; br++){
    var ab = rr(0,6.283), db = rr(4, 31);
    var bkr = blueRock({ r: rr(0.8, 2.1), n: ri(1, 2), color: pick([0x5E7183, 0x51637A, 0x6B7E90]) });
    bkr.position.set(Math.cos(ab)*db, 2.9, Math.sin(ab)*db); isl.add(bkr);
  }
  /* 半球玻璃穹顶：基地的科技感点缀 */
  for (var dm = 0; dm < 5; dm++){
    var a5 = rr(0,6.283), d5 = rr(6, 27);
    var dg = grp(isl, Math.cos(a5)*d5, 2.9, Math.sin(a5)*d5);
    var dr = rr(1.8, 3.2);
    add(dg, new THREE.CylinderGeometry(dr*1.04, dr*1.04, 0.36, 12), M(0xD6E2E4), 0, 0.18, 0);
    add(dg, new THREE.SphereGeometry(dr, 12, 6, 0, Math.PI*2, 0, Math.PI/2),
      M(0x9FE0F2, { emissive: shade(0x9FE0F2, 0.44), ei: 1, transparent: true, opacity: 0.66 }), 0, 0.34, 0);
  }
  /* 天线桅杆（顶端红色航障灯） */
  for (var an = 0; an < 6; an++){
    var a6 = rr(0,6.283), d6 = rr(5, 28);
    var ag = grp(isl, Math.cos(a6)*d6, 2.9, Math.sin(a6)*d6);
    var mh = rr(4, 8);
    add(ag, new THREE.CylinderGeometry(0.09, 0.16, mh, 5), M(0x9CAEB0), 0, mh/2, 0);
    add(ag, new THREE.SphereGeometry(0.30, 8, 6), M(0xFF6B6B, { emissive: 0xFF5A5A, ei: 0.95 }), 0, mh, 0);
  }
  var redTree = lowPolyTree({ h: 7.0, leaf: 0xE45E6C, trunk: 0x8A5A5A, crown: 4 });
  redTree.position.set(-19.0, 2.9, 9.0); isl.add(redTree);

  /* 岛边瀑布 */
  var wf = waterfall(5.5, 26);
  wf.position.set(16, -0.5, 20); isl.add(wf);

  /* 远处浮岛群 */
  for (var f = 0; f < 20; f++){
    var ang = rr(-1.4, 1.4), dist = rr(130, 520);
    var fi = floatingIsland({ r: rr(4, 10), seg:9, top:0x7FB56E, cliff:0xA8BCAA, rock:0x9FB4B8,
                              thick:1.6, coneH:rr(3.5,7.5), chunks:3, bumpy:1 });
    fi.position.set(Math.sin(ang)*dist, rr(-6, 24) - dist*0.015, -Math.abs(Math.cos(ang))*dist - 60);
    fi.traverse(function(o){ o.castShadow = false; }); /* 远景不参与阴影 */
    S.add(fi);
  }
  /* 参考图基地天空无行星 —— 已删（bigPlanet 不消耗随机数，纯删除零漂移） */
  /* 岛缘瀑布群：右缘瀑布加宽加高、对准岛缘入海 */
  var wfA = waterfall(7.5, 40); wfA.position.set(27, -1.5, 8); isl.add(wfA);
  var wfB = waterfall(4.0, 24); wfB.position.set(-24, -2.0, 16); isl.add(wfB);
  addClouds(S, 0xFFFFFF, 14, 220, 500, 170, 3.8, 9.4, 30);
  /* 岛层云：让基地真的"浮"在云海之上 */
  addClouds(S, 0xFFFFFF, 9, 90, 300, 34, 4.2, 9.4, -26, 0);
  addClouds(S, 0xFFFFFF, 6, 160, 420, 24, 6.2, 11.4, -6, 0);

  /* S3 生命感：高空鸟群（走 dseq 独立随机流，零全局 rnd） */
  var birdsB = birdFlock({ n: 8, color: 0x4A5A70, cx: -6, cy: 30, cz: -84,
                           r: 40, speed: 0.09, seed: 0xB201 });
  S.add(birdsB);

  var hero = createDragonAstronaut();
  hero.scale.setScalar(0.80);
  hero.userData.baseY = fh(0.51, 3.0) + 0.05;
  hero.position.set(0.51, hero.userData.baseY, 3.0);

/* M3-CW ·《超频长阶》单赛道关（Overdrive Causeway）
   -----------------------------------------------------------------------------
   ▸ 与既有 4 场景**完全隔离**：不进 RENDER_ORDER（保 showcase 2×2 与四场景定帧门禁）；
     所有随机外观走 dseq 独立流（遵守 R2，不消耗全局 rnd/rr/ri/pick）；
     不开阴影贴图（英雄自带 blobShadow 伪影、随体移动，无需 1280m 阴影相机）。
   ▸ 赛道：宽 3.5m；双层 lo(贴地 y=0) / hi(悬浮 y=+0.9)；一次构建长几何、座位固定。
   ▸ 升降层**不写 hero.position.y**：让 scene.userData.ground 把层高算进 baseY，
     由既有 PlayerController(写 baseY) → poseHero(写 position.y) 链路自动生效。 */
var CW = {
  W: 3.5, FLOOR: 0, LAYER_HI: 0.9,
  Z_START: 4.0, Z_END: -1260.0, LEN: 1284,
  BASE: 11, SPRINT: 15, SPRINT_AT: 0.85,
  SWITCH_MS: 90, PITCH_MAX: 12, BUMP_DEG: 6,

/* 赛道贴图：暗底 + 霓虹网格 + 中央导引带（canvas 现画，遵守"禁 PBR/照片纹理"规范） */
var _cwTexCache = {};
function cwTex(kind){
  if (_cwTexCache[kind]) return _cwTexCache[kind];
  var S = 256, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  var g = cv.getContext('2d');
  g.fillStyle = (kind === 'hi') ? '#2A1550' : '#0E1A2E'; g.fillRect(0, 0, S, S);
  var edge = (kind === 'hi') ? 'rgba(255,79,216,' : 'rgba(24,224,255,';
  g.strokeStyle = edge + '0.34)'; g.lineWidth = 3;
  for (var i = 0; i <= 4; i++){ var p = i * S / 4; g.beginPath(); g.moveTo(0, p); g.lineTo(S, p); g.stroke(); }
  g.strokeStyle = edge + '0.16)'; g.lineWidth = 2;
  for (var j = 0; j <= 4; j++){ var q = j * S / 4; g.beginPath(); g.moveTo(q, 0); g.lineTo(q, S); g.stroke(); }
  var lg = g.createLinearGradient(0, 0, S, 0);
  lg.addColorStop(0.00, 'rgba(140,255,200,0)'); lg.addColorStop(0.42, 'rgba(140,255,200,0.14)');
  lg.addColorStop(0.50, 'rgba(210,255,240,0.36)'); lg.addColorStop(0.58, 'rgba(140,255,200,0.14)');
  lg.addColorStop(1.00, 'rgba(140,255,200,0)');

}
function buildCauseway(){

  S.fog = new THREE.Fog(0x0A1024, 70, 430);
  S.add(makeSky(0x14204E, 0x3A2060, 0x0A0718));
  S.add(new THREE.HemisphereLight(0xA8C0FF, 0x1A1030, 0.62));
  var key = new THREE.DirectionalLight(0xEAF2FF, 0.85); key.position.set(-26, 64, 34); S.add(key);
  var rim = new THREE.DirectionalLight(0xFF4FD8, 0.50); rim.position.set(32, 16, -46); S.add(rim);

  var midZ = CW.Z_START - CW.LEN / 2;

      0, -7.5, midZ, { cast: false, recv: false, rot: [-Math.PI / 2, 0, 0] });

  add(S, new THREE.PlaneGeometry(CW.W - 0.5, CW.LEN), hiMat, 0, CW.LAYER_HI, midZ,

  var pN = Math.floor(CW.LEN / 24) + 1;
  var pillars = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.13, CW.LAYER_HI, 0.13),
    M(0x2A3350, { emissive: 0x0B1830, ei: 1 }), pN * 2);
  var _m4 = new THREE.Matrix4();

  function rail(y, x, col, op){
    return add(S, new THREE.BoxGeometry(0.10, 0.10, CW.LEN),
      basic(col, { transparent: true, opacity: op, additive: true, fog: false, depthWrite: false }),
      x, y, midZ, { cast: false, recv: false });

  rail(CW.FLOOR + 0.05, -CW.W / 2, CW.LO, 0.85);            rail(CW.FLOOR + 0.05, CW.W / 2, CW.LO, 0.85);
  rail(CW.LAYER_HI + 0.05, -(CW.W - 0.5) / 2, CW.HI, 0.72); rail(CW.LAYER_HI + 0.05, (CW.W - 0.5) / 2, CW.HI, 0.72);

  /* 近处悬浮碎晶：贴赛道两侧掠过，强化"速度感"（每帧在 updateScene 里自转+浮动） */

      basic(qcol, { transparent: true, opacity: 0.52, additive: true, fog: false, depthWrite: false }),
      qside * (3.0 + Rs() * 4.5), 1.2 + Rs() * 6.5, CW.Z_START - Rs() * (CW.LEN - 20),
      { cast: false, recv: false, scale: [0.5 + Rs() * 1.6, 0.5 + Rs() * 1.6, 0.5 + Rs() * 1.6] });
    qm.userData.spin = 0.4 + Rs() * 1.6; qm.userData.ph = Rs() * 6.283; qm.userData.y0 = qm.position.y;
    shards.push(qm);
  }
  S.userData.shards = shards;

  /* 星尘（复用 motes：1 次 draw call） */
  var mtC1 = motes({ n: 150, color: 0xBFE8FF, w: 46, y0: 1, y1: 26, z0: 2, z1: 120, size: 0.26, opacity: 0.62 });
  var mtC2 = motes({ n: 70, color: 0xFF9CE8, w: 70, y0: 6, y1: 34, z0: 60, z1: 220, size: 0.40, opacity: 0.42 });
  S.add(mtC1); S.add(mtC2); S.userData.motes = [mtC1, mtC2];

  /* 英雄：3.5m 窄赛道上取 0.70 缩放（身高≈1.9u），与赛道宽相称、且追尾机位占比与四场景一致 */
  var hero = createDragonAstronaut();
  hero.scale.setScalar(0.70);
  hero.userData.baseY = CW.FLOOR;
  hero.position.set(0, CW.FLOOR, CW.Z_START);
  hero.rotation.y = 0;
  S.add(hero);

  /* 贴地函数 = 层高注入点：Track.layerY(0↔0.9) 直接进入 baseY ⇒ 升降层生效 */
  S.userData.ground = function(x, z){ return CW.FLOOR + Track.layerY; };

  /* 音游运行时挂载位（P2/P3 填充：谱面 / 障碍池 / 段落 / 镜头） */
  S.userData.cw = { obstacles: [], active: [] };

  return { scene: S, hero: hero, runnable: true };
}

}
