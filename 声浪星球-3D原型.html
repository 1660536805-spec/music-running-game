<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<link rel="icon" href="data:," />
<title>声浪星球 · 低多边形 3D（CC0 资产版）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#BFE9FF;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px 22px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .chip{background:rgba(255,255,255,.88);border:1px solid rgba(38,57,75,.10);border-radius:14px;
    padding:9px 14px;min-width:88px;backdrop-filter:blur(8px)}
  .chip small{display:block;font-size:10.5px;color:#93A6B5;letter-spacing:.04em;margin-bottom:2px}
  .chip b{font-size:16px;color:#26394B;font-weight:600}
  .chip.mid{text-align:center;flex:1;max-width:340px}
  .brand{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.88);
    border:1px solid rgba(38,57,75,.10);border-radius:14px;padding:9px 15px;backdrop-filter:blur(8px)}
  .logo{width:19px;height:19px;border-radius:50%;
    background:conic-gradient(from 20deg,#7FD99A,#6EC6F0,#A98BF0,#F2C14E,#7FD99A)}
  .brand b{font-size:13px;color:#26394B;font-weight:600;letter-spacing:.05em}
  .sec{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:15px;font-weight:600;color:#fff;letter-spacing:.22em;
    text-shadow:0 2px 14px rgba(38,57,75,.55);opacity:0;transition:opacity .5s;pointer-events:none}

  .bottom{display:flex;flex-direction:column;gap:12px;align-items:center}
  .energy{width:min(560px,86vw);height:9px;border-radius:6px;background:rgba(255,255,255,.55);
    overflow:hidden;border:1px solid rgba(38,57,75,.08)}
  .energy i{display:block;height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#5FD3C0,#F2C14E,#FF8A5B);transition:width .12s linear}
  .tips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .tips span{font-size:11.5px;color:#26394B;background:rgba(255,255,255,.88);
    border:1px solid rgba(38,57,75,.10);border-radius:999px;padding:6px 13px;backdrop-filter:blur(8px)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#CFEBFB 0%,#EAF6EE 55%,#FDF3DD 100%);z-index:20;padding:24px}
  .panel{background:rgba(255,255,255,.92);border:1px solid rgba(38,57,75,.10);border-radius:22px;
    padding:30px 32px;max-width:460px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(38,57,75,.12)}
  .panel h1{font-size:23px;margin:0 0 8px;color:#26394B;font-weight:600;letter-spacing:.02em}
  .panel p{font-size:13.5px;color:#5E7488;line-height:1.75;margin:0 0 20px}
  .panel p b{color:#2E7D5B}
  .panel .sw{display:flex;gap:7px;justify-content:center;margin-bottom:20px}
  .panel .sw i{width:20px;height:20px;border-radius:50%}
  .btn{border:none;border-radius:15px;padding:15px 22px;font-size:15px;font-weight:600;
    background:#2E7D5B;color:#fff;cursor:pointer;font-family:inherit;width:100%}
  .btn[disabled]{background:#B9C7C0;cursor:default}
  .btn.sec{background:rgba(255,255,255,.9);color:#26394B;border:1px solid rgba(38,57,75,.12);margin-top:10px}
  .rank{font-size:64px;font-weight:700;color:#F2C14E;line-height:1;margin-bottom:6px;
    text-shadow:0 4px 0 rgba(38,57,75,.10)}
  .stat{display:flex;gap:10px;margin:18px 0}
  .stat>div{flex:1;background:#F2F6F9;border-radius:14px;padding:12px 8px}
  .stat small{display:block;font-size:10.5px;color:#93A6B5;margin-bottom:4px}
  .stat b{font-size:17px;color:#26394B;font-weight:600}
  .bar{width:100%;height:8px;border-radius:6px;background:#E4EDF2;overflow:hidden;margin:6px 0 4px}
  .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5FD3C0,#F2C14E);border-radius:6px;transition:width .2s}
  .hint{font-size:11.5px;color:#93A6B5}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div class="flash" id="flash"></div>

<div class="hud">
  <div class="row">
    <div class="brand"><span class="logo"></span><b>声浪星球</b></div>
    <div class="chip mid"><small>《孤勇者》· 薄荷星球</small><b id="progressTxt">0%</b></div>
    <div class="chip" style="text-align:right"><small>得分</small><b id="scoreTxt">0</b></div>
  </div>
  <div class="row" style="align-items:flex-end">
    <div class="chip"><small>连击</small><b id="comboTxt">0</b></div>
    <div class="chip" style="text-align:right"><small>评级</small><b id="rankTxt">−</b></div>
  </div>
</div>
<div class="sec" id="secLabel"></div>

<div class="hud" style="justify-content:flex-end">
  <div class="bottom">
    <div class="energy"><i id="energyBar"></i></div>
    <div class="tips"><span>空格 / 点按 = 跳</span><span>穿过光环得分</span><span>镜头随歌曲段落切换</span></div>
  </div>
</div>

<!-- 加载 -->
<div class="overlay" id="loadOverlay">
  <div class="panel">
    <h1>正在加载星球资产…</h1>
    <p>Kenney Space Kit · 150 个 CC0 低多边形模型</p>
    <div class="bar"><i id="loadBar"></i></div>
    <div class="hint" id="loadTxt">0 / 0</div>
  </div>
</div>

<!-- 开始 -->
<div class="overlay hidden" id="startOverlay">
  <div class="panel">
    <div class="sw">
      <i style="background:#7FD99A"></i><i style="background:#5FD3C0"></i>
      <i style="background:#F2C14E"></i><i style="background:#FF8A5B"></i>
      <i style="background:#A98BF0"></i><i style="background:#6EC6F0"></i>
    </div>
    <h1>声浪星球 · 3D 原型</h1>
    <p>每一首歌，都是一颗星球。<br>这一版换上了 <b>Kenney Space Kit 真实低多边形模型</b>（CC0）：<br>宇航员会跑会跳、岩石水晶是美术做的、有真实投影。</p>
    <button class="btn" id="startBtn">开始降落</button>
    <button class="btn sec" id="skipBtn" style="display:none">跳过</button>
  </div>
</div>

<!-- 结算 -->
<div class="overlay hidden" id="endOverlay">
  <div class="panel">
    <div class="rank" id="endRank">S</div>
    <p style="margin-bottom:0">《孤勇者》· 薄荷星球 · 探索完成</p>
    <div class="stat">
      <div><small>最高连击</small><b id="endCombo">0</b></div>
      <div><small>完美率</small><b id="endAcc">0%</b></div>
      <div><small>得分</small><b id="endScore">0</b></div>
    </div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>

<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script>
(function(){
  'use strict';

  /* ============ 0. 基础环境 ============ */
  var SKY = 0xBFE9FF;
  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('stage').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  // 雾色与天空穹顶地平线色保持一致，让远景地形无缝融进天空（消除"雾墙"）
  var HORIZON = 0xD6EBFA;
  scene.fog = new THREE.Fog(HORIZON, 85, 245);
  var camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 3000);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8fb79c, 0.50));
  var sun = new THREE.DirectionalLight(0xfff0cf, 1.05);
  sun.position.set(-70, 110, -120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 420;
  var SH = 95;
  sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH;
  sun.shadow.camera.top = SH;   sun.shadow.camera.bottom = -SH;
  sun.shadow.bias = -0.0009;
  sun.shadow.normalBias = 0.05;
  scene.add(sun);
  scene.add(sun.target);

  /* ============ 1. 调色板 & 地形 ============ */
  var P = {grass:0x7FD99A, mint:0x5FD3C0, light:0xA7E8C1, sand:0xF3D9A4,
           mustard:0xF2C14E, coral:0xFF8A5B, berry:0xF56B96, lav:0xA98BF0, blue:0x6EC6F0};
  function shade(hex,k){
    var r=(hex>>16&255), g=(hex>>8&255), b=(hex&255);
    r=Math.max(0,Math.min(255,Math.round(r*k)));
    g=Math.max(0,Math.min(255,Math.round(g*k)));
    b=Math.max(0,Math.min(255,Math.round(b*k)));
    return (r<<16)|(g<<8)|b;
  }

  function f(x,z){
    var h = 2.7*Math.sin(z*0.042)*Math.cos(x*0.048);
    h += 2.1*Math.sin(z*0.086 + x*0.061);
    h += 1.0*Math.sin(z*0.158 - x*0.112);
    var carve = 1 - Math.exp(-Math.pow(Math.abs(x)/10, 2.1));
    return h*(0.12 + 0.88*carve);
  }

  function h2(x,z){ return Math.abs(Math.sin(x*12.9898 + z*78.233)*43758.5453)%1; }
  function vnoise(x,z,s){
    var gx=Math.floor(x*s), gz=Math.floor(z*s);
    var fx=x*s-gx, fz=z*s-gz;
    var ux=fx*fx*(3-2*fx), uz=fz*fz*(3-2*fz);
    var a=h2(gx,gz), b=h2(gx+1,gz), c=h2(gx,gz+1), d=h2(gx+1,gz+1);
    return (a*(1-ux)+b*ux)*(1-uz) + (c*(1-ux)+d*ux)*uz;
  }
  function fbm(x,z,s){ return vnoise(x,z,s)*0.65 + vnoise(x+31.7,z-17.3,s*3.1)*0.35; }

  var Z0 = 160, Z1 = -1300, dz = 4.5, X0 = -96, X1 = 96, dx = 6;
  var pos=[], col=[];
  function vtx(x,y,z,c){ pos.push(x,y,z); var t=new THREE.Color(c); col.push(t.r,t.g,t.b); }
  var zc, xc;
  for(zc=Z0; zc>Z1; zc-=dz){
    for(xc=X0; xc<X1; xc+=dx){
      var x2=xc+dx, z2=zc-dz;
      var a=f(xc,zc), b=f(x2,zc), d=f(xc,z2), e=f(x2,z2);
      var avg=(a+b+d+e)/4;
      var cx=xc+dx/2, cz=zc-dz/2;
      var base;
      if(avg>2.5) base = P.mustard;
      else if(avg>1.2) base = P.sand;
      else base = P.grass;
      var region = fbm(cx, cz, 0.013);
      var detail = fbm(cx+400, cz-260, 0.045);
      if(avg<=1.2){
        if(region>0.60) base = P.mint;
        else if(region>0.44) base = P.light;
        else base = P.grass;
      }
      if(avg<2.2){
        if(region>0.855) base = P.coral;
        else if(region<0.135) base = P.lav;
        else if(detail>0.905) base = P.light;
        else if(detail<0.085) base = P.berry;
      }
      vtx(xc,a,zc,shade(base,1.02)); vtx(x2,b,zc,shade(base,.90)); vtx(xc,d,z2,shade(base,1.08));
      vtx(x2,b,zc,shade(base,.90)); vtx(x2,e,z2,shade(base,.99)); vtx(xc,d,z2,shade(base,1.08));
    }
  }
  var tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  tg.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  tg.computeVertexNormals();
  var terrain = new THREE.Mesh(tg, new THREE.MeshPhongMaterial({vertexColors:true, flatShading:true, shininess:0}));
  terrain.receiveShadow = true; terrain.castShadow = true;
  scene.add(terrain);

  /* ============ 2. 天空：渐变穹顶 + 天体 ============ */
  function skyMat(color){
    return new THREE.MeshPhongMaterial({color:color, flatShading:true, shininess:0, fog:false});
  }
  (function(){
    var R = 1450;
    var dg = new THREE.SphereGeometry(R, 26, 18);
    var dp = dg.attributes.position, dc = [];
    var zenith = new THREE.Color(0x69BDF2);
    var horizon = new THREE.Color(HORIZON);
    var ground = new THREE.Color(HORIZON);   // 地平线以下同色，避免远处露出奶油色带
    for(var i=0;i<dp.count;i++){
      var y = dp.getY(i)/R;
      var c = y>0 ? horizon.clone().lerp(zenith, Math.pow(y,0.7))
                  : horizon.clone().lerp(ground, Math.pow(-y,0.7));
      dc.push(c.r,c.g,c.b);
    }
    dg.setAttribute('color', new THREE.Float32BufferAttribute(dc,3));
    var dome = new THREE.Mesh(dg, new THREE.MeshBasicMaterial({
      vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false
    }));
    dome.renderOrder = -1;
    scene.add(dome);
  })();
  function skyBall(r,color,detail,color2){
    var g = new THREE.IcosahedronGeometry(r, detail||1);
    if(color2){
      var pa = g.attributes.position, ca = [];
      var c1 = new THREE.Color(color), c2 = new THREE.Color(color2);
      for(var i=0;i<pa.count;i++){
        var y = pa.getY(i)/r;
        var c = c2.clone().lerp(c1, (y*0.5+0.5));
        ca.push(c.r,c.g,c.b);
      }
      g.setAttribute('color', new THREE.Float32BufferAttribute(ca,3));
      return new THREE.Mesh(g, new THREE.MeshPhongMaterial({vertexColors:true, flatShading:true, shininess:0, fog:false}));
    }
    return new THREE.Mesh(g, skyMat(color));
  }
  var bigPlanet = skyBall(54, 0x8FE0B4, 2, 0x2E7D6B);
  bigPlanet.position.set(-205, 104, -470);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(82, 3.6, 4, 46), skyMat(0xF3D9A4));
  ring.position.copy(bigPlanet.position); ring.rotation.set(1.15, .3, .2);
  scene.add(bigPlanet); scene.add(ring);
  var moon = skyBall(20, 0xB6A6F5, 1, 0x5B4E9E); moon.position.set(196, 62, -455); scene.add(moon);
  var sunBall = skyBall(28, 0xFFF6CE, 2, 0xF2C14E); sunBall.position.set(-118, 168, -530); scene.add(sunBall);
  var farPlanet = skyBall(31, 0xFFB998, 1, 0xB4553A); farPlanet.position.set(96, 176, -560); scene.add(farPlanet);

  /* ============ 3. 资产加载 ============ */
  var loader = new THREE.GLTFLoader();
  var bank = {};
  var NEED = [
    'astronautA','alien','rock','rock_largeA','rock_largeB','rocks_smallA','rocks_smallB',
    'rock_crystals','rock_crystalsLargeA','rock_crystalsLargeB','meteor_half','crater','craterLarge',
    'platform_low','pipe_ring','machine_wireless','satelliteDish_large','terrain_rampLarge',
    'hangar_roundA','rocket_baseA','rocket_topA','gate_simple','monorail_trackStraight','monorail_trainFlat'
  ];

  var loadBar = document.getElementById('loadBar');
  var loadTxt = document.getElementById('loadTxt');
  var done = 0;

  function relight(root, palette, emissive){
    root.traverse(function(o){
      if(!o.isMesh) return;
      var key = (o.material && o.material.name) || '';
      var col;
      if(palette && palette[key] != null) col = palette[key];
      else if(o.material && o.material.color) col = o.material.color.getHex();
      else col = 0xffffff;
      var m = new THREE.MeshPhongMaterial({color:col, flatShading:true, shininess:0});
      if(emissive && emissive[key] != null){
        m.emissive = new THREE.Color(emissive[key]);
      }
      o.material = m;
      o.castShadow = true; o.receiveShadow = true;
    });
  }

  var proto = {};
  // 把模型归一化：①缩放到指定高度 ②水平居中 ③底面贴地(y=0)
  // 关键：glTF 模型自带位置偏移，必须烘焙进一个内层 Group，
  //       这样外层 Group 的 position 才能自由用于摆放。
  function makeProto(key, name, targetH, palette, emissive){
    var src = bank[name];
    if(!src){ console.warn('[missing asset]', name); return null; }
    var inner = src.clone(true);
    relight(inner, palette, emissive);
    inner.updateMatrixWorld(true);

    var box = new THREE.Box3().setFromObject(inner);
    var sz = box.getSize(new THREE.Vector3());
    var s = targetH/(sz.y||1);
    inner.scale.multiplyScalar(s);
    inner.updateMatrixWorld(true);

    var b2 = new THREE.Box3().setFromObject(inner);
    inner.position.set(-(b2.min.x+b2.max.x)/2, -b2.min.y, -(b2.min.z+b2.max.z)/2);
    inner.updateMatrixWorld(true);

    var b3 = new THREE.Box3().setFromObject(inner);
    var wrap = new THREE.Group();
    wrap.add(inner);
    proto[key] = {obj:wrap, size:b3.getSize(new THREE.Vector3())};
    return proto[key];
  }
  function inst(key){
    var p = proto[key];
    if(!p) return null;
    var o = p.obj.clone(true);
    o.userData.footY = 0;
    o.userData.size = p.size;
    return o;
  }

  /* ============ 4. 场景搭建（加载完成后执行） ============ */
  var hero = new THREE.Group();
  scene.add(hero);
  var HERO_LIMBS = {};

  var props = [];
  var deco = [];
  var landMarks = [];

  // 道具与装饰的资源清单
  var DECO_TABLE = [
    {k:'rsA',  n:'rocks_smallA',       h:0.9,  w:16},
    {k:'rsB',  n:'rocks_smallB',       h:1.3,  w:14},
    {k:'met',  n:'meteor_half',        h:1.6,  w:8},
    {k:'rk',   n:'rock',               h:1.9,  w:14},
    {k:'rlA',  n:'rock_largeA',        h:3.2,  w:8},
    {k:'rlB',  n:'rock_largeB',        h:3.6,  w:8},
    {k:'rcLA', n:'rock_crystalsLargeA',h:3.9,  w:6},
    {k:'rcLB', n:'rock_crystalsLargeB',h:4.2,  w:6},
    {k:'mw',   n:'machine_wireless',   h:3.4,  w:5},
    {k:'ali',  n:'alien',              h:2.7,  w:4}
  ];

  function buildHero(){
    var p = makeProto('hero', 'astronautA', 2.85, {'metal':0xFFFFFF,'metalDark':0xE4EAF0,'dark':0x2B3B4E,
                                                   'metalRed':0xFF8A5B,'skin':0xFFC7A8});
    if(!p) return;
    var o = inst('hero');
    hero.add(o);
    hero.userData.footY = 0;
    o.traverse(function(c){ if(c.name) HERO_LIMBS[c.name] = c; });
  }

  function buildDeco(){
    DECO_TABLE.forEach(function(t){ makeProto(t.k, t.n, t.h); });
    makeProto('crater','crater', 9);
    makeProto('craterL','craterLarge', 14);
    makeProto('dish','satelliteDish_large', 11);
    makeProto('ring','pipe_ring', 6);
    makeProto('ramp','terrain_rampLarge', 2.2);

    var pool = [];
    DECO_TABLE.forEach(function(t){ for(var i=0;i<t.w;i++) pool.push(t.k); });

    var i, z, side, x, gy, key, o;
    // ① 常规散布
    for(i=0;i<118;i++){
      z = -14 - Math.random()*1250;
      side = Math.random()<0.5 ? -1 : 1;
      x = side*(13 + Math.random()*78);
      gy = f(x,z);
      key = pool[(Math.random()*pool.length)|0];
      o = inst(key);
      if(!o) continue;
      o.position.set(x, gy + o.userData.footY - 0.12, z);
      o.rotation.y = Math.random()*6.283;
      scene.add(o); deco.push(o);
    }
    // ② 陨石坑（平铺在地面）
    for(i=0;i<16;i++){
      z = -40 - Math.random()*1200;
      side = Math.random()<0.5 ? -1 : 1;
      x = side*(16 + Math.random()*72);
      key = Math.random()<0.35 ? 'craterL' : 'crater';
      o = inst(key);
      if(!o) continue;
      gy = f(x,z);
      o.position.set(x, gy - 0.35, z);
      o.rotation.y = Math.random()*6.283;
      scene.add(o); deco.push(o);
    }
    // ③ 大型地标
    var LM = [
      {k:'hangar',  n:'hangar_roundA',  h:9,   x:-80, z:-380},
      {k:'gate',    n:'gate_simple',    h:9,   x: 48, z:-560},
      {k:'dish',    h:11, x:-62, z:-900},
      {k:'ring',    h:6,  x: 54, z:-1160}
    ];
    makeProto('hangar','hangar_roundA', 9);
    makeProto('gate','gate_simple', 9);
    LM.forEach(function(L){
      var zz = L.z + Math.random()*40;
      var oo = inst(L.k);
      if(!oo) return;
      oo.position.set(L.x, f(L.x,zz) + oo.userData.footY - 0.2, zz);
      oo.rotation.y = (Math.random()-0.5)*1.2;
      scene.add(oo); deco.push(oo); landMarks.push(oo);
    });
    // ④ 火箭发射台
    var rbx = 34, rbz = -700;
    var rb = inst('rocketBase'); if(rb){ rb.position.set(rbx, f(rbx,rbz)+rb.userData.footY-0.2, rbz); scene.add(rb); deco.push(rb); }
    var rt = inst('rocketTop');
    if(rt){
      var baseTop = f(rbx,rbz) + (rb ? rb.userData.size.y : 0) - 0.35;
      rt.position.set(rbx, baseTop, rbz); scene.add(rt); deco.push(rt);
      // 让火箭顶部随时间轻微旋转 -> 见 loop
      landMarks.push(rt);
    }
    // ⑤ 磁悬浮轨道
    for(i=0;i<9;i++){
      var tz = -330 - i*14;
      var tx = -72;
      var tr = inst('monorail_trackStraight');
      if(tr){ tr.position.set(tx, f(tx,tz)+tr.userData.footY+5.2, tz); scene.add(tr); deco.push(tr); }
    }
    var train = inst('monorail_trainFlat');
    if(train){ train.position.set(-72, f(-72,-380)+train.userData.footY+5.4, -380); scene.add(train); deco.push(train); landMarks.push(train); }
  }

  function buildProps(){
    makeProto('pad', 'platform_low', 2.0, {'metalRed':0xFF8A5B,'metal':0xFFFFFF,'metalDark':0xD8E0E8});
    makeProto('orb', 'rock_crystals', 2.2, {'crystal':0x8CFFD8,'rock':0xB06A4E,'rockTrack':0xC47A5C},
              {'crystal':0x1E7A56});

    var z = -80, n = 0, o;
    while(z > -1250){
      if(n%3 === 2){
        o = inst('orb');
        if(o){
          var oy = f(0,z) + 2.7;
          o.position.set(0, oy, z);
          o.userData.base = new THREE.Vector3(0, oy, z);
          o.userData.type = 'orb'; o.userData.hit = false;
          scene.add(o); props.push(o);
        }
      } else {
        o = inst('pad');
        if(o){
          var gy = f(0,z);
          o.position.set(0, gy + o.userData.footY - 0.1, z);
          o.userData.base = new THREE.Vector3(0, gy + o.userData.footY - 0.1, z);
          o.userData.type = 'pad'; o.userData.hit = false;
          scene.add(o); props.push(o);
        }
      }
      z -= 64 + Math.random()*26;
      n++;
    }
  }

  /* ============ 5. 玩法状态 ============ */
  var RUN = 1240;
  var off = 0, speed = 38;
  var jumpY = 0, vy = 0, grounded = true;
  var combo = 0, maxCombo = 0, score = 0, hits = 0, total = 0;
  var running = false, elapsed = 0, orbitA = 0;
  var beatFlash = 0, beatCount = 0;
  var sectionKey = '';

  var camPos = new THREE.Vector3(0, 42, 66);
  var camLook = new THREE.Vector3(0, 2, -10);

  function $(id){ return document.getElementById(id); }
  function sectionOf(p){
    if(p<0.07) return {k:'descend', label:'降落中'};
    if(p<0.36) return {k:'low',    label:'主歌 · 贴地跟随'};
    if(p<0.66) return {k:'high',   label:'副歌 · 拉高俯瞰'};
    if(p<0.90) return {k:'orbit',  label:'Drop · 环绕飞行'};
    return {k:'final', label:'尾声 · 绕星球环拍'};
  }
  function showSection(label){
    var el = $('secLabel'); el.textContent = label; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(function(){ el.style.opacity = 0; }, 1700);
  }

  var actx=null, master=null, nextBeat=0, bpm=128;
  function initAudio(){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.3; master.connect(actx.destination);
      nextBeat = actx.currentTime + 0.1;
    }catch(e){ actx = null; }
  }
  function kick(t){
    var o = actx.createOscillator(), g = actx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t+0.16);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.24);
  }
  function hat(t){
    var n = actx.createBufferSource();
    var buf = actx.createBuffer(1, 1024, actx.sampleRate);
    var dd = buf.getChannelData(0);
    for(var i=0;i<1024;i++) dd[i] = (Math.random()*2-1) * (1 - i/1024);
    n.buffer = buf;
    var hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6200;
    var g = actx.createGain(); g.gain.value = 0.15;
    n.connect(hp); hp.connect(g); g.connect(master); n.start(t);
  }
  function scheduleAudio(){
    if(!actx) return;
    while(nextBeat < actx.currentTime + 0.18){
      kick(nextBeat);
      if(beatCount % 2 === 1) hat(nextBeat);
      beatCount++;
      nextBeat += 60/bpm;
      (function(t){ setTimeout(function(){ beatFlash = 1; }, Math.max(0,(t-actx.currentTime)*1000)); })(nextBeat-60/bpm);
    }
  }

  function doJump(){
    if(!running || !grounded) return;
    vy = 11.0; grounded = false;
  }
  addEventListener('keydown', function(e){
    if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); doJump(); }
  });
  renderer.domElement.addEventListener('pointerdown', function(){ doJump(); });

  function reset(){
    off=0; speed=38; jumpY=0; vy=0; grounded=true;
    combo=0; maxCombo=0; score=0; hits=0; total=0;
    elapsed=0; orbitA=0; beatCount=0;
    props.forEach(function(o){ o.position.copy(o.userData.base); o.userData.hit=false; o.visible=true; });
    hero.position.set(0, f(0,0), 0);
    camPos.set(0, 48, 68); camLook.set(0, 2, -10);
  }

  function judge(type){
    total++;
    if(type==='pad'){
      if(!grounded && jumpY>0.25){ hits++; combo++; maxCombo=Math.max(maxCombo,combo);
        score += Math.round(120*(1+combo*0.03)); flashScreen(0.10); }
      else { combo=0; flashScreen(0.16); }
    } else {
      if(!grounded && jumpY>0.6){ hits++; combo++; maxCombo=Math.max(maxCombo,combo);
        score += Math.round(80*(1+combo*0.03)); flashScreen(0.08); }
    }
  }
  var flashT=0;
  function flashScreen(a){ flashT = a; }

  /* ============ 6. 主循环 ============ */
  var last = performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now-last)/1000); last = now;

    // 天空缓慢转动
    bigPlanet.rotation.y += dt*0.03;
    farPlanet.rotation.y += dt*0.05;
    sunBall.rotation.y += dt*0.07;
    moon.rotation.y += dt*0.04;

    if(running){
      elapsed += dt;
      off += speed*dt;
      var p = Math.min(1, off/RUN);

      terrain.position.z = off;
      var gy = f(0, -off);

      if(!grounded){
        vy -= 25*dt; jumpY += vy*dt;
        if(jumpY <= 0){ jumpY = 0; vy = 0; grounded = true; }
      }
      var bob = grounded ? Math.sin(elapsed*11)*0.08 : 0;
      hero.position.set(0, gy + jumpY + hero.userData.footY + bob, 0);
      hero.rotation.y = 0;                          // 面向 -Z（奔跑方向）
      hero.rotation.z = grounded ? Math.sin(elapsed*11)*0.05 : -0.22;
      hero.rotation.x = grounded ? 0 : -0.10;

      // 四肢摆动
      var ph = elapsed*11.5;
      if(HERO_LIMBS.armLeft){  HERO_LIMBS.armLeft.rotation.x  = grounded ? Math.sin(ph)*0.95 : -2.2; }
      if(HERO_LIMBS.armRight){ HERO_LIMBS.armRight.rotation.x = grounded ? -Math.sin(ph)*0.95 : -2.2; }
      if(HERO_LIMBS.legLeft){  HERO_LIMBS.legLeft.rotation.x  = grounded ? -Math.sin(ph)*0.95 : 0.5; }
      if(HERO_LIMBS.legRight){ HERO_LIMBS.legRight.rotation.x = grounded ? Math.sin(ph)*0.95 : -0.3; }

      // 道具推进
      for(var i=0;i<props.length;i++){
        var o = props[i];
        o.position.z += speed*dt;
        o.position.y = f(0, o.position.z - off) + (o.userData.type==='orb' ? 2.7 : o.userData.footY - 0.1);
        if(o.userData.type==='orb') o.rotation.y += dt*1.6;
        if(!o.userData.hit && o.position.z > -1.0 && o.position.z < 2.6){
          o.userData.hit = true; judge(o.userData.type);
        }
        if(o.position.z > 20) o.visible = false;
      }
      // 装饰推进（循环利用）
      for(i=0;i<deco.length;i++){
        deco[i].position.z += speed*dt;
        if(deco[i].position.z > 30){
          deco[i].position.z -= 1460;
        }
      }
      if(landMarks.length){
        for(i=0;i<landMarks.length;i++){ landMarks[i].rotation.y += dt*0.15; }
      }

      var s = sectionOf(p);
      if(s.k !== sectionKey){ sectionKey = s.k; showSection(s.label); }

      var hp = new THREE.Vector3(0, gy + jumpY + 1.7, 0);
      var tp = new THREE.Vector3(), tl = new THREE.Vector3(), k = 3.2, lk = 4.2;
      if(s.k==='descend'){
        var t = Math.min(1, p/0.07);
        tp.set(0, 30 - 25*t, 46 - 33*t);
        tl.copy(hp);
        k = 2.2;
      } else if(s.k==='low'){
        tp.set(0, hp.y + 2.4, 11.0); tl.copy(hp); tl.z -= 3.6;
      } else if(s.k==='high'){
        tp.set(0, hp.y + 14, 22); tl.copy(hp); tl.z -= 10; k = 2.6;
      } else if(s.k==='orbit'){
        orbitA += dt*0.95;
        tp.set(Math.cos(orbitA)*14, hp.y + 6.0 + Math.sin(orbitA*0.8)*1.7, Math.sin(orbitA)*14);
        tl.copy(hp); k = 2.4;
      } else {
        orbitA += dt*0.5;
        tp.set(Math.cos(orbitA)*27, hp.y + 7.5, Math.sin(orbitA)*27);
        tl.copy(hp); tl.y += 6; tl.z -= 12; k = 2.0;   // 抬高视线，把天空星球纳入画面
      }
      var f1 = 1-Math.exp(-k*dt), f2 = 1-Math.exp(-lk*dt);
      camPos.lerp(tp, f1); camLook.lerp(tl, f2);
      var shake = beatFlash*0.28;
      camera.position.set(camPos.x + (Math.random()-0.5)*shake, camPos.y + (Math.random()-0.5)*shake, camPos.z);
      camera.lookAt(camLook);

      $('scoreTxt').textContent = score.toLocaleString('en-US');
      $('comboTxt').textContent = combo;
      $('progressTxt').textContent = Math.round(p*100) + '%';
      $('energyBar').style.width = Math.min(100, combo*4) + '%';
      $('rankTxt').textContent = combo>=40?'S':combo>=24?'A':combo>=12?'B':'C';

      if(p>=1) finish();
    }

    // 阴影相机跟随
    sun.position.set(-62, 96, -70);
    sun.target.position.set(0, 0, 0);
    sun.target.updateMatrixWorld();

    beatFlash *= Math.exp(-6*dt);
    if(flashT>0.001) flashT *= Math.exp(-8*dt); else flashT = 0;
    $('flash').style.opacity = flashT.toFixed(3);
    if(actx) scheduleAudio();
    renderer.render(scene, camera);
  }

  function finish(){
    running = false;
    $('endCombo').textContent = maxCombo;
    $('endAcc').textContent = total? Math.round(hits/total*100)+'%' : '0%';
    $('endScore').textContent = score.toLocaleString('en-US');
    $('endRank').textContent = maxCombo>=40?'S':maxCombo>=24?'A':maxCombo>=12?'B':'C';
    $('endOverlay').classList.remove('hidden');
  }

  /* ============ 7. 启动 ============ */
  $('startBtn').onclick = function(){
    $('startOverlay').classList.add('hidden');
    initAudio();
    if(actx && actx.state==='suspended') actx.resume();
    reset(); running = true; last = performance.now();
  };
  $('againBtn').onclick = function(){
    $('endOverlay').classList.add('hidden');
    reset(); running = true; last = performance.now();
  };
  // 跳过按钮：直接进入各段落的代表时刻（用于截图 / 演示）
  window.__jumpTo = function(frac){
    $('startOverlay').classList.add('hidden');
    if(!running){ reset(); running = true; last = performance.now(); }
    var target = frac*RUN;
    var step = target/ (1/60) / 38;
    off = target; elapsed = target/38;
    terrain.position.z = off;
    props.forEach(function(o){
      o.position.copy(o.userData.base);
      o.position.z -= 0;
      o.visible = true; o.userData.hit = true;
    });
  };
  window.__ready = false;
  window.__dbg = function(){
    var b = new THREE.Box3().setFromObject(hero);
    return {
      heroChildren: hero.children.length,
      heroPos: hero.position.toArray().map(function(v){ return +v.toFixed(2); }),
      footY: hero.userData.footY,
      heroBox: [b.min.toArray().map(function(v){ return +v.toFixed(2); }),
                b.max.toArray().map(function(v){ return +v.toFixed(2); })],
      camPos: camera.position.toArray().map(function(v){ return +v.toFixed(2); }),
      camLook: camLook.toArray().map(function(v){ return +v.toFixed(2); }),
      limbs: Object.keys(HERO_LIMBS),
      protoKeys: Object.keys(proto),
      deco: deco.length, props: props.length, bank: Object.keys(bank).length
    };
  };

  addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  reset();

  // 逐个下载（避免并发过多），边下边报进度
  var idx = 0;
  function next(){
    if(idx >= NEED.length){
      buildHero(); buildDeco(); buildProps();
      window.__ready = true;
      $('loadTxt').textContent = '加载完成';
      $('loadOverlay').classList.add('hidden');
      $('startOverlay').classList.remove('hidden');
      last = performance.now();
      return;
    }
    var name = NEED[idx++];
    loader.load('./assets/' + name + '.glb', function(g){
      bank[name] = g.scene;
      done++;
      loadBar.style.width = Math.round(done/NEED.length*100) + '%';
      loadTxt.textContent = done + ' / ' + NEED.length;
      next();
    }, undefined, function(err){
      console.error('load failed', name, err);
      done++;
      loadBar.style.width = Math.round(done/NEED.length*100) + '%';
      loadTxt.textContent = done + ' / ' + NEED.length + '（' + name + ' 失败）';
      next();
    });
  }
  next();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
